<script>
/* ==========================================================================
   Calendar · Reminders / notification centre
   ========================================================================== */
let CAL = {mode:"month", cursor: todayISO(), show:{jobs:true,estimates:true,reminders:true,events:true}};

function calItems(from,to){
  const out=[];
  listOf("jobs").forEach(j=>{
    if(!j.scheduledDate || j.status==="cancelled") return;
    if(j.scheduledDate<from||j.scheduledDate>to) return;
    const c=cust(j.customerId), a=jobAddr(j);
    out.push({kind:"job", id:j.id, date:j.scheduledDate, time:j.scheduledTime||"",
      title: custLabel(j.customerId), sub: j.title||j.type||"Job",
      color: JOB_STATUS[j.status] ? JOB_STATUS[j.status].c : "var(--ink-3)",
      status:j.status, phone:c?c.phone:"", addr:a, dur:j.durationMin, emp:j.assignedTo, ref:j});
  });
  listOf("events").forEach(e=>{
    if(!e.date||e.date<from||e.date>to) return;
    out.push({kind:"event", id:e.id, date:e.date, time:e.time||"", title:e.title||"Event",
      sub: e.customerId?custLabel(e.customerId):(e.kind||""), color:"var(--s7)", dur:e.durationMin, ref:e,
      phone:e.customerId&&cust(e.customerId)?cust(e.customerId).phone:"", addr:e.customerId?jobAddrOfCustomer(e.customerId):null});
  });
  listOf("reminders").forEach(r=>{
    if(r.done) return; const d=dOnly(r.dueAt);
    if(!d||d<from||d>to) return;
    out.push({kind:"reminder", id:r.id, date:d, time:(String(r.dueAt).length>10?String(r.dueAt).slice(11,16):""),
      title:r.title, sub: r.customerId?custLabel(r.customerId):"Reminder", color:"var(--warn)", ref:r});
  });
  listOf("estimates").forEach(e=>{
    if(!e.apptDate||e.apptDate<from||e.apptDate>to) return;
    out.push({kind:"estimate", id:e.id, date:e.apptDate, time:e.apptTime||"", title:custLabel(e.customerId),
      sub:"Estimate visit · "+(e.title||e.number), color:"var(--s4)", ref:e,
      phone:cust(e.customerId)?cust(e.customerId).phone:"", addr:cust(e.customerId)?propOf(cust(e.customerId),e.propertyId):null});
  });
  return out.filter(x=>CAL.show[x.kind==="estimate"?"estimates":x.kind==="job"?"jobs":x.kind==="reminder"?"reminders":"events"])
            .sort((a,b)=> (a.date+(a.time||"99")) < (b.date+(b.time||"99")) ? -1 : 1);
}
function jobAddrOfCustomer(cid){ const c=cust(cid); return c? (c.properties&&c.properties[0]) || c.billing : null; }

function viewCalendar(){
  const cur = CAL.cursor, d = toDate(cur);
  let from,to,title;
  if(CAL.mode==="month"){ from=isoOf(new Date(d.getFullYear(),d.getMonth(),1)); to=isoOf(new Date(d.getFullYear(),d.getMonth()+1,0)); title=MONL[d.getMonth()]+" "+d.getFullYear(); }
  else if(CAL.mode==="week"){ from=startOfWeek(cur); to=addDays(from,6); title=fmtDate(from)+" – "+fmtDate(to); }
  else { from=cur; to=cur; title=DOW[d.getDay()]+", "+fmtDateFull(cur); }
  const gridFrom = CAL.mode==="month"? startOfWeek(from) : from;
  const gridTo   = CAL.mode==="month"? addDays(startOfWeek(from),41) : to;
  const items = calItems(gridFrom, gridTo);
  const inWin = items.filter(x=>x.date>=from&&x.date<=to);
  const jobsIn = inWin.filter(x=>x.kind==="job");
  const value = jobsIn.reduce((a,x)=>a+jobFinance(x.ref).subtotal,0);

  return '<div class="phead"><div class="ptitle"><h1>'+esc(title)+'</h1>'+
      '<div class="sub">'+jobsIn.length+' job'+(jobsIn.length===1?"":"s")+' worth '+money(value)+' · '+inWin.filter(x=>x.kind!=="job").length+' other item'+(inWin.filter(x=>x.kind!=="job").length===1?"":"s")+'</div></div>'+
    '<div class="pacts">'+
      '<div class="seg"><button data-calmode="day" aria-pressed="'+(CAL.mode==="day")+'">Day</button><button data-calmode="week" aria-pressed="'+(CAL.mode==="week")+'">Week</button><button data-calmode="month" aria-pressed="'+(CAL.mode==="month")+'">Month</button></div>'+
      '<button class="btn icon" data-calnav="-1" aria-label="Previous"><svg aria-hidden="true"><use href="#i-left"/></svg></button>'+
      '<button class="btn" data-calnav="0">Today</button>'+
      '<button class="btn icon" data-calnav="1" aria-label="Next"><svg aria-hidden="true"><use href="#i-right"/></svg></button>'+
      '<button class="btn pri" data-act="new-event"><svg aria-hidden="true"><use href="#i-plus"/></svg>Add to calendar</button>'+
    '</div></div>'+
    '<div class="filters">'+
      ['jobs','estimates','reminders','events'].map(k=>'<label class="check" style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px"><input type="checkbox" data-calshow="'+k+'"'+(CAL.show[k]?" checked":"")+'><span style="text-transform:capitalize">'+k+'</span></label>').join("")+
      '<span class="count">drag a job to move it</span></div>'+
    (CAL.mode==="month"? calMonth(from,gridFrom,items) : CAL.mode==="week"? calDays(from,to,items) : calDays(from,to,items));
}
function calMonth(monthStart, gridFrom, items){
  const mm = toDate(monthStart).getMonth();
  const byDay = {}; items.forEach(x=>{ (byDay[x.date]=byDay[x.date]||[]).push(x); });
  let cells="";
  for(let i=0;i<42;i++){
    const d = addDays(gridFrom,i), dt=toDate(d);
    const list = byDay[d]||[];
    const out = dt.getMonth()!==mm;
    const showN = 3;
    cells += '<div class="calcell'+(out?" out":"")+(d===todayISO()?" today":"")+'" data-day="'+d+'">'+
      '<div class="caldate"><span>'+dt.getDate()+'</span>'+(list.length>showN?'<span class="tiny muted">'+list.length+'</span>':'')+'</div>'+
      list.slice(0,showN).map(calChip).join("")+
      (list.length>showN?'<button class="calmore" data-dayopen="'+d+'">+'+(list.length-showN)+' more</button>':'')+
      '</div>';
  }
  return '<div class="card" style="overflow:hidden"><div class="calgrid" style="border-radius:11px">'+
    DOW.map(x=>'<div class="caldow">'+x+'</div>').join("")+cells+'</div></div>';
}
function calChip(x){
  return '<div class="calev'+(x.kind==="job"?'" draggable="true" data-drag-job="'+attr(x.id):'')+'" style="border-left-color:'+x.color+'" data-open="'+x.kind+':'+attr(x.id)+'" title="'+attr(x.title+" · "+x.sub)+'">'+
    (x.time?'<span class="cet">'+esc(fmtTime(x.time))+'</span>':'')+'<span class="cen">'+esc(x.title)+'</span></div>';
}
function calDays(from,to,items){
  const days=[]; let d=from; while(d<=to){ days.push(d); d=addDays(d,1); }
  return '<div class="stack">'+days.map(day=>{
    const list = items.filter(x=>x.date===day);
    const dt=toDate(day);
    const jobs=list.filter(x=>x.kind==="job");
    const val=jobs.reduce((a,x)=>a+jobFinance(x.ref).subtotal,0);
    return '<div class="card" data-day="'+day+'"><div class="chead" style="padding:9px 14px">'+
      '<h3 style="font-size:16px">'+esc(DOW[dt.getDay()])+' '+esc(fmtDate(day))+'</h3>'+
      (day===todayISO()?'<span class="pill p-brand">Today</span>':'')+
      (jobs.length?'<span class="tiny muted">'+jobs.length+' job'+(jobs.length===1?"":"s")+' · '+money(val)+'</span>':'')+
      (jobs.length>1?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+attr(routeUrl(jobs.map(x=>x.addr).filter(Boolean)))+'"><svg aria-hidden="true"><use href="#i-truck"/></svg>Route</a>':'')+
      '<button class="btn sm ghost" data-act="new-event" data-date="'+attr(day)+'"><svg aria-hidden="true"><use href="#i-plus"/></svg></button></div>'+
      '<div class="cbody" style="padding:10px 14px">'+
      (list.length? '<div class="daycol">'+list.map(x=>{
        const emp = x.emp? (listOf("employees").find(e=>e.id===x.emp)||{}).name : "";
        return '<div class="evcard" style="border-left-color:'+x.color+'" data-open="'+x.kind+':'+attr(x.id)+'"'+(x.kind==="job"?' draggable="true" data-drag-job="'+attr(x.id)+'"':'')+'>'+
          '<div class="e1"><span class="num tiny muted" style="min-width:52px">'+esc(x.time?fmtTime(x.time):"—")+'</span>'+
          '<span class="en">'+esc(x.title)+'</span>'+
          (x.kind==="job"?jobPill(x.status):'<span class="tag">'+esc(x.kind)+'</span>')+'</div>'+
          '<div class="e2" style="padding-left:52px">'+esc(x.sub)+
            (x.addr&&x.addr.street?'<span>· '+esc(x.addr.street)+(x.addr.city?", "+esc(x.addr.city):"")+'</span>':'')+
            (x.dur?'<span>· '+esc(durLabel(x.dur))+'</span>':'')+(emp?'<span>· '+esc(emp)+'</span>':'')+'</div>'+
          '<div class="e2" style="padding-left:52px">'+
            (x.phone?'<a href="tel:'+attr(digits(x.phone))+'" class="mono">'+esc(phoneFmt(x.phone))+'</a>':'')+
            (x.addr&&x.addr.street?'<a target="_blank" rel="noopener" href="'+attr(mapsUrl(x.addr))+'">navigate ↗</a>':'')+
          '</div></div>';
      }).join("")+'</div>' : '<div class="tiny muted">Nothing scheduled.</div>')+
      '</div></div>';
  }).join("")+'</div>';
}

function editEvent(id, date){
  const e = id? S.events[id] : {date: date||todayISO(), time:"09:00", durationMin:60, kind:"appointment"};
  const custs=listOf("customers").sort((a,b)=>custName(a).localeCompare(custName(b)));
  openModal({title: id?"Edit calendar entry":"Add to calendar",
    body:'<div class="stack">'+
      fText("title","What is it", e.title,{req:1,ph:"Supplier pickup, estimate visit, dentist…"})+
      '<div class="grid3">'+fDate("date","Date",e.date)+fTime("time","Time",e.time)+
        fSel("durationMin","How long", e.durationMin||60,[{v:30,l:"30 min"},{v:60,l:"1 hour"},{v:120,l:"2 hours"},{v:240,l:"Half day"},{v:480,l:"Full day"}])+'</div>'+
      '<div class="grid2">'+fSel("kind","Type", e.kind||"appointment",{appointment:"Appointment",estimate:"Estimate visit",personal:"Personal",business:"Business errand",other:"Other"})+
        fSel("customerId","Related customer", e.customerId||"", custs.map(x=>({v:x.id,l:custName(x)})),{blank:"— none —"})+'</div>'+
      fArea("notes","Notes", e.notes,{rows:2})+'</div>',
    foot:(id?'<button class="btn danger" data-act="del-event" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-trash"/></svg></button>':'')+
      '<span class="spacer"></span><button class="btn" data-mclose>Cancel</button><button class="btn pri" id="ev-save">Save</button>',
    onMount(root){ root.querySelector("#ev-save").addEventListener("click", async ()=>{
      const d=readForm(root); if(!d.title){ toast("Give it a title","err"); return; }
      const n=Object.assign({id: id||uid("v"), createdAt:nowISO()}, e, d); n.durationMin=num(d.durationMin);
      closeModal(); await put("events", n); toast("Saved");
    }); }});
}

/* ============================= reminders =============================== */
async function addReminder(o){
  const r = Object.assign({id:uid("r"), title:"", dueAt:todayISO(), kind:"custom", done:false, createdAt:nowISO()}, o);
  await put("reminders", r); return r;
}
function editReminder(id, preset){
  const r = id? S.reminders[id] : Object.assign({title:"",dueAt:todayISO(),time:"09:00",kind:"custom"}, preset||{});
  const custs=listOf("customers").sort((a,b)=>custName(a).localeCompare(custName(b)));
  const jobs=listOf("jobs").sort((a,b)=>(jobDate(b)||"")>(jobDate(a)||"")?1:-1).slice(0,80);
  openModal({title:id?"Edit reminder":"New reminder", size:"slim",
    body:'<div class="stack">'+
      fText("title","Remind me to", r.title,{req:1,ph:"Call John about the garage door estimate"})+
      '<div class="grid2">'+fDate("dueAt","On", dOnly(r.dueAt))+fTime("time","At", r.time|| (String(r.dueAt).length>10?String(r.dueAt).slice(11,16):"09:00"))+'</div>'+
      fSel("kind","Kind", r.kind||"custom",{custom:"General",callback:"Callback",estimate:"Estimate follow-up",invoice:"Chase payment",parts:"Order / collect parts",warranty:"Warranty follow-up",maintenance:"Scheduled maintenance",lead:"Lead follow-up"})+
      fSel("customerId","About which customer", r.customerId||"", custs.map(x=>({v:x.id,l:custName(x)})),{blank:"— none —"})+
      fSel("jobId","About which job", r.jobId||"", jobs.map(j=>({v:j.id,l:(j.number||"")+" · "+custLabel(j.customerId)+" · "+(j.title||j.type||"")})),{blank:"— none —"})+
      fArea("notes","Notes", r.notes,{rows:2})+'</div>',
    foot:(id?'<button class="btn danger" data-act="del-reminder" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-trash"/></svg></button>':'')+
      '<span class="spacer"></span><button class="btn" data-mclose>Cancel</button><button class="btn pri" id="rm-save">Save</button>',
    onMount(root){ root.querySelector("#rm-save").addEventListener("click", async ()=>{
      const d=readForm(root); if(!d.title){ toast("What should I remind you about?","err"); return; }
      const n=Object.assign({id:id||uid("r"), done:false, createdAt:nowISO()}, r, d);
      n.dueAt = d.dueAt + (d.time? "T"+d.time : "T09:00");
      closeModal(); await put("reminders", n); toast("Reminder set");
    }); }});
}

function viewNotifications(){
  const t=todayISO();
  const auto = autoReminders();
  const manual = listOf("reminders");
  const all = manual.map(r=>({r, auto:false})).concat(auto.map(a=>({r:a, auto:true})));
  const bucket = x=>{
    if(x.r.done) return "done";
    const d=dOnly(x.r.dueAt);
    if(d<t) return "overdue"; if(d===t) return "today"; return "upcoming";
  };
  const groups={overdue:[],today:[],upcoming:[],done:[]};
  all.forEach(x=> groups[bucket(x)].push(x));
  Object.keys(groups).forEach(k=> groups[k].sort((a,b)=> (a.r.dueAt||"")<(b.r.dueAt||"") ? (k==="done"?1:-1) : (k==="done"?-1:1)));

  const sec=(key,label,tone)=>{
    const list=groups[key]; if(!list.length && key!=="done") return "";
    const shown = key==="done"? list.slice(0,20) : list;
    return '<div class="card" style="margin-bottom:12px"><div class="chead"><h3>'+esc(label)+'</h3>'+
      '<span class="pill '+tone+'">'+list.length+'</span></div><div class="cbody tight">'+
      (shown.length? shown.map(x=>remRow(x.r, x.auto)).join("") : '<div class="tiny muted" style="padding:10px">Nothing here.</div>')+'</div></div>';
  };
  return '<div class="phead"><div class="ptitle"><h1>Reminders</h1>'+
      '<div class="sub">'+groups.overdue.length+' overdue · '+groups.today.length+' due today · '+groups.upcoming.length+' coming up</div></div>'+
    '<div class="pacts"><button class="btn pri" data-act="new-reminder"><svg aria-hidden="true"><use href="#i-plus"/></svg>New reminder</button></div></div>'+
    '<div class="banner info"><svg aria-hidden="true"><use href="#i-bell"/></svg><div>Items marked <b>automatic</b> are worked out from your jobs and invoices — they clear themselves when the underlying thing is done. Everything else is a reminder you set.</div></div>'+
    sec("overdue","Overdue","p-bad")+ sec("today","Due today","p-warn")+ sec("upcoming","Coming up","p-info")+ sec("done","Completed","p-neutral");
}
function remRow(r, isAuto){
  const t=todayISO(), d=dOnly(r.dueAt);
  const late = !r.done && d<t;
  const icons={callback:"i-phone",estimate:"i-doc",invoice:"i-inv",parts:"i-truck",warranty:"i-shield",maintenance:"i-wrench",lead:"i-lead",job:"i-wrench",custom:"i-bell"};
  return '<div class="mrow" style="border:0;flex-direction:row;align-items:center;gap:10px;cursor:default">'+
    (isAuto? '<span style="width:28px;height:28px;border-radius:8px;background:var(--surface-3);color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:0 0 28px"><svg style="width:14px;height:14px" aria-hidden="true"><use href="#'+(icons[r.kind]||"i-bell")+'"/></svg></span>'
      : '<input type="checkbox" style="width:19px;height:19px;accent-color:var(--brand);flex:0 0 19px" data-rem-done="'+attr(r.id)+'"'+(r.done?" checked":"")+' aria-label="Mark done">')+
    '<span class="grow"><span style="display:block;font-weight:600;font-size:14px'+(r.done?";text-decoration:line-through;color:var(--ink-3)":"")+'">'+esc(r.title)+'</span>'+
    '<span class="tiny muted">'+esc(late?"was due "+fmtDate(d):relDay(d))+
      (r.customerId?' · '+esc(custLabel(r.customerId)):'')+(isAuto?' · automatic':'')+(r.notes?' · '+esc(r.notes):'')+'</span></span>'+
    (r.jobId?'<a class="btn sm ghost" href="#/job/'+attr(r.jobId)+'">Job</a>':r.customerId?'<a class="btn sm ghost" href="#/customer/'+attr(r.customerId)+'">Open</a>':'')+
    (isAuto?'':'<button class="btn icon sm ghost" data-act="edit-reminder" data-id="'+attr(r.id)+'" aria-label="Edit"><svg aria-hidden="true"><use href="#i-edit"/></svg></button>')+
  '</div>';
}
/* derived reminders — nothing stored, they disappear when the cause does */
function autoReminders(){
  const t=todayISO(), out=[];
  listOf("jobs").forEach(j=>{
    if(OPEN_STATUSES.indexOf(j.status)>=0 && j.scheduledDate){
      const dd=daysBetween(t,j.scheduledDate);
      if(dd>=0&&dd<=1) out.push({id:"a-job-"+j.id, title:(dd===0?"Job today":"Job tomorrow")+" — "+custLabel(j.customerId)+" · "+(j.title||j.type||""), dueAt:j.scheduledDate, kind:"job", customerId:j.customerId, jobId:j.id, done:false});
      if(dd<0) out.push({id:"a-late-"+j.id, title:"Job date has passed — "+custLabel(j.customerId)+" · "+(j.title||j.type||""), dueAt:j.scheduledDate, kind:"job", customerId:j.customerId, jobId:j.id, done:false});
    }
    if(j.status==="waiting_parts") out.push({id:"a-parts-"+j.id, title:"Waiting on parts — "+custLabel(j.customerId), dueAt:t, kind:"parts", customerId:j.customerId, jobId:j.id, done:false});
    if(isRecognised(j) && (!j.invoice||!j.invoice.number)) out.push({id:"a-inv-"+j.id, title:"Completed but not invoiced — "+custLabel(j.customerId)+" · "+money(jobFinance(j).total), dueAt:jobDate(j), kind:"invoice", customerId:j.customerId, jobId:j.id, done:false});
    const s=invStatus(j);
    if(s==="overdue") out.push({id:"a-od-"+j.id, title:"Overdue invoice "+j.invoice.number+" — "+custLabel(j.customerId)+" owes "+money2(jobFinance(j).balance), dueAt:j.invoice.dueDate, kind:"invoice", customerId:j.customerId, jobId:j.id, done:false});
    if(j.warranty&&j.warranty.expires){ const dd=daysBetween(t,j.warranty.expires);
      if(dd>=0&&dd<=30) out.push({id:"a-war-"+j.id, title:"Warranty ends soon — "+custLabel(j.customerId)+" · "+(j.title||""), dueAt:j.warranty.expires, kind:"warranty", customerId:j.customerId, jobId:j.id, done:false}); }
  });
  listOf("estimates").forEach(e=>{
    if(["sent","viewed"].indexOf(e.status)<0) return;
    const age = daysBetween(e.sentAt?dOnly(e.sentAt):e.date, t);
    if(age>=3) out.push({id:"a-est-"+e.id, title:"Estimate "+e.number+" sent "+age+" days ago — follow up with "+custLabel(e.customerId), dueAt:addDays(e.sentAt?dOnly(e.sentAt):e.date,3), kind:"estimate", customerId:e.customerId, done:false});
    if(e.expiresAt && daysBetween(t,e.expiresAt)>=0 && daysBetween(t,e.expiresAt)<=5)
      out.push({id:"a-exp-"+e.id, title:"Estimate "+e.number+" expires "+relDay(e.expiresAt).toLowerCase(), dueAt:e.expiresAt, kind:"estimate", customerId:e.customerId, done:false});
  });
  listOf("customers").forEach(c=>{
    if(c.nextFollowUp && dOnly(c.nextFollowUp)<=addDays(t,7))
      out.push({id:"a-fu-"+c.id, title:"Follow up with "+custName(c)+(c.followUpNote?" — "+c.followUpNote:""), dueAt:dOnly(c.nextFollowUp), kind:"callback", customerId:c.id, done:false});
  });
  listOf("leads").forEach(l=>{
    if(ACTIVE_STAGES.indexOf(l.stage)<0) return;
    if(l.nextFollowUp && dOnly(l.nextFollowUp)<=addDays(t,7))
      out.push({id:"a-lf-"+l.id, title:"Follow up on lead — "+(l.name||"unnamed")+(l.service?" ("+l.service+")":""), dueAt:dOnly(l.nextFollowUp), kind:"lead", done:false});
  });
  return out;
}
</script>

function rptRangeBar(state, key){

      cols.slice(1).map(c=>'<td'+(c.r?' class="r"':'')+'>'+(opts.total[c.k]!=null?esc(opts.total[c.k]):"")+'</td>').join("")+'</tr>':'')+
    '</tbody></table></div>';
}
function reportCard(title, sub, body, exportKey){
  return '<div class="card" style="margin-bottom:14px"><div class="chead"><h3>'+esc(title)+'</h3>'+
    (sub?'<span class="tiny muted">'+esc(sub)+'</span>':'')+
    (exportKey?'<button class="btn sm ghost" data-act="export-report" data-r="'+attr(exportKey)+'"><svg aria-hidden="true"><use href="#i-dl"/></svg>CSV</button>':'')+

}

function viewReports(){
  const r = rangeFor(RPT.range, RPT);
  const A = analyze(r);
  const src = sourceStats(r);
  const byMonth = monthlyRows(r);
  const byCustomer = customerRows2(r);
  const byType = groupJobs(r, j=>j.type||"Other");
  const byCity = groupJobs(r, j=>{const a=jobAddr(j); return (a&&a.city)||"Unknown";});
  const byZip  = groupJobs(r, j=>{const a=jobAddr(j); return (a&&a.zip)||"Unknown";});
  const byEmp  = groupJobs(r, j=>{const e=listOf("employees").find(x=>x.id===j.assignedTo); return e?e.name:"Me / unassigned";});
  const overhead = listOf("expenses").filter(x=>inRange(x.date,r));
  const ohTotal = r2(overhead.reduce((a,x)=>a+num(x.amount),0));
  const adSpend = r2(src.reduce((a,s)=>a+s.spend,0));
  const net = r2(A.profit - ohTotal - adSpend);
  const leadsIn = listOf("leads").filter(l=>inRange(l.receivedAt,r));
  const wonLeads = leadsIn.filter(l=>l.stage==="won").length;
  const decided = leadsIn.filter(l=>["won","lost"].indexOf(l.stage)>=0).length;
  const newCust = listOf("customers").filter(c=>inRange(c.createdAt,r));
  const repeatCust = listOf("customers").filter(c=>custRollup(c.id).count>1);
  const unpaid = listOf("jobs").filter(j=>["sent","partial","overdue"].indexOf(invStatus(j))>=0);

  return '<div class="phead"><div class="ptitle"><h1>Reports</h1><div class="sub">'+esc(r.label)+' · '+esc(fmtDateFull(r.from))+' – '+esc(fmtDateFull(r.to))+'</div></div>'+
    '<div class="pacts"><button class="btn" data-act="export-all"><svg aria-hidden="true"><use href="#i-dl"/></svg>Export everything</button></div></div>'+
    rptRangeBar(RPT,"rpt")+

    '<div class="kpis" style="margin-bottom:14px">'+
      kpi("Revenue", money(A.revenue), A.count+" jobs")+
      kpi("Job costs", money(A.cost), "materials, labor, everything on the job")+
      kpi("Gross profit", money(A.profit), pct(A.margin,1)+" margin", A.profit>=0?"pos":"neg")+
      kpi("Overhead + ads", money(ohTotal+adSpend), money(ohTotal)+" overhead · "+money(adSpend)+" advertising")+
      kpi("Net profit", money(net), "after overhead and advertising", net>=0?"pos":"neg")+
      kpi("Average job", money(A.avg), "per completed job")+
    '</div>'+

    reportCard("Revenue and profit by month","", tbl("r-month",[
        {l:"Month",k:"label"},{l:"Jobs",k:"jobs",r:1},{l:"Revenue",k:"rev",r:1,h:x=>money(x.revN)},
        {l:"Costs",k:"cost",r:1,h:x=>money(x.costN)},{l:"Gross profit",k:"profit",r:1,h:x=>'<b class="'+(x.profitN>=0?"pos":"neg")+'">'+money(x.profitN)+'</b>'},
        {l:"Margin",k:"margin",r:1,h:x=>x.revN?pct(x.marginN,1):"—"},{l:"Collected",k:"paid",r:1,h:x=>money(x.paidN)}
      ], byMonth, {total:{label:"Total", jobs:A.count, rev:money(A.revenue), cost:money(A.cost), profit:money(A.profit), margin:A.revenue?pct(A.margin,1):"—", paid:money(A.collected)}}), "month")+

    reportCard("Lead source performance","what each way of getting work is actually worth", tbl("r-source",[
        {l:"Source",k:"name"},{l:"Leads",k:"leads",r:1},{l:"Customers",k:"customers",r:1},
        {l:"Conversion",k:"conv",r:1,h:x=>x.leads?pct(x.conv,0):"—"},
        {l:"Jobs",k:"jobs",r:1},{l:"Revenue",k:"revenue",r:1,h:x=>money(x.revenue)},
        {l:"Profit",k:"profit",r:1,h:x=>'<span class="'+(x.profit>=0?"pos":"neg")+'">'+money(x.profit)+'</span>'},
        {l:"Avg job",k:"avg",r:1,h:x=>x.jobs?money(x.avg):"—"},
        {l:"Ad spend",k:"spend",r:1,h:x=>x.spend?money(x.spend):"—"},
        {l:"Cost per customer",k:"cac",r:1,h:x=>x.spend?(x.customers?money(x.cac):'<span class="neg">no customers</span>'):"—"},
        {l:"ROAS",k:"roas",r:1,h:x=>x.roas==null?"—":'<b class="'+(x.roas>=3?"pos":x.roas>=1?"":"neg")+'">'+x.roas.toFixed(1)+'×</b>'}
      ], src, {total:{label:"All sources", leads:leadsIn.length, customers:newCust.length, jobs:A.count, revenue:money(A.revenue), profit:money(A.profit), spend:money(adSpend), roas:adSpend?(A.revenue/adSpend).toFixed(1)+"×":"—"}}), "source")+
    '<div class="tiny muted" style="margin:-6px 0 16px 2px">Cost per customer and ROAS only appear for sources where you have entered advertising spend — do that under Settings → Lead sources.</div>'+

    '<div class="grid2">'+
      reportCard("Revenue by job type","", tbl("r-type",[
        {l:"Job type",k:"key"},{l:"Jobs",k:"n",r:1},{l:"Revenue",k:"rev",r:1,h:x=>money(x.rev)},
        {l:"Profit",k:"profit",r:1,h:x=>'<span class="'+(x.profit>=0?"pos":"neg")+'">'+money(x.profit)+'</span>'},
        {l:"Margin",k:"margin",r:1,h:x=>x.rev?pct(x.margin,0):"—"},{l:"Avg",k:"avg",r:1,h:x=>money(x.avg)}], byType), "type")+
      reportCard("Revenue by city","", tbl("r-city",[
        {l:"City",k:"key"},{l:"Jobs",k:"n",r:1},{l:"Revenue",k:"rev",r:1,h:x=>money(x.rev)},
        {l:"Profit",k:"profit",r:1,h:x=>'<span class="'+(x.profit>=0?"pos":"neg")+'">'+money(x.profit)+'</span>'},
        {l:"Avg",k:"avg",r:1,h:x=>money(x.avg)}], byCity), "city")+
    '</div>'+
    '<div class="grid2">'+
      reportCard("Revenue by ZIP code","where your money lives", tbl("r-zip",[
        {l:"ZIP",k:"key"},{l:"Jobs",k:"n",r:1},{l:"Revenue",k:"rev",r:1,h:x=>money(x.rev)},
        {l:"Profit",k:"profit",r:1,h:x=>money(x.profit)},{l:"Avg",k:"avg",r:1,h:x=>money(x.avg)}], byZip), "zip")+
      reportCard("Revenue by person","", tbl("r-emp",[
        {l:"Who",k:"key"},{l:"Jobs",k:"n",r:1},{l:"Revenue",k:"rev",r:1,h:x=>money(x.rev)},
        {l:"Profit",k:"profit",r:1,h:x=>money(x.profit)},{l:"Avg",k:"avg",r:1,h:x=>money(x.avg)}], byEmp), "emp")+
    '</div>'+

    reportCard("Top customers","by revenue in this period", tbl("r-cust",[
      {l:"Customer",k:"name",h:x=>'<b>'+esc(x.name)+'</b>'},{l:"Type",k:"type"},{l:"Source",k:"source"},
      {l:"Jobs",k:"n",r:1},{l:"Revenue",k:"rev",r:1,h:x=>money(x.rev)},
      {l:"Profit",k:"profit",r:1,h:x=>'<span class="'+(x.profit>=0?"pos":"neg")+'">'+money(x.profit)+'</span>'},
      {l:"Margin",k:"margin",r:1,h:x=>x.rev?pct(x.margin,0):"—"},
      {l:"Owed",k:"bal",r:1,h:x=>x.bal>0.005?'<b class="neg">'+money(x.bal)+'</b>':"—"}], byCustomer), "customer")+

    '<div class="grid2">'+
      reportCard("The rates that matter","", '<div class="cbody"><dl style="margin:0">'+
        kvRow("Lead conversion", decided? '<b>'+pct(wonLeads/decided*100,0)+'</b> — '+wonLeads+' won of '+decided+' decided ('+leadsIn.length+' leads in)' : "not enough decided leads yet")+
        kvRow("Average job value", '<b>'+money(A.avg)+'</b> across '+A.count+' completed jobs')+
        kvRow("Repeat customer rate", listOf("customers").length? '<b>'+pct(repeatCust.length/listOf("customers").length*100,0)+'</b> — '+repeatCust.length+' of '+listOf("customers").length+' customers have come back' : "—")+
        kvRow("Customer acquisition cost", newCust.length&&adSpend? '<b>'+money(adSpend/newCust.length)+'</b> per new customer (advertising only)' : adSpend?"no new customers against "+money(adSpend)+" spend":"no advertising spend entered")+
        kvRow("Cost as a share of revenue", A.revenue? '<b>'+pct(A.cost/A.revenue*100,0)+'</b> — materials '+pct(A.material/A.revenue*100,0)+', labor '+pct(A.labor/A.revenue*100,0)+', other '+pct(A.other/A.revenue*100,0) : "—")+
        kvRow("Sales tax collected", '<b>'+money(A.tax)+'</b> — set aside for the state, not counted as revenue')+
      '</dl></div>')+
      reportCard("Money still owed to you","every unpaid invoice, oldest first", tbl("r-out",[
        {l:"Invoice",k:"inv",h:x=>'<span class="mono">'+esc(x.inv)+'</span>'},{l:"Customer",k:"name"},
        {l:"Due",k:"due",h:x=>'<span class="'+(x.late?"neg":"")+'">'+esc(x.due)+'</span>'},
        {l:"Age",k:"age",r:1,h:x=>x.late?'<b class="neg">'+x.age+' days late</b>':"—"},
        {l:"Balance",k:"bal",r:1,h:x=>'<b>'+money2(x.balN)+'</b>'}],
        unpaid.sort((a,b)=>(a.invoice.dueDate||"")<(b.invoice.dueDate||"")?-1:1).map(j=>{
          const f=jobFinance(j), late=j.invoice.dueDate&&daysBetween(j.invoice.dueDate,todayISO())>0;
          return {inv:j.invoice.number,name:custLabel(j.customerId),due:j.invoice.dueDate?fmtDate(j.invoice.dueDate):"—",
                  late, age:j.invoice.dueDate?daysBetween(j.invoice.dueDate,todayISO()):0, balN:f.balance, _go:"job/"+j.id};
        }), {total:{label:"Outstanding", bal:money2(unpaid.reduce((a,j)=>a+jobFinance(j).balance,0))}}), "outstanding")+
    '</div>'+

    reportCard("Overhead expenses","costs not tied to any single job", '<div class="cbody">'+
      (overhead.length? tbl("r-oh",[{l:"Date",k:"date",h:x=>esc(fmtDate(x.date))},{l:"What",k:"desc"},{l:"Category",k:"cat"},{l:"Vendor",k:"vendor"},{l:"Amount",k:"amount",r:1,h:x=>money2(x.amount)}],
        overhead.slice().sort((a,b)=>(a.date<b.date?1:-1)), {total:{label:"Total overhead", amount:money2(ohTotal)}})
        : '<div class="tiny muted">Nothing recorded. Insurance, the truck, tools and phone bills go under Expenses.</div>')+
      '</div>', "overhead");
}
function monthlyRows(r){
  const out=[]; let d = dOnly(r.from).slice(0,7)+"-01";
  const stop = dOnly(r.to);
  let guard=0;
  while(d<=stop && guard++<400){
    const dt=toDate(d), end=isoOf(new Date(dt.getFullYear(),dt.getMonth()+1,0));
    const jobs=listOf("jobs").filter(j=>isRecognised(j)&&jobDate(j)>=d&&jobDate(j)<=end&&jobDate(j)>=r.from&&jobDate(j)<=r.to);
    let rev=0,cost=0,paid=0; jobs.forEach(j=>{const f=jobFinance(j);rev+=f.subtotal;cost+=f.costTotal;paid+=f.paid;});
    out.push({label:MONL[dt.getMonth()]+" "+dt.getFullYear(), jobs:jobs.length, revN:r2(rev), costN:r2(cost),
      profitN:r2(rev-cost), marginN: rev?((rev-cost)/rev*100):0, paidN:r2(paid)});
    d=addMonths(d,1);
  }
  return out.filter(x=>x.jobs||x.revN);
}
function groupJobs(r, keyFn){
  const jobs=listOf("jobs").filter(j=>isRecognised(j)&&inRange(jobDate(j),r));
  const m={};
  jobs.forEach(j=>{ const k=keyFn(j)||"Unknown"; const f=jobFinance(j);
    m[k]=m[k]||{key:k,n:0,rev:0,profit:0}; m[k].n++; m[k].rev+=f.subtotal; m[k].profit+=f.subtotal-f.costTotal; });
  return Object.values(m).map(x=>{ x.rev=r2(x.rev); x.profit=r2(x.profit); x.avg=x.n?r2(x.rev/x.n):0;
    x.margin=x.rev?(x.profit/x.rev*100):0; return x; }).sort((a,b)=>b.rev-a.rev);
}
function customerRows2(r){
  const m={};
  listOf("jobs").filter(j=>isRecognised(j)&&inRange(jobDate(j),r)).forEach(j=>{
    const f=jobFinance(j), c=cust(j.customerId);
    const k=j.customerId||"none";
    m[k]=m[k]||{id:k,name:custLabel(j.customerId),type:c?(CUST_TYPE[c.type]||""):"",source:c?sourceName(c.source):"",n:0,rev:0,profit:0,bal:0};
    m[k].n++; m[k].rev+=f.subtotal; m[k].profit+=f.subtotal-f.costTotal;
  });
  Object.keys(m).forEach(k=>{ m[k].bal = k==="none"?0:custRollup(k).balance; m[k]._go="customer/"+k;
    m[k].rev=r2(m[k].rev); m[k].profit=r2(m[k].profit); m[k].margin=m[k].rev?(m[k].profit/m[k].rev*100):0; });
  return Object.values(m).sort((a,b)=>b.rev-a.rev).slice(0,40);
}

/* ================================= ROUTE ================================ */
let RT = {scope:"today"};
function viewRoute(){
  const t=todayISO();
  let jobs=[], label="";
  if(RT.scope==="today"){ jobs=openJobsBetween(t,t); label="Today"; }
  else if(RT.scope==="tomorrow"){ jobs=openJobsBetween(addDays(t,1),addDays(t,1)); label="Tomorrow"; }
  else if(RT.scope==="week"){ jobs=openJobsBetween(t,addDays(t,6)); label="Next 7 days"; }
  else if(RT.scope==="upcoming"){ jobs=openJobsBetween(t,"2999-12-31"); label="All upcoming"; }
  jobs.sort((a,b)=>((a.scheduledDate+(a.scheduledTime||"99"))<(b.scheduledDate+(b.scheduledTime||"99")))?-1:1);
  const stops = jobs.map(jobAddr).filter(a=>a&&a.street);
  const allCust = RT.scope==="customers";
  const cityGroups = {};
  if(allCust){
    listOf("customers").forEach(c=>{ (c.properties||[]).forEach(p=>{ const k=p.city||"Unknown";
      (cityGroups[k]=cityGroups[k]||[]).push({name:custName(c),addr:p,cid:c.id,zip:p.zip}); }); });
  } else {
    jobs.forEach(j=>{ const a=jobAddr(j); const k=(a&&a.city)||"Unknown"; (cityGroups[k]=cityGroups[k]||[]).push({job:j,addr:a}); });
  }
  const zipRows = Object.entries(listOf("jobs").filter(isRecognised).reduce((m,j)=>{
    const a=jobAddr(j); const z=(a&&a.zip)||"—"; m[z]=(m[z]||0)+jobFinance(j).subtotal; return m; },{}))
    .map(([z,v])=>({l:z,v:r2(v)})).sort((a,b)=>b.v-a.v).slice(0,8);

  return '<div class="phead"><div class="ptitle"><h1>Route map</h1>'+
      '<div class="sub">'+(allCust? listOf("customers").length+" customers on file" : jobs.length+" job"+(jobs.length===1?"":"s")+" · "+esc(label))+'</div></div>'+
    '<div class="pacts">'+
      (stops.length>1?'<a class="btn pri" target="_blank" rel="noopener" href="'+attr(routeUrl(stops))+'"><svg aria-hidden="true"><use href="#i-truck"/></svg>Open the whole route</a>':'')+
    '</div></div>'+
    '<div class="filters"><div class="seg">'+
      [["today","Today"],["tomorrow","Tomorrow"],["week","Next 7 days"],["upcoming","All upcoming"],["customers","Every customer"]]
        .map(x=>'<button data-rt="'+x[0]+'" aria-pressed="'+(RT.scope===x[0])+'">'+esc(x[1])+'</button>').join("")+
      '</div></div>'+
    '<div class="banner info"><svg aria-hidden="true"><use href="#i-pin"/></svg><div>Stops are grouped by town so you can see the shape of the day at a glance. <b>Open the whole route</b> hands the addresses, in order, to Google Maps on whatever device you are holding — it does the driving directions and live traffic.</div></div>'+
    (Object.keys(cityGroups).length? Object.keys(cityGroups).sort().map(city=>{
      const list=cityGroups[city];
      const cityStops = list.map(x=>x.addr).filter(a=>a&&a.street);
      return '<div class="card" style="margin-bottom:12px"><div class="chead"><h3>'+esc(city)+'</h3>'+
        '<span class="pill p-neutral">'+list.length+' stop'+(list.length===1?"":"s")+'</span>'+
        (cityStops.length>1?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+attr(routeUrl(cityStops))+'">Route this town</a>':'')+
        '</div><div class="cbody tight">'+
        list.map((x,i)=> allCust
          ? '<div class="mrow" style="border:0;flex-direction:row;align-items:center;gap:10px">'+
            '<span class="grow"><b>'+esc(x.name)+'</b><span class="tiny muted" style="display:block">'+esc(addrOneLine(x.addr))+'</span></span>'+
            '<a class="btn sm ghost" target="_blank" rel="noopener" href="'+attr(mapsUrl(x.addr))+'"><svg aria-hidden="true"><use href="#i-pin"/></svg></a>'+
            '<a class="btn sm ghost" href="#/customer/'+attr(x.cid)+'">Open</a></div>'
          : (function(){ const j=x.job, c=cust(j.customerId), f=jobFinance(j);
            return '<div class="mrow" style="border:0;flex-direction:row;align-items:flex-start;gap:10px">'+
            '<span style="width:24px;height:24px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 24px;margin-top:2px">'+(i+1)+'</span>'+
            '<span class="grow"><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>'+esc(custLabel(j.customerId))+'</b>'+jobPill(j.status)+
              '<span class="tiny muted">'+esc(relDay(j.scheduledDate))+(j.scheduledTime?" · "+esc(fmtTime(j.scheduledTime)):"")+'</span></span>'+
            '<span class="tiny muted" style="display:block">'+esc(x.addr?addrOneLine(x.addr):"no address")+' · '+esc(j.title||j.type||"")+' · '+money(f.subtotal)+'</span></span>'+
            (c&&c.phone?'<a class="btn sm ghost" href="tel:'+attr(digits(c.phone))+'"><svg aria-hidden="true"><use href="#i-phone"/></svg></a>':'')+
            (x.addr&&x.addr.street?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+attr(mapsUrl(x.addr))+'"><svg aria-hidden="true"><use href="#i-pin"/></svg></a>':'')+
            '<a class="btn sm ghost" href="#/job/'+attr(j.id)+'">Job</a></div>'; })()
        ).join("")+'</div></div>';
    }).join("") : emptyBox("i-pin","Nothing to drive to","Schedule some jobs and they will show up here."))+
    (zipRows.length? '<div class="chartcard"><div class="ct"><h3>Revenue by ZIP code</h3></div><div class="cs">All time — where the money actually comes from</div>'+
      barList(zipRows,{fmt:v=>money(v)})+'</div>' : '');
}
function openJobsBetween(a,b){
  return listOf("jobs").filter(j=>OPEN_STATUSES.indexOf(j.status)>=0 && j.scheduledDate && j.scheduledDate>=a && j.scheduledDate<=b);
}

/* ================================ EXPENSES ============================== */
let XF={range:"year",from:addDays(todayISO(),-90),to:todayISO(),cat:"",vendor:"",kind:"all"};
function viewExpenses(){
  const r=rangeFor(XF.range,XF);
  const jobCosts=[];
  listOf("jobs").forEach(j=>{
    const d = jobDate(j) || dOnly(j.createdAt);
    if(!inRange(d,r)) return;
    (j.costs||[]).forEach(c=> jobCosts.push({date:d, desc:c.desc||COST_CATS[c.cat]||"Cost", cat:c.cat, catL:COST_CATS[c.cat]||c.cat,
      vendor:c.vendor||"", amount: c.total!=null?num(c.total):r2(num(c.qty)*num(c.unit)), job:j}));
  });
  const oh = listOf("expenses").filter(x=>inRange(x.date,r)).map(x=>({date:x.date,desc:x.desc,cat:x.cat,catL:COST_CATS[x.cat]||x.cat,vendor:x.vendor||"",amount:num(x.amount),oh:x}));
  let rows = XF.kind==="job"? jobCosts : XF.kind==="overhead"? oh : jobCosts.concat(oh);
  if(XF.cat) rows=rows.filter(x=>x.cat===XF.cat);
  if(XF.vendor) rows=rows.filter(x=>x.vendor===XF.vendor);
  rows.sort((a,b)=>a.date<b.date?1:-1);
  const total=r2(rows.reduce((a,x)=>a+x.amount,0));
  const byCat={}; rows.forEach(x=>{ byCat[x.catL]=(byCat[x.catL]||0)+x.amount; });
  const catRows=Object.entries(byCat).map(([l,v])=>({l,v:r2(v)})).sort((a,b)=>b.v-a.v);
  const vendors=Array.from(new Set(jobCosts.concat(oh).map(x=>x.vendor).filter(Boolean))).sort();
  const jobTotal=r2(jobCosts.reduce((a,x)=>a+x.amount,0)), ohTotal=r2(oh.reduce((a,x)=>a+x.amount,0));

  return '<div class="phead"><div class="ptitle"><h1>Expenses</h1>'+
      '<div class="sub">'+money(total)+' in '+esc(r.label.toLowerCase())+' · '+money(jobTotal)+' on jobs · '+money(ohTotal)+' overhead</div></div>'+
    '<div class="pacts"><button class="btn" data-act="export-expenses"><svg aria-hidden="true"><use href="#i-dl"/></svg>Export</button>'+
      '<button class="btn pri" data-act="new-expense"><svg aria-hidden="true"><use href="#i-plus"/></svg>Add overhead expense</button></div></div>'+
    rptRangeBar(XF,"xf")+
    '<div class="filters">'+
      '<div class="seg"><button data-xkind="all" aria-pressed="'+(XF.kind==="all")+'">Everything</button><button data-xkind="job" aria-pressed="'+(XF.kind==="job")+'">On jobs</button><button data-xkind="overhead" aria-pressed="'+(XF.kind==="overhead")+'">Overhead</button></div>'+
      selInline("xf-cat","Any category",COST_CATS,XF.cat)+
      (vendors.length?selInline("xf-vendor","Any vendor",vendors.reduce((o,v)=>(o[v]=v,o),{}),XF.vendor):"")+
      '<span class="count">'+rows.length+' line'+(rows.length===1?"":"s")+'</span></div>'+
    '<div class="grid2" style="margin-bottom:14px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">'+
      '<div class="card"><div class="chead"><h3>Every line</h3><span class="tiny muted">'+money2(total)+'</span></div>'+
        (rows.length? '<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>What</th><th>Category</th><th>Vendor</th><th>Job</th><th class="r">Amount</th></tr></thead><tbody>'+
          rows.map(x=>'<tr'+(x.job?' data-go="job/'+attr(x.job.id)+'"':(x.oh?' data-act="edit-expense" data-id="'+attr(x.oh.id)+'"':' style="cursor:default"'))+'>'+
            '<td class="tiny">'+esc(fmtDate(x.date))+'</td><td>'+esc(x.desc)+'</td><td class="tiny">'+esc(x.catL)+'</td>'+
            '<td class="tiny">'+esc(x.vendor||"—")+'</td>'+
            '<td class="tiny">'+(x.job?'<span class="mono">'+esc(x.job.number)+'</span> '+esc(custLabel(x.job.customerId)):'<span class="muted">overhead</span>')+'</td>'+
            '<td class="r">'+money2(x.amount)+'</td></tr>').join("")+'</tbody></table></div>'
          : '<div class="cbody">'+emptyBox("i-cash","No expenses in this period","")+'</div>')+'</div>'+
      '<div class="chartcard"><div class="ct"><h3>By category</h3></div><div class="cs">'+esc(r.label)+'</div>'+
        barList(catRows,{fmt:v=>money(v)})+'</div>'+
    '</div>';
}
function editExpense(id){
  const x = id? S.expenses[id] : {date:todayISO(), cat:"other", amount:""};
  openModal({title:id?"Edit expense":"Add overhead expense", size:"slim",

    foot:(id?'<button class="btn danger" data-act="del-expense" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-trash"/></svg></button>':'')+
      '<span class="spacer"></span><button class="btn" data-mclose>Cancel</button><button class="btn pri" id="x-save">Save</button>',

}

        '<span class="grow"><b style="font-size:16px">'+esc(e.name)+'</b><span class="tiny muted" style="display:block">'+esc(e.role||"Technician")+(e.active===false?" · inactive":"")+'</span></span>'+

          kvRow("Revenue generated", '<b>'+money(rev)+'</b>')+

        '</dl>'+
        '<div class="row" style="margin-top:8px"><a class="btn sm" href="#/jobs">See their jobs</a></div></div>';
    }).join("")+'</div>'
    : emptyBox("i-badge","No one else on the books","Every job stays assigned to you until you add someone.",'<button class="btn pri" data-act="new-employee">Add your first employee</button>'));
}
function editEmployee(id){

/* ============================= global search ============================ */
let SEARCH={open:false,sel:0,items:[]};
function runSearch(qq){
  const q=String(qq||"").trim().toLowerCase(); const qd=digits(qq);
  if(q.length<2 && qd.length<3){ SEARCH.items=[]; return []; }
  const hits=[];
  const push=(kind,label,sub,go,score)=>hits.push({kind,label,sub,go,score});
  listOf("customers").forEach(c=>{
    const nm=custName(c).toLowerCase(); const ph=digits(c.phone)+" "+digits(c.phone2);
    const addr=(c.properties||[]).map(p=>[p.street,p.city,p.zip].join(" ")).join(" ").toLowerCase();
    let s=0;
    if(nm.indexOf(q)===0) s=100; else if(q&&nm.indexOf(q)>=0) s=80;
    if(qd.length>=3 && ph.indexOf(qd)>=0) s=Math.max(s,95);
    if(q && String(c.email||"").toLowerCase().indexOf(q)>=0) s=Math.max(s,75);
    if(q && addr.indexOf(q)>=0) s=Math.max(s,70);
    if(s){ const R=custRollup(c.id);
      push("Customer",custName(c), [phoneFmt(c.phone),(c.properties&&c.properties[0])?c.properties[0].city:"",R.count+" jobs",money(R.revenue)].filter(Boolean).join(" · "), "customer/"+c.id, s); }
  });
  listOf("jobs").forEach(j=>{
    const t=[j.number,j.title,j.type,custLabel(j.customerId)].join(" ").toLowerCase();
    const a=jobAddr(j); const at=a?[a.street,a.city,a.zip].join(" ").toLowerCase():"";
    let s=0;
    if(q && String(j.number||"").toLowerCase().indexOf(q)>=0) s=98;
    else if(q && t.indexOf(q)>=0) s=68;
    else if(q && at.indexOf(q)>=0) s=64;
    if(s) push("Job",(j.number||"")+" · "+(j.title||j.type||"Job"), custLabel(j.customerId)+" · "+(j.scheduledDate?fmtDate(j.scheduledDate):"unscheduled")+" · "+money(jobFinance(j).subtotal), "job/"+j.id, s);
  });
  listOf("estimates").forEach(e=>{
    const t=[e.number,e.title,custLabel(e.customerId)].join(" ").toLowerCase();
    if(q && t.indexOf(q)>=0) push("Estimate",(e.number||"")+" · "+(e.title||""), custLabel(e.customerId)+" · "+money(estFinance(e).total)+" · "+(EST_STATUS[e.status]||{}).l, "estimate/"+e.id, 66);
  });
  listOf("jobs").filter(j=>j.invoice&&j.invoice.number).forEach(j=>{
    if(q && String(j.invoice.number).toLowerCase().indexOf(q)>=0){
      const f=jobFinance(j);
      push("Invoice", j.invoice.number, custLabel(j.customerId)+" · "+money2(f.total)+(f.balance>0.005?" · "+money2(f.balance)+" due":" · paid"), "job/"+j.id, 96);
    }
  });
  listOf("leads").forEach(l=>{
    const t=[l.name,l.email,l.city,l.service].join(" ").toLowerCase();
    let s=0; if(q&&t.indexOf(q)>=0) s=62; if(qd.length>=3&&digits(l.phone).indexOf(qd)>=0) s=90;
    if(s) push("Lead", l.name||"Unnamed lead", [phoneFmt(l.phone),sourceName(l.source),(LEAD_STAGES[l.stage]||{}).l].filter(Boolean).join(" · "), "lead/"+l.id, s);
  });
  SEARCH.items = hits.sort((a,b)=>b.score-a.score).slice(0,14);
  return SEARCH.items;
}
function paintSearch(){
  const w=$(".searchwrap"); let box=$("#sresults");
  if(!SEARCH.items.length){ hideSearch(); return; }
  if(!box){ box=document.createElement("div"); box.id="sresults"; box.setAttribute("role","listbox"); w.appendChild(box); }
  let last="";
  box.innerHTML = SEARCH.items.map((h,i)=>{
    const grp = h.kind!==last ? '<div class="sgroup">'+esc(h.kind)+'</div>' : ""; last=h.kind;
    return grp+'<button class="sres'+(i===SEARCH.sel?" sel":"")+'" data-go="'+attr(h.go)+'" role="option" aria-selected="'+(i===SEARCH.sel)+'">'+
      '<span class="grow"><span style="display:block;font-weight:600;font-size:14px">'+esc(h.label)+'</span>'+
      '<span class="tiny muted trunc" style="display:block">'+esc(h.sub)+'</span></span></button>';
  }).join("");
  $("#gsearch").setAttribute("aria-expanded","true");
}
function hideSearch(){ const b=$("#sresults"); if(b) b.remove(); const g=$("#gsearch"); if(g) g.setAttribute("aria-expanded","false"); }

function restoreFlow(){
  openModal({title:"Restore from a backup", size:"wide",
    body:'<div class="banner warn"><svg aria-hidden="true"><use href="#i-alert"/></svg><div><b>This replaces everything currently in the app.</b> Download a fresh backup first if you are not sure.</div></div>'+
      '<div class="dropzone" id="rest-pick" style="padding:22px;margin-bottom:12px"><svg style="width:22px;height:22px;display:block;margin:0 auto 6px" aria-hidden="true"><use href="#i-dl"/></svg>'+
        '<b>Choose your backup file</b><div class="tiny">The one ending in .json that you downloaded from here</div></div>'+
      '<input type="file" id="rest-file" accept=".json,application/json" style="display:none">'+
      '<div class="field"><label for="rest-ta">…or paste the contents in by hand</label><textarea class="ta" id="rest-ta" style="min-height:170px;font-family:var(--mono);font-size:12px" placeholder=\'{"_format":"overhead-crm-backup", ...\'></textarea></div>',
    foot:'<button class="btn" data-mclose>Cancel</button><button class="btn danger" id="rest-go">Replace everything</button>',
    onMount(root){
      const fi=root.querySelector("#rest-file"), ta=root.querySelector("#rest-ta"), pick=root.querySelector("#rest-pick");
      pick.addEventListener("click",()=>fi.click());
      pick.addEventListener("dragover",e=>{ e.preventDefault(); pick.classList.add("over"); });
      pick.addEventListener("dragleave",()=>pick.classList.remove("over"));
      pick.addEventListener("drop",e=>{ e.preventDefault(); pick.classList.remove("over");
        const f=(e.dataTransfer.files||[])[0]; if(f) readBackup(f); });
      fi.addEventListener("change",()=>{ const f=(fi.files||[])[0]; if(f) readBackup(f); });
      function readBackup(f){
        const rd=new FileReader();
        rd.onload=()=>{ ta.value=String(rd.result||"");
          pick.innerHTML='<b style="color:var(--good)">'+esc(f.name)+' loaded</b><div class="tiny">Now press “Replace everything”</div>'; };
        rd.onerror=()=>toast("Could not read that file","err");
        rd.readAsText(f);
      }
      root.querySelector("#rest-go").addEventListener("click", async ()=>{
      let d; try{ d=JSON.parse(ta.value); }catch(e){ toast("That is not a valid backup file","err"); return; }
      if(!d || d._format!=="overhead-crm-backup"){ toast("That file is not an Overhead backup","err"); return; }
      closeModal();
      toast("Restoring…");
      for(const c of COLLECTIONS){
        for(const id of Object.keys(S[c])) if(!d[c]||!d[c][id]) await drop(c,id);
        for(const id of Object.keys(d[c]||{})) await put(c, Object.assign({},d[c][id],{id}));
      }
      if(d.settings) await putMeta("settings", d.settings);
      if(d.sources) await putMeta("sources", d.sources);
      toast("Restored"); go("dashboard");
      });
    }});
}
async function clearSample(){
  let n=0;
  for(const c of COLLECTIONS){ for(const x of listOf(c)) if(x.sample){ await drop(c,x.id); n++; } }
  toast(n+" sample record"+(n===1?"":"s")+" removed");
}
async function wipeAll(){
  for(const c of COLLECTIONS){ for(const x of listOf(c)) await drop(c,x.id); }
  toast("Everything deleted");
  go("dashboard");
}

function completeJob(jobId){
  const j=S.jobs[jobId]; if(!j) return; const f=jobFinance(j); const st=settings();
  const noCosts=!(j.costs||[]).length;
  openModal({title:"Mark this job complete", size:"wide",
    body:
      (noCosts?'<div class="banner warn"><svg aria-hidden="true"><use href="#i-alert"/></svg><div><b>No costs entered.</b> Right now this job shows '+money(f.subtotal)+' of pure profit, which is not true. Add what the parts and your time cost before you close it out — that is the whole point of tracking this.</div></div>':'')+
      '<div class="stack">'+

        fArea("workPerformed","What you did", j.workPerformed,{rows:3})+
        '<div class="hr"></div>'+
        '<label class="check"><input type="checkbox" name="makeInvoice" checked><span><b>Create the invoice now</b> — '+esc(expandTerms(st.invoiceTerms||"Net 15"))+'</span></label>'+
        '<label class="check"><input type="checkbox" name="paidNow"><span><b>They paid on the spot</b></span></label>'+
        '<div id="paybits" style="display:none">'+
          '<div class="grid2">'+fSel("method","How they paid","card",PAY_METHODS)+fMoney("amount","Amount", "")+'</div>'+
          '<div class="tiny muted" id="ccnote" style="margin-top:5px"></div></div>'+
        '<div class="hr"></div>'+
        '<label class="check"><input type="checkbox" name="setFollow"><span>Remind me to check in with them in 6 months</span></label>'+
      '</div>',
    foot:'<button class="btn" data-mclose>Cancel</button><button class="btn pri" id="cj-go">Complete job</button>',
    onMount(root){
      const pn=root.querySelector('[name=paidNow]'), pb=root.querySelector("#paybits");
      const priceEl=root.querySelector('[name=price]'), amtEl=root.querySelector('[name=amount]');
      const methodEl=root.querySelector('[name=method]'), note=root.querySelector("#ccnote");
      const total=()=>{ const p=num(priceEl.value); const sub=Math.max(0,p-num(j.discount));
        return r2(sub + (j.taxExempt?0:sub*num(j.taxRate==null?st.taxRate:j.taxRate)/100)); };
      const sync=()=>{ pb.style.display=pn.checked?"":"none"; if(pn.checked && !amtEl.value) amtEl.value=total();
        const fee = methodEl.value==="card" ? r2(num(amtEl.value)*num(st.ccFeePct)/100) : 0;
        note.textContent = fee? "A "+money2(fee)+" card fee will be added as a job cost automatically." : ""; };
      pn.addEventListener("change",sync); methodEl.addEventListener("change",sync); amtEl.addEventListener("input",sync); priceEl.addEventListener("input",()=>{ if(pn.checked) amtEl.value=total(); sync(); });
      sync();
      root.querySelector("#cj-go").addEventListener("click", async ()=>{
        const d=readForm(root);
        const n=Object.assign({},j);
        n.price=num(d.price); n.completedAt=d.completedAt||todayISO(); n.workPerformed=d.workPerformed;
        n.status = d.makeInvoice? "invoiced" : "completed";
        n.costs=(n.costs||[]).slice(); n.payments=(n.payments||[]).slice();
        if(d.makeInvoice){
          n.invoice = n.invoice && n.invoice.number ? n.invoice : {number:nextNum("INV","jobs","invoice"), date:n.completedAt, dueDate:dueFromTerms(n.completedAt, st.invoiceTerms), status:"sent", sentAt:nowISO()};
        }
        if(d.paidNow && num(d.amount)>0){
          n.payments.push({id:uid("y"), at:nowISO(), amount:num(d.amount), method:d.method, note:""});
          if(d.method==="card" && num(st.ccFeePct)>0){
            const fee=r2(num(d.amount)*num(st.ccFeePct)/100);
            if(fee>0) n.costs.push({id:uid("k"), desc:"Card processing fee ("+num(st.ccFeePct)+"%)", cat:"ccfee", vendor:"", qty:1, unit:fee, total:fee});
          }
          const fin=jobFinance(n);
          if(fin.balance<=0.005) n.status="paid";
        }
        closeModal(); await put("jobs", n);
        const c=cust(n.customerId);
        if(c && c.status==="lead"){ await put("customers", Object.assign({},c,{status:"active"})); }
        if(d.setFollow && c){
          await put("customers", Object.assign({},cust(n.customerId),{nextFollowUp:addDays(todayISO(),182), followUpNote:"Check in after "+(n.title||n.type||"the job")}));
          await addReminder({title:"Check in with "+custName(c)+" — 6 months after "+(n.title||n.type||"the job"), dueAt:addDays(todayISO(),182)+"T09:00", kind:"maintenance", customerId:c.id, jobId:n.id});
        }
        toast("Job completed"+(d.makeInvoice?" and invoiced":""));
      });
    }});
}
function dueFromTerms(from, terms){
  const t=String(terms||"");
  if(/receipt/i.test(t)) return from;
  const m=/(\d+)/.exec(t); return addDays(from, m?+m[1]:15);
}

let UPTARGET=null;
function pickFiles(target){ UPTARGET=target; const el=$("#filepick"); el.value=""; el.click(); }
async function handleUpload(files){
  if(!UPTARGET || !files.length) return;
  let assets=null;
  try{ assets = await (window.claude&&window.claude.use? window.claude.use("assets") : Promise.resolve(null)); }catch(e){}
  if(!assets){ toast("File storage is not available in this view, so photos cannot be attached right now.","err"); return; }
  toast("Uploading "+files.length+" file"+(files.length===1?"":"s")+"…");
  const saved=[];
  for(const file of files){
    try{
      const res = await assets.upload(file);
      saved.push({id:uid("f"), assetId:res.id, url:res.url, name:file.name, mime:file.type||res.contentType, size:res.sizeBytes, at:nowISO()});
    }catch(e){ toast("Could not upload "+file.name+(e&&e.code==="quota_exceeded"?" — storage is full":""),"err"); }
  }
  if(!saved.length) return;
  const p = String(UPTARGET).split(":");
  if(p[0]==="customer"){
    const c=cust(p[1]); if(!c) return;
    await put("customers", Object.assign({},c,{files:(c.files||[]).concat(saved.map(s=>Object.assign({tag:"doc"},s)))}));
  } else if(p[0]==="job"){
    const j=S.jobs[p[1]]; if(!j) return;
    const tag=p[2]||"doc";
    await put("jobs", Object.assign({},j,{files:(j.files||[]).concat(saved.map(s=>Object.assign({tag},s)))}));
  } else if(p[0]==="cost"){
    const j=S.jobs[p[1]]; if(!j) return;
    const costs=(j.costs||[]).map(c=> c.id===p[2] ? Object.assign({},c,{receipt:saved[0]}) : c);
    await put("jobs", Object.assign({},j,{costs}));
  }
  toast(saved.length+" file"+(saved.length===1?"":"s")+" attached");
  UPTARGET=null;
}

function focusKey(el){
  if(!el || el===document.body) return null;
  const d = el.dataset||{};
  if(el.id) return "#"+CSS.escape(el.id);
  if(d.cid && d.cf) return '[data-cid="'+d.cid+'"][data-cf="'+d.cf+'"]';
  if(d.iid && d["if"]) return '[data-iid="'+d.iid+'"][data-if="'+d["if"]+'"]';
  if(d.oid && d.of) return '[data-oid="'+d.oid+'"][data-of="'+d.of+'"]';
  if(d.ef) return '[data-ef="'+d.ef+'"]';
  if(d.spend) return '[data-spend="'+d.spend+'"][data-month="'+d.month+'"]';
  return null;
}
let renderQueued=false;
function render(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false; try{ doRender(); }catch(e){ console.error(e); } }); }

function doRender(){
  paintNav(); paintSync();
  const page=$("#page"); if(!page) return;
  const act=document.activeElement;

  if(!READY){ page.innerHTML='<div class="empty" style="padding:80px 20px"><svg aria-hidden="true"><use href="#i-db"/></svg><h4>Opening your books…</h4></div>'; return; }

  let html="";

  }
  page.innerHTML = html;

  if(key){ const el=page.querySelector(key); if(el){ try{ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) el.setSelectionRange(sel[0],sel[1]); }catch(e){} } }

/* ------------------------------- wiring --------------------------------- */
function bindEvents(){
  /* clicks */
  document.addEventListener("click", e=>{
    const t=e.target;
    if(t.closest("#gsearch")) return;

    const mc=t.closest("[data-mclose]");
    if(mc){ closeModal(); if(mc.tagName!=="A") { e.preventDefault(); return; } }

    const act=t.closest("[data-act]");
    if(act){ const fn=ACTIONS[act.dataset.act]; if(fn){ e.preventDefault(); const s=t.closest(".sheet"); if(s) s.remove(); fn(act); return; } }

    const go=t.closest("[data-go]");
    if(go && !t.closest("a[href]")){ e.preventDefault(); const s=t.closest(".sheet"); if(s) s.remove(); hideSearch(); $("#gsearch").value=""; SEARCH.items=[]; location.hash="#/"+go.dataset.go; return; }

    const lo=t.closest("[data-lead-open]"); if(lo){ e.preventDefault(); openLead(lo.dataset.leadOpen); return; }
    const lc=t.closest("[data-lead]"); if(lc){ e.preventDefault(); openLead(lc.dataset.lead); return; }
    const op=t.closest("[data-open]");
    if(op){ e.preventDefault(); const [k,id]=op.dataset.open.split(":");
      if(k==="job") go2("job/"+id); else if(k==="estimate") go2("estimate/"+id);
      else if(k==="event") editEvent(id); else if(k==="reminder") editReminder(id); return; }
    const dop=t.closest("[data-dayopen]"); if(dop){ CAL.mode="day"; CAL.cursor=dop.dataset.dayopen; render(); return; }

    const tab=t.closest("[data-tab]");
    if(tab){ e.preventDefault(); if(tab.dataset.tab==="more") moreMenu(); else location.hash="#/"+tab.dataset.tab; return; }
    const ct=t.closest("[data-ctab]"); if(ct){ CTAB=ct.dataset.ctab; render(); return; }
    const stb=t.closest("[data-stab]"); if(stb){ STAB=stb.dataset.stab; render(); return; }
    const lv=t.closest("[data-lview]"); if(lv){ LF.view=lv.dataset.lview; render(); return; }
    const eo=t.closest("[data-eopt]"); if(eo){ EOPT=eo.dataset.eopt; render(); return; }
    const rg=t.closest("[data-range]"); if(rg){ DASH.range=rg.dataset.range; render(); return; }
    const rp=t.closest("[data-rpt]"); if(rp){ RPT.range=rp.dataset.rpt; render(); return; }
    const xf=t.closest("[data-xf]"); if(xf){ XF.range=xf.dataset.xf; render(); return; }
    const xk=t.closest("[data-xkind]"); if(xk){ XF.kind=xk.dataset.xkind; render(); return; }
    const rt=t.closest("[data-rt]"); if(rt){ RT.scope=rt.dataset.rt; render(); return; }
    const cm=t.closest("[data-calmode]"); if(cm){ CAL.mode=cm.dataset.calmode; render(); return; }
    const cn=t.closest("[data-calnav]");
    if(cn){ const d=+cn.dataset.calnav;
      if(d===0) CAL.cursor=todayISO();
      else CAL.cursor = CAL.mode==="month"? addMonths(CAL.cursor,d) : CAL.mode==="week"? addDays(CAL.cursor,7*d) : addDays(CAL.cursor,d);
      render(); return; }
    const th=t.closest("[data-theme]");
    if(th){ setTheme(th.dataset.theme); render(); return; }

    if(t.closest("#burger")){ $("#rail").classList.toggle("open"); return; }
    if(t.closest("#quickadd")||t.closest("#fab")){ quickAdd(); return; }
    if(t.closest("#themebtn")){ const cur=(localStorage.getItem("overhead.theme")||"system");
      setTheme(cur==="dark"?"light":cur==="light"?"system":"dark"); return; }
    if(!t.closest(".searchwrap")) hideSearch();
  });

  /* live edits */
  document.addEventListener("input", e=>{
    const el=e.target;
    if(el.id==="gsearch"){ SEARCH.sel=0; runSearch(el.value); paintSearch(); return; }
    if(el.dataset.cf==="qty"||el.dataset.cf==="unit"){
      const row=el.closest("[data-costrow]"); if(row){ const q=row.querySelector('[data-cf="qty"]'), u=row.querySelector('[data-cf="unit"]');
        const tot=row.querySelector(".tot"); if(tot) tot.textContent=money2(num(q.value)*num(u.value)); }
      return; }
    if(el.dataset["if"]==="qty"||el.dataset["if"]==="price"){
      const row=el.closest(".li"); if(row){ const q=row.querySelector('[data-if="qty"]'), p=row.querySelector('[data-if="price"]');
        const tot=row.querySelector(".tot"); if(tot) tot.textContent=money2(num(q.value)*num(p.value)); }
      return; }
    const fid=el.id||"";
    if(/^(cf|jf|lf|ef|if|xf)-q$/.test(fid)){ clearTimeout(el._t); el._t=setTimeout(()=>{
      const m={"cf-q":()=>CF.q=el.value,"jf-q":()=>JF.q=el.value,"lf-q":()=>LF.q=el.value,"ef-q":()=>EF.q=el.value,"if-q":()=>IF.q=el.value,"xf-q":()=>XF.q=el.value};
      if(m[fid]){ m[fid](); render(); } }, 220); }
  });

  document.addEventListener("change", async e=>{
    const el=e.target, d=el.dataset;
    /* filters */
    const F={ "cf-type":[CF,"type"],"cf-status":[CF,"status"],"cf-source":[CF,"source"],"cf-city":[CF,"city"],"cf-flag":[CF,"flag"],"cf-sort":[CF,"sort"],
      "jf-status":[JF,"status"],"jf-type":[JF,"type"],"jf-emp":[JF,"emp"],"jf-city":[JF,"city"],"jf-source":[JF,"source"],"jf-pay":[JF,"pay"],"jf-sort":[JF,"sort"],"jf-flag":[JF,"flag"],
      "lf-source":[LF,"source"],"lf-stage":[LF,"stage"],"lf-assigned":[LF,"assigned"],
      "ef-status":[EF,"status"],"ef-flag":[EF,"flag"],"if-flag":[IF,"flag"],"xf-cat":[XF,"cat"],"xf-vendor":[XF,"vendor"] };
    if(F[el.id]){ F[el.id][0][F[el.id][1]]=el.value; render(); return; }
    if(el.id==="dfrom"){ DASH.from=el.value; render(); return; }
    if(el.id==="dto"){ DASH.to=el.value; render(); return; }
    if(el.id==="rptfrom"){ RPT.from=el.value; render(); return; }
    if(el.id==="rptto"){ RPT.to=el.value; render(); return; }
    if(el.id==="xffrom"){ XF.from=el.value; render(); return; }
    if(el.id==="xfto"){ XF.to=el.value; render(); return; }
    if(d.calshow){ CAL.show[d.calshow]=el.checked; render(); return; }

    /* cost line */
    if(d.cid && d.cf){
      const jid = el.closest("[data-costrow]") ? (ROUTE.view==="job"?ROUTE.id:null) : null;
      const j = S.jobs[jid||ROUTE.id]; if(!j) return;
      const costs=(j.costs||[]).map(c=>{ if(c.id!==d.cid) return c;
        const n=Object.assign({},c); n[d.cf]= (d.cf==="qty"||d.cf==="unit")? num(el.value) : el.value;
        n.total = r2(num(n.qty)*num(n.unit)); return n; });
      await put("jobs", Object.assign({},j,{costs})); return;
    }
    /* estimate line item */
    if(d.iid && d["if"]){
      const e2=S.estimates[ROUTE.id]; if(!e2) return;
      const options=(e2.options||[]).map(o=> o.id!==d.oid? o : Object.assign({},o,{items:(o.items||[]).map(i=>{
        if(i.id!==d.iid) return i; const n=Object.assign({},i);
        n[d["if"]] = (d["if"]==="qty"||d["if"]==="price")? num(el.value) : el.value; return n; })}));
      await put("estimates", Object.assign({},e2,{options})); return;
    }
    /* estimate option field */
    if(d.oid && d.of){
      const e2=S.estimates[ROUTE.id]; if(!e2) return;
      const options=(e2.options||[]).map(o=> o.id!==d.oid? o : Object.assign({},o,{[d.of]: (d.of==="notes"?el.value:num(el.value))}));
      await put("estimates", Object.assign({},e2,{options})); return;
    }
    if(d.ef){ const e2=S.estimates[ROUTE.id]; if(!e2) return;
      await put("estimates", Object.assign({},e2,{[d.ef]:el.value})); return; }
    /* advertising spend */
    if(d.spend){
      const list=sourceList().map(s=>{ if(s.id!==d.spend) return s;
        const spend=Object.assign({}, s.spend||{}); if(el.value==="") delete spend[d.month]; else spend[d.month]=num(el.value);
        return Object.assign({},s,{spend}); });
      await putMeta("sources",{list}); return;
    }
    /* reminder tick */
    if(d.remDone){
      const r=S.reminders[d.remDone]; if(!r) return;
      await put("reminders", Object.assign({},r,{done:el.checked, doneAt: el.checked?nowISO():""}));
      toast(el.checked?"Done":"Reopened"); return;
    }
  });

  /* file input */
  $("#filepick").addEventListener("change", function(){ const f=Array.from(this.files||[]); this.value=""; if(f.length) handleUpload(f); });

  /* keyboard */
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ if(MODAL) closeModal(); else if($(".sheet")) $(".sheet").remove(); else hideSearch(); return; }
    const g=$("#gsearch");
    if(document.activeElement===g && SEARCH.items.length){
      if(e.key==="ArrowDown"){ e.preventDefault(); SEARCH.sel=Math.min(SEARCH.items.length-1,SEARCH.sel+1); paintSearch(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); SEARCH.sel=Math.max(0,SEARCH.sel-1); paintSearch(); }
      else if(e.key==="Enter"){ e.preventDefault(); const h=SEARCH.items[SEARCH.sel]; if(h){ g.value=""; SEARCH.items=[]; hideSearch(); location.hash="#/"+h.go; } }
      return;
    }
    if((e.key==="/"||((e.metaKey||e.ctrlKey)&&e.key==="k")) && !/input|textarea|select/i.test(document.activeElement.tagName)){
      e.preventDefault(); g.focus(); g.select();
    }
  });
  $("#gsearch").addEventListener("focus", function(){ if(this.value) { runSearch(this.value); paintSearch(); } });

  /* drag and drop — lead stages and calendar days */
  let DRAG=null;
  document.addEventListener("dragstart", e=>{
    const l=e.target.closest("[data-lead]"); const j=e.target.closest("[data-drag-job]");
    if(l){ DRAG={type:"lead",id:l.dataset.lead}; l.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",l.dataset.lead);}catch(x){} }
    else if(j){ DRAG={type:"job",id:j.dataset.dragJob}; j.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",j.dataset.dragJob);}catch(x){} }
  });
  document.addEventListener("dragend", e=>{ $$(".dragging").forEach(x=>x.classList.remove("dragging")); $$(".drop").forEach(x=>x.classList.remove("drop")); DRAG=null; });
  document.addEventListener("dragover", e=>{
    if(!DRAG) return;
    const target = DRAG.type==="lead" ? e.target.closest("[data-stage]") : e.target.closest("[data-day]");
    if(target){ e.preventDefault(); e.dataTransfer.dropEffect="move";
      $$(".drop").forEach(x=>{ if(x!==target) x.classList.remove("drop"); }); target.classList.add("drop"); }
  });
  document.addEventListener("drop", async e=>{
    if(!DRAG) return;
    if(DRAG.type==="lead"){
      const col=e.target.closest("[data-stage]"); if(!col) return; e.preventDefault();
      const st=col.dataset.stage, id=DRAG.id; DRAG=null; $$(".drop").forEach(x=>x.classList.remove("drop"));
      if(st==="won") winLead(id); else if(st==="lost") loseLead(id); else { await moveLead(id, st); toast("Moved to "+LEAD_STAGES[st].l); }
    } else {
      const cell=e.target.closest("[data-day]"); if(!cell) return; e.preventDefault();
      const day=cell.dataset.day, id=DRAG.id; DRAG=null; $$(".drop").forEach(x=>x.classList.remove("drop"));
      const j=S.jobs[id]; if(!j || j.scheduledDate===day) return;
      await put("jobs", Object.assign({},j,{scheduledDate:day, status: j.status==="new"||j.status==="approved" ? "scheduled" : j.status}));
      toast("Moved to "+fmtDate(day));
    }
  });
}
function go2(p){ location.hash="#/"+p; }

/* -------------------------------- theme --------------------------------- */
function setTheme(mode){
  try{ localStorage.setItem("overhead.theme", mode); }catch(e){}
  applyTheme();
}
function applyTheme(){
  let m="system"; try{ m=localStorage.getItem("overhead.theme")||"system"; }catch(e){}
  const r=document.documentElement;
  if(m==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", m);
  const btn=$("#themebtn");
  if(btn) btn.innerHTML='<svg aria-hidden="true"><use href="#'+(m==="dark"?"i-sun":"i-moon")+'"/></svg>';
}

/* --------------------------------- boot --------------------------------- */
applyTheme();
bindEvents();
window.addEventListener("hashchange", onRoute);
ROUTE = parseHash();
paintNav();
$("#page").innerHTML='<div class="empty" style="padding:80px 20px"><svg aria-hidden="true"><use href="#i-db"/></svg><h4>Opening your books…</h4></div>';
initData();
</script>
