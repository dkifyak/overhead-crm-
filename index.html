}
function mtd(l,v){ return '<div style="flex:0 0 auto"><div class="tiny muted">'+esc(l)+'</div><div style="font-family:var(--cond);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15">'+esc(v)+'</div></div>'; }
function kpiHero(label,value,detail,series){
  const spark = sparkline(series.map(s=>s.a), "rgba(255,255,255,.55)");
  return '<div class="kpi hero"><div class="kl">'+esc(label)+'</div><div class="kv">'+esc(value)+'</div><div class="kd">'+esc(detail)+'</div>'+spark+'</div>';
}
function kpiMargin(m){
  const w = Math.max(0,Math.min(100,m));
  const c = m>=40?"var(--good)":m>=25?"var(--s1)":m>=12?"var(--warn)":"var(--bad)";
  return '<div class="kpi"><div class="kl">Profit margin</div><div class="kv" style="color:'+c+'">'+(isFinite(m)&&m!==0?pct(m,1):"—")+'</div>'+
    '<div class="marbar" aria-hidden="true"><i style="width:'+w.toFixed(1)+'%;background:'+c+'"></i></div>'+
    '<div class="kd">'+(m>=40?"Strong":m>=25?"Healthy":m>=12?"Thin":m>0?"Very thin":"No revenue yet")+'</div></div>';
}
function sparkline(vals,color){
  if(!vals || vals.length<2) return "";
  const max=Math.max(1,...vals), W=200,H=26;
  const pts=vals.map((v,i)=>(i/(vals.length-1)*W).toFixed(1)+","+(H-(num(v)/max)*(H-3)).toFixed(1));
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}

function dashUpcoming(at){
  const list = at.upcoming.slice(0,6);

    (at.overdueJobs.length?'<span class="pill p-bad">'+at.overdueJobs.length+' past due</span>':'')+
    '<a class="tiny" href="#/calendar">Calendar</a></div><div class="cbody tight">'+
    (list.length? list.map(j=>{
      const a=jobAddr(j); const c=cust(j.customerId);
      return '<button class="mrow" data-go="job/'+attr(j.id)+'" style="border:0;padding:8px 8px;border-radius:8px">'+
        '<div class="l1"><span class="t">'+esc(custLabel(j.customerId))+'</span>'+jobPill(j.status)+'</div>'+
        '<div class="l2"><b style="color:var(--ink-2)">'+esc(relDay(j.scheduledDate))+(j.scheduledTime?" · "+esc(fmtTime(j.scheduledTime)):"")+'</b>'+
        (a&&a.city?'<span>'+esc(a.city)+'</span>':'')+(c&&c.phone?'<span class="mono">'+esc(phoneFmt(c.phone))+'</span>':'')+'</div>'+
        '<div class="l2"><span>'+esc(j.title||j.type||"Job")+'</span></div></button>';
    }).join("") : emptyBox("i-cal","Nothing scheduled","Add a job and give it a date."))+
    (at.unscheduled.length?'<div class="hr"></div><button class="btn sm block ghost" data-go="jobs?f=unscheduled">'+at.unscheduled.length+(at.unscheduled.length===1?" job still needs":" jobs still need")+' a date →</button>':'')+
    '</div></div>';
}
function dashAttention(at){
  const rows=[];
  if(at.overdueInv.length) rows.push(aRow("i-alert","bad", at.overdueInv.length+" overdue invoice"+(at.overdueInv.length===1?"":"s"), money(at.overdueInv.reduce((a,j)=>a+jobFinance(j).balance,0))+" past due","invoices?f=overdue"));
  const stillOwed = at.unpaid.length-at.overdueInv.length;
  if(stillOwed>0) rows.push(aRow("i-inv","warn", stillOwed+" unpaid invoice"+(stillOwed===1?"":"s"), money(at.unpaidTotal - at.overdueInv.reduce((a,j)=>a+jobFinance(j).balance,0))+" outstanding","invoices?f=unpaid"));
  if(at.openEst.length) rows.push(aRow("i-doc","info", at.openEst.length+" open estimate"+(at.openEst.length===1?"":"s"), money(at.estTotal)+" waiting on an answer","estimates?f=open"));
  if(at.dueRem.length) rows.push(aRow("i-bell","bad", at.dueRem.length+" reminder"+(at.dueRem.length===1?"":"s")+" due", at.dueRem[0].title,"notifications"));
  if(at.followUps.length) rows.push(aRow("i-phone","warn", at.followUps.length+" customer follow-up"+(at.followUps.length===1?"":"s"), "next: "+custName(at.followUps[0]),"customers?f=followup"));
  if(at.overdueJobs.length) rows.push(aRow("i-wrench","bad", at.overdueJobs.length+" job"+(at.overdueJobs.length===1?"":"s")+" past their date","still open in the calendar","jobs?f=late"));
  return '<div class="card"><div class="chead"><h3>Needs you</h3>'+(rows.length?'<span class="pill p-neutral">'+rows.length+'</span>':'<span class="pill p-good">Clear</span>')+'</div><div class="cbody tight">'+
    (rows.length? rows.join("") : emptyBox("i-check","All caught up","No overdue invoices, estimates or callbacks."))+'</div></div>';
}
function aRow(icon,tone,title,sub,go){
  const col = tone==="bad"?"var(--bad)":tone==="warn"?"var(--warn)":"var(--info)";
  const bg  = tone==="bad"?"var(--bad-soft)":tone==="warn"?"var(--warn-soft)":"var(--info-soft)";
  return '<button class="mrow" data-go="'+attr(go)+'" style="border:0;padding:8px;border-radius:8px;flex-direction:row;align-items:center;gap:10px">'+
    '<span style="width:29px;height:29px;border-radius:8px;background:'+bg+';color:'+col+';display:flex;align-items:center;justify-content:center;flex:0 0 29px"><svg style="width:15px;height:15px" aria-hidden="true"><use href="#'+icon+'"/></svg></span>'+
    '<span class="grow"><span style="display:block;font-weight:600;font-size:13.5px">'+esc(title)+'</span><span class="tiny muted trunc" style="display:block">'+esc(sub)+'</span></span>'+
    '<svg style="width:15px;height:15px;color:var(--ink-3);flex:0 0 15px" aria-hidden="true"><use href="#i-right"/></svg></button>';
}
function dashPipeline(at){
  const l = at.newLeads.slice(0,5);
  const val = at.newLeads.reduce((a,x)=>a+num(x.estValue),0);
  return '<div class="card"><div class="chead"><h3>New leads</h3>'+(val?'<span class="pill p-brand">'+money(val)+' potential</span>':'')+'<a class="tiny" href="#/leads">Pipeline</a></div><div class="cbody tight">'+
    (l.length? l.map(x=>'<button class="mrow" data-go="lead/'+attr(x.id)+'" style="border:0;padding:8px;border-radius:8px">'+
        '<div class="l1"><span class="t">'+esc(x.name||"Unnamed lead")+'</span>'+(x.estValue?'<span class="lv">'+money(x.estValue)+'</span>':'')+'</div>'+
        '<div class="l2"><span>'+esc(sourceName(x.source))+'</span><span>'+esc(relDay(x.receivedAt))+'</span>'+(x.city?'<span>'+esc(x.city)+'</span>':'')+'</div>'+
        (x.service?'<div class="l2"><span>'+esc(x.service)+'</span></div>':'')+
      '</button>').join("") : emptyBox("i-lead","No new leads","Leads you add land here first."))+
    '</div></div>';
}

function explainMoney(){
  const st=settings();
  openModal({title:"How these numbers work", size:"wide", body:
    '<div class="stack">'+
    '<div><h4 style="margin-bottom:4px">A job counts as revenue when you mark it complete</h4><p class="tiny muted" style="margin:0">Jobs sitting at Scheduled or In Progress are not in your revenue yet — they show under “Coming up”. A job counts on its completion date; if you have not set one, its scheduled date is used. Cancelled jobs never count.</p></div>'+
    '<div><h4 style="margin-bottom:4px">Sales tax is not revenue</h4><p class="tiny muted" style="margin:0">Tax you collect belongs to the state, so it is left out of revenue and profit. Your customer’s total still includes it, and it is tracked separately on every invoice. Your default rate is '+esc(num(st.taxRate).toFixed(2))+'% — change it in Settings, or override it on any single job.</p></div>'+
    '<div><h4 style="margin-bottom:4px">Gross profit is revenue minus what the job cost you</h4>'+
    '<div class="card flat" style="background:var(--surface-2);padding:12px;margin-top:6px"><div class="totbox" style="width:100%;max-width:340px;margin:0">'+
      '<div class="tl"><span class="lab">Customer price (after discount)</span><span>$2,000</span></div>'+
      '<div class="tl"><span class="lab">Materials</span><span>−$800</span></div>'+
      '<div class="tl"><span class="lab">Labor</span><span>−$300</span></div>'+
      '<div class="tl"><span class="lab">Other costs</span><span>−$100</span></div>'+
      '<div class="tl big"><span>Gross profit</span><span class="pos">$800</span></div>'+
      '<div class="tl"><span class="lab">Margin</span><span>40.0%</span></div>'+
    '</div></div></div>'+
    '<div><h4 style="margin-bottom:4px">Cash collected is a different number</h4><p class="tiny muted" style="margin:0">Revenue is work you have done. Cash collected is money that actually arrived. The gap between them is your unpaid invoices.</p></div>'+
    '<div><h4 style="margin-bottom:4px">Customer acquisition cost and ROAS</h4><p class="tiny muted" style="margin:0">Enter what you spend per month on each paid source under Settings → Lead sources. Acquisition cost is that spend divided by customers won from the source in the period; ROAS is revenue from that source divided by the spend.</p></div>'+
    '</div>'});
}
</script>
<script>
/* ==========================================================================
   Customers · properties · communications · timeline
   ========================================================================== */
let CF = {q:"",type:"",status:"",source:"",city:"",sort:"recent",flag:""};

function customerRows(){
  const q = CF.q.trim().toLowerCase(), qd = digits(CF.q);
  let rows = listOf("customers").map(c=>{
    const R = custRollup(c.id);
    return {c, R, city:(c.properties&&c.properties[0]&&c.properties[0].city)||(c.billing&&c.billing.city)||""};
  });
  if(q) rows = rows.filter(x=>{
    const c=x.c;
    const hay = [custName(c),c.company,c.email,c.notes,(c.tags||[]).join(" "),x.city,
                 (c.properties||[]).map(p=>p.street+" "+p.city+" "+p.zip).join(" ")].join(" ").toLowerCase();
    return hay.indexOf(q)>=0 || (qd && (digits(c.phone).indexOf(qd)>=0 || digits(c.phone2).indexOf(qd)>=0));
  });
  if(CF.type)   rows = rows.filter(x=>x.c.type===CF.type);
  if(CF.status) rows = rows.filter(x=>x.c.status===CF.status);
  if(CF.source) rows = rows.filter(x=>x.c.source===CF.source);
  if(CF.city)   rows = rows.filter(x=>(x.city||"").toLowerCase()===CF.city.toLowerCase());
  if(CF.flag==="followup") rows = rows.filter(x=>x.c.nextFollowUp && dOnly(x.c.nextFollowUp)<=addDays(todayISO(),7));
  if(CF.flag==="owing")    rows = rows.filter(x=>x.R.balance>0.005);
  if(CF.flag==="repeat")   rows = rows.filter(x=>x.R.count>1);
  const S_ = {
    recent:(a,b)=> (b.R.last||"")>(a.R.last||"")?1:-1,
    name:(a,b)=> custName(a.c).localeCompare(custName(b.c)),
    revenue:(a,b)=> b.R.revenue-a.R.revenue,
    profit:(a,b)=> b.R.profit-a.R.profit,
    balance:(a,b)=> b.R.balance-a.R.balance,
    created:(a,b)=> (b.c.createdAt||"")>(a.c.createdAt||"")?1:-1
  };
  return rows.sort(S_[CF.sort]||S_.recent);
}

function viewCustomers(){
  if(ROUTE.q.f && ROUTE.q.f!==CF.flag){ CF.flag=ROUTE.q.f; }
  const rows = customerRows();
  const cities = Array.from(new Set(listOf("customers").flatMap(c=>[(c.properties||[]).map(p=>p.city),(c.billing||{}).city].flat()).filter(Boolean))).sort();
  const tot = rows.reduce((a,x)=>({r:a.r+x.R.revenue,p:a.p+x.R.profit,b:a.b+x.R.balance}),{r:0,p:0,b:0});

  return '<div class="phead"><div class="ptitle"><h1>Customers</h1>'+
      '<div class="sub">'+rows.length+' shown · '+money(tot.r)+' lifetime revenue · '+money(tot.p)+' profit'+(tot.b>0?' · <span class="neg">'+money(tot.b)+' owed to you</span>':'')+'</div></div>'+
    '<div class="pacts"><button class="btn" data-act="export-customers"><svg aria-hidden="true"><use href="#i-dl"/></svg>Export</button>'+
      '<button class="btn pri" data-act="new-customer"><svg aria-hidden="true"><use href="#i-plus"/></svg>Add customer</button></div></div>'+

    '<div class="filters">'+
      '<input class="inp" id="cf-q" placeholder="Filter by name, phone, address…" value="'+attr(CF.q)+'" style="min-width:210px" aria-label="Filter customers">'+
      selInline("cf-type","Any type",CUST_TYPE,CF.type)+
      selInline("cf-status","Any status",CUST_STATUS,CF.status)+
      selInline("cf-source","Any source",sourceList().reduce((o,s)=>(o[s.id]=s.name,o),{}),CF.source)+
      selInline("cf-city","Any city",cities.reduce((o,c)=>(o[c]=c,o),{}),CF.city)+
      selInline("cf-flag","Everyone",{followup:"Follow-up due",owing:"Owes money",repeat:"Repeat customers"},CF.flag)+
      selInline("cf-sort","",{recent:"Sort: recent work",name:"Sort: name",revenue:"Sort: revenue",profit:"Sort: profit",balance:"Sort: balance owed",created:"Sort: newest added"},CF.sort,true)+
      (Object.values(CF).some(v=>v&&v!=="recent")?'<button class="btn sm ghost" data-act="clear-cf">Clear</button>':'')+
      '<span class="count">'+rows.length+' of '+listOf("customers").length+'</span>'+
    '</div>'+

    (rows.length? '<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr>'+
      '<th>Customer</th><th>Contact</th><th>Where</th><th>Source</th><th class="r">Jobs</th><th class="r">Revenue</th><th class="r">Profit</th><th class="r">Owed</th><th>Last job</th></tr></thead><tbody>'+
      rows.map(x=>{ const c=x.c,R=x.R;
        return '<tr data-go="customer/'+attr(c.id)+'">'+
          '<td><div class="nm">'+esc(custName(c))+'</div><div class="sec">'+esc(CUST_TYPE[c.type]||"")+(c.status&&c.status!=="active"?' · '+esc(CUST_STATUS[c.status]||""):"")+'</div></td>'+
          '<td><div class="mono tiny">'+esc(phoneFmt(c.phone))+'</div><div class="sec trunc" style="max-width:170px">'+esc(c.email||"")+'</div></td>'+
          '<td><div class="tiny">'+esc(x.city||"—")+'</div><div class="sec">'+esc(((c.properties||[])[0]||{}).zip||"")+(c.properties&&c.properties.length>1?' · '+c.properties.length+' properties':'')+'</div></td>'+
          '<td class="tiny">'+esc(sourceName(c.source))+'</td>'+
          '<td class="r">'+R.count+'</td><td class="r">'+money(R.revenue)+'</td>'+
          '<td class="r '+(R.profit>=0?"pos":"neg")+'">'+money(R.profit)+'</td>'+
          '<td class="r">'+(R.balance>0.005?'<b class="neg">'+money(R.balance)+'</b>':'<span class="muted">—</span>')+'</td>'+
          '<td class="tiny">'+(R.last?esc(fmtDate(R.last)):'<span class="muted">—</span>')+'</td></tr>';
      }).join("")+'</tbody></table></div></div>'+
      '<div class="mlist">'+rows.map(x=>{ const c=x.c,R=x.R;
        return '<button class="mrow" data-go="customer/'+attr(c.id)+'">'+
          '<div class="l1"><span class="t">'+esc(custName(c))+'</span>'+(R.balance>0.005?'<span class="pill p-bad">'+money(R.balance)+'</span>':'')+'</div>'+
          '<div class="l2"><span class="mono">'+esc(phoneFmt(c.phone))+'</span>'+(x.city?'<span>'+esc(x.city)+'</span>':'')+'<span>'+esc(CUST_TYPE[c.type]||"")+'</span></div>'+
          '<div class="l3"><span>'+R.count+' job'+(R.count===1?"":"s")+'</span><span class="muted">·</span><span>'+money(R.revenue)+'</span><span class="muted">·</span><span class="'+(R.profit>=0?"pos":"neg")+'">'+money(R.profit)+' profit</span></div>'+
        '</button>'; }).join("")+'</div>'
      : emptyBox("i-users","No customers match","Try clearing the filters, or add your first customer.",'<button class="btn pri" data-act="new-customer">Add customer</button>'));
}
function selInline(id,blank,opts,val,noBlank){
  const items = Array.isArray(opts)?opts.map(v=>({v,l:v})):Object.keys(opts).map(k=>({v:k,l:typeof opts[k]==="object"?opts[k].l:opts[k]}));
  return '<select class="sel" id="'+attr(id)+'" aria-label="'+attr(blank||id)+'">'+(noBlank?"":'<option value="">'+esc(blank)+'</option>')+
    items.map(i=>'<option value="'+attr(i.v)+'"'+(String(val)===String(i.v)?' selected':'')+'>'+esc(i.l)+'</option>').join("")+'</select>';
}

/* ------------------------------ the profile ----------------------------- */
let CTAB = "overview";
function viewCustomer(id){
  const c = cust(id);
  if(!c) return emptyBox("i-users","Customer not found","It may have been deleted.",'<a class="btn" href="#/customers">Back to customers</a>');
  const R = custRollup(id);
  const props = c.properties||[];
  const main = props[0]||c.billing||{};
  const ests = listOf("estimates").filter(e=>e.customerId===id).sort((a,b)=>(a.date||"")<(b.date||"")?1:-1);
  const rems = listOf("reminders").filter(r=>r.customerId===id&&!r.done).sort((a,b)=>(a.dueAt||"")<(b.dueAt||"")?-1:1);
  const tabs=[["overview","Overview"],["jobs","Jobs · "+R.jobs.length],["money","Estimates & invoices"],["equipment","Property & equipment"],["comms","Contact log"],["files","Photos & files"],["timeline","Timeline"]];

  return '<div class="phead"><div class="ptitle">'+
      '<a class="tiny" href="#/customers">← Customers</a>'+
      '<h1>'+esc(custName(c))+'</h1>'+
      '<div class="row" style="margin-top:5px;gap:6px">'+pill(CUST_TYPE[c.type]||"Customer","p-neutral")+
        pill(CUST_STATUS[c.status]||"Active", c.status==="active"?"p-good":c.status==="lead"?"p-info":"p-neutral")+
        (R.count>1?pill("Repeat · "+R.count+" jobs","p-brand"):"")+
        (R.balance>0.005?pill(money(R.balance)+" owed","p-bad"):"")+
        (c.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+
      '</div></div>'+
    '<div class="pacts">'+
      (c.phone?'<a class="btn" href="tel:'+attr(digits(c.phone))+'"><svg aria-hidden="true"><use href="#i-phone"/></svg>Call</a>':'')+
      (c.phone?'<a class="btn" href="sms:'+attr(digits(c.phone))+'"><svg aria-hidden="true"><use href="#i-msg"/></svg>Text</a>':'')+
      '<button class="btn" data-act="log-contact" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-note"/></svg>Log contact</button>'+
      '<button class="btn" data-act="edit-customer" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-edit"/></svg>Edit</button>'+
      '<button class="btn pri" data-act="new-job" data-cust="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-plus"/></svg>New job</button>'+
    '</div></div>'+

    /* the answer block — everything the primary goal asks for, above the fold */
    '<div class="grid2" style="margin-bottom:14px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)">'+
      '<div class="card pad"><div class="eyebrow" style="margin-bottom:8px">Who and where</div><dl style="margin:0">'+
        kvRow("Phone", c.phone?'<a href="tel:'+attr(digits(c.phone))+'" class="mono">'+esc(phoneFmt(c.phone))+'</a>'+(c.phone2?' <span class="muted tiny">alt '+esc(phoneFmt(c.phone2))+'</span>':''):"—")+
        kvRow("Email", c.email?'<a href="mailto:'+attr(c.email)+'">'+esc(c.email)+'</a>':"—")+
        kvRow("Best contact", CONTACT_PREF[c.preferredContact]||"No preference")+
        kvRow("Service address", props.length? props.map(p=>'<div style="margin-bottom:3px">'+(p.label?'<b>'+esc(p.label)+'</b> · ':'')+esc(addrOneLine(p))+
            ' <a class="tiny" target="_blank" rel="noopener" href="'+attr(mapsUrl(p))+'">map ↗</a></div>').join("") : esc(addrOneLine(c.billing))||"—")+
        (c.billing&&c.billing.street && (!props.length || addrOneLine(c.billing)!==addrOneLine(props[0])) ? kvRow("Billing address", esc(addrOneLine(c.billing))):"")+
        kvRow("How we got them", '<b>'+esc(sourceName(c.source))+'</b>'+(c.sourceDetail?' <span class="muted tiny">'+esc(c.sourceDetail)+'</span>':""))+
        kvRow("Customer since", fmtDateFull(c.createdAt))+
      '</dl></div>'+
      '<div class="card pad"><div class="eyebrow" style="margin-bottom:8px">What they are worth</div>'+
        '<div class="pstrip" style="margin-bottom:10px">'+
          '<div><span class="pl">Lifetime revenue</span><span class="pv">'+money(R.revenue)+'</span></div>'+
          '<div><span class="pl">Job costs</span><span class="pv">'+money(R.cost)+'</span></div>'+
          '<div><span class="pl">Gross profit</span><span class="pv '+(R.profit>=0?"pos":"neg")+'">'+money(R.profit)+'</span></div>'+
          '<div><span class="pl">Owed to you</span><span class="pv '+(R.balance>0.005?"neg":"")+'">'+money(R.balance)+'</span></div>'+
        '</div>'+
        '<dl style="margin:0">'+
          kvRow("Jobs completed", R.count+(R.count?' · avg '+money(R.avg)+' · '+pct(R.margin,0)+' margin':''))+
          kvRow("First / last job", R.first? fmtDate(R.first)+" → "+fmtDate(R.last) : "—")+
          kvRow("Next job", R.upcoming.length? '<a href="#/job/'+attr(R.upcoming[0].id)+'"><b>'+esc(relDay(R.upcoming[0].scheduledDate))+'</b> · '+esc(R.upcoming[0].title||R.upcoming[0].type||"Job")+'</a>' : '<span class="muted">nothing scheduled</span>')+
          kvRow("Next contact", c.nextFollowUp
              ? '<b class="'+(dOnly(c.nextFollowUp)<=todayISO()?"neg":"")+'">'+esc(relDay(c.nextFollowUp))+'</b> '+(c.followUpNote?'<span class="muted tiny">'+esc(c.followUpNote)+'</span>':'')+' <button class="btn sm ghost" data-act="set-followup" data-id="'+attr(id)+'">change</button>'
              : '<button class="btn sm" data-act="set-followup" data-id="'+attr(id)+'">Set a follow-up</button>')+
        '</dl>'+
      '</div>'+
    '</div>'+

    (rems.length? '<div class="banner info"><svg aria-hidden="true"><use href="#i-bell"/></svg><div>'+rems.map(r=>'<div><b>'+esc(relDay(r.dueAt))+'</b> — '+esc(r.title)+'</div>').join("")+'</div></div>':'')+
    (c.notes? '<div class="card pad" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:4px">Notes</div><div style="white-space:pre-wrap">'+esc(c.notes)+'</div></div>':'')+

    '<div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" data-ctab="'+t[0]+'" aria-selected="'+(CTAB===t[0])+'">'+esc(t[1])+'</button>').join("")+'</div>'+
    '<div id="ctabpanel">'+custTab(c,R,ests)+'</div>';
}
function kvRow(k,v){ return '<div class="kv"><dt>'+esc(k)+'</dt><dd>'+v+'</dd></div>'; }

function custTab(c,R,ests){
  const id=c.id;
  if(CTAB==="overview"){
    const jobs = listOf("jobs").filter(j=>j.customerId===id).sort((a,b)=>(jobDate(b)||"")>(jobDate(a)||"")?1:-1);
    const openEst = ests.filter(e=>["draft","sent","viewed"].indexOf(e.status)>=0);
    const owing = jobs.filter(j=>["sent","partial","overdue"].indexOf(invStatus(j))>=0);
    const comms = (c.comms||[]).slice().sort((a,b)=>(a.at||"")<(b.at||"")?1:-1).slice(0,3);
    const doors = jobs.filter(j=>j.door && Object.keys(j.door).some(k=>j.door[k]!=null&&j.door[k]!==""));
    const card=(title,inner,action)=>'<div class="card"><div class="chead"><h3>'+esc(title)+'</h3>'+(action||"")+'</div><div class="cbody tight">'+inner+'</div></div>';
    return '<div class="grid2" style="gap:14px">'+
      card("Coming up", R.upcoming.length? R.upcoming.map(j=>
          '<button class="mrow" data-go="job/'+attr(j.id)+'" style="border:0"><div class="l1"><span class="t">'+esc(j.title||j.type||"Job")+'</span>'+jobPill(j.status)+'</div>'+
          '<div class="l2"><b style="color:var(--ink-2)">'+esc(relDay(j.scheduledDate))+(j.scheduledTime?" · "+esc(fmtTime(j.scheduledTime)):"")+'</b><span>'+money(jobFinance(j).subtotal)+'</span></div></button>').join("")
        : '<div class="tiny muted" style="padding:8px 4px">Nothing scheduled for them right now.</div>',
        '<button class="btn sm pri" data-act="new-job" data-cust="'+attr(id)+'">New job</button>')+
      card(owing.length?"They owe you":"Money", owing.length? owing.map(j=>{const f=jobFinance(j);
          return '<button class="mrow" data-go="job/'+attr(j.id)+'" style="border:0"><div class="l1"><span class="t mono">'+esc(j.invoice.number)+'</span>'+invPill(j)+'</div>'+
          '<div class="l2"><span>'+esc(j.title||"")+'</span><span>due '+esc(j.invoice.dueDate?fmtDate(j.invoice.dueDate):"—")+'</span></div>'+
          '<div class="l3"><b class="neg">'+money2(f.balance)+' outstanding</b><span class="muted tiny">of '+money2(f.total)+'</span></div></button>'; }).join("")
        : '<div class="tiny" style="padding:8px 4px;color:var(--good)">Paid up — nothing outstanding.</div>')+
      card("Open estimates", openEst.length? openEst.map(e=>{const f=estFinance(e);
          return '<button class="mrow" data-go="estimate/'+attr(e.id)+'" style="border:0"><div class="l1"><span class="t">'+esc(e.title||"Estimate")+'</span>'+estPill(e.status)+'</div>'+
          '<div class="l2"><span class="mono">'+esc(e.number)+'</span>'+(e.expiresAt?'<span>expires '+esc(fmtDate(e.expiresAt))+'</span>':'')+'</div>'+
          '<div class="l3"><b>'+money(f.total)+'</b></div></button>'; }).join("")
        : '<div class="tiny muted" style="padding:8px 4px">No estimates waiting on an answer.</div>',
        '<button class="btn sm" data-act="new-estimate" data-cust="'+attr(id)+'">New estimate</button>')+
      card("Last few conversations", comms.length? comms.map(m=>
          '<div class="mrow" style="border:0;cursor:default"><div class="l1"><span class="t">'+esc({call:"Phone call",text:"Text",email:"Email",note:"Note",visit:"Site visit"}[m.kind]||"Note")+'</span><span class="tiny muted">'+esc(fmtDate(m.at))+'</span></div>'+
          '<div class="l2"><span style="white-space:normal">'+esc(m.summary||"")+'</span></div></div>').join("")
        : '<div class="tiny muted" style="padding:8px 4px">Nothing logged yet.</div>',
        '<button class="btn sm" data-act="log-contact" data-id="'+attr(id)+'">Log contact</button>')+
      '<div style="grid-column:1/-1">'+card("What is on the wall", doors.length? doors.map(doorCard).join("")
        : '<div class="tiny muted" style="padding:8px 4px">No door or opener details recorded. Fill them in on a job under “Door &amp; opener” and they stay with the address for good.</div>')+'</div>'+
      '<div style="grid-column:1/-1">'+card("Recent work", jobs.slice(0,5).length? jobs.slice(0,5).map(j=>{const f=jobFinance(j);
          return '<button class="mrow" data-go="job/'+attr(j.id)+'" style="border:0"><div class="l1"><span class="t">'+esc(j.title||j.type||"Job")+'</span>'+jobPill(j.status)+(f.subtotal?marginPill(f.margin):"")+'</div>'+
          '<div class="l2"><span class="mono">'+esc(j.number||"")+'</span><span>'+esc(fmtDate(jobDate(j))||"no date")+'</span><span>'+money(f.subtotal)+' · '+money(f.profit)+' profit</span></div></button>'; }).join("")
        : '<div class="tiny muted" style="padding:8px 4px">No jobs yet.</div>')+'</div>'+
    '</div>';
  }
  if(CTAB==="jobs"){
    const jobs = listOf("jobs").filter(j=>j.customerId===id).sort((a,b)=> (jobDate(b)||"")>(jobDate(a)||"")?1:-1);
    if(!jobs.length) return emptyBox("i-wrench","No jobs yet","",'<button class="btn pri" data-act="new-job" data-cust="'+attr(id)+'">Create the first job</button>');
    return '<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Job</th><th>Date</th><th>Status</th><th class="r">Price</th><th class="r">Cost</th><th class="r">Profit</th><th class="r">Margin</th><th>Invoice</th></tr></thead><tbody>'+
      jobs.map(j=>{ const f=jobFinance(j);
        return '<tr data-go="job/'+attr(j.id)+'"><td><div class="nm">'+esc(j.title||j.type||"Job")+'</div><div class="sec mono">'+esc(j.number||"")+'</div></td>'+
        '<td class="tiny">'+esc(fmtDate(jobDate(j))||"—")+'</td><td>'+jobPill(j.status)+'</td>'+
        '<td class="r">'+money(f.subtotal)+'</td><td class="r">'+money(f.costTotal)+'</td>'+
        '<td class="r '+(f.profit>=0?"pos":"neg")+'">'+money(f.profit)+'</td><td class="r">'+(f.subtotal?pct(f.margin,0):"—")+'</td>'+
        '<td>'+invPill(j)+(f.balance>0.005&&j.invoice&&j.invoice.number?' <span class="tiny neg">'+money(f.balance)+'</span>':'')+'</td></tr>'; }).join("")+
      '</tbody></table></div></div>'+
      '<div class="mlist">'+jobs.map(j=>{const f=jobFinance(j);
        return '<button class="mrow" data-go="job/'+attr(j.id)+'"><div class="l1"><span class="t">'+esc(j.title||j.type||"Job")+'</span>'+jobPill(j.status)+'</div>'+
        '<div class="l2"><span class="mono">'+esc(j.number||"")+'</span><span>'+esc(fmtDate(jobDate(j))||"—")+'</span></div>'+
        '<div class="l3"><span>'+money(f.subtotal)+'</span><span class="muted">·</span><span class="'+(f.profit>=0?"pos":"neg")+'">'+money(f.profit)+' profit</span>'+(f.subtotal?'<span class="muted">·</span><span>'+pct(f.margin,0)+'</span>':'')+'</div></button>'; }).join("")+'</div>';
  }
  if(CTAB==="money"){
    const jobs = listOf("jobs").filter(j=>j.customerId===id && j.invoice && j.invoice.number);
    const pays = [];
    listOf("jobs").filter(j=>j.customerId===id).forEach(j=>(j.payments||[]).forEach(p=>pays.push({p,j})));
    pays.sort((a,b)=>(a.p.at||"")<(b.p.at||"")?1:-1);
    return '<div class="stack">'+
      '<div class="card"><div class="chead"><h3>Estimates</h3><button class="btn sm pri" data-act="new-estimate" data-cust="'+attr(id)+'">New estimate</button></div>'+
      (ests.length? '<div class="cbody tight">'+ests.map(e=>{ const f=estFinance(e);
          return '<button class="mrow" data-go="estimate/'+attr(e.id)+'" style="border:0">'+
          '<div class="l1"><span class="t">'+esc(e.title||"Estimate")+'</span>'+estPill(e.status)+'</div>'+
          '<div class="l2"><span class="mono">'+esc(e.number||"")+'</span><span>'+esc(fmtDate(e.date))+'</span>'+(e.expiresAt?'<span>expires '+esc(fmtDate(e.expiresAt))+'</span>':'')+'</div>'+
          '<div class="l3"><b>'+money(f.total)+'</b>'+(e.options&&e.options.length>1?'<span class="muted tiny">'+e.options.length+' options</span>':'')+'</div></button>'; }).join("")+'</div>'
        : '<div class="cbody">'+emptyBox("i-doc","No estimates","")+'</div>')+'</div>'+
      '<div class="card"><div class="chead"><h3>Invoices</h3></div>'+
      (jobs.length? '<div class="cbody tight">'+jobs.map(j=>{ const f=jobFinance(j);
          return '<button class="mrow" data-go="job/'+attr(j.id)+'" style="border:0"><div class="l1"><span class="t mono">'+esc(j.invoice.number)+'</span>'+invPill(j)+'</div>'+
          '<div class="l2"><span>'+esc(j.title||j.type||"Job")+'</span><span>'+esc(fmtDate(j.invoice.date))+'</span>'+(j.invoice.dueDate?'<span>due '+esc(fmtDate(j.invoice.dueDate))+'</span>':'')+'</div>'+
          '<div class="l3"><span>'+money2(f.total)+' total</span><span class="muted">·</span><span>'+money2(f.paid)+' paid</span>'+(f.balance>0.005?'<span class="muted">·</span><b class="neg">'+money2(f.balance)+' due</b>':'')+'</div></button>'; }).join("")+'</div>'
        : '<div class="cbody">'+emptyBox("i-inv","No invoices yet","Invoice a completed job and it appears here.")+'</div>')+'</div>'+
      '<div class="card"><div class="chead"><h3>Payments received</h3></div>'+
      (pays.length? '<div class="cbody tight">'+pays.map(x=>'<div class="mrow" style="border:0;cursor:default"><div class="l1"><span class="t">'+money2(x.p.amount)+'</span><span class="tag">'+esc(PAY_METHODS[x.p.method]||x.p.method||"")+'</span></div>'+
          '<div class="l2"><span>'+esc(fmtDate(x.p.at))+'</span><span>'+esc(x.j.number||"")+' · '+esc(x.j.title||"")+'</span>'+(x.p.note?'<span>'+esc(x.p.note)+'</span>':'')+'</div></div>').join("")+'</div>'
        : '<div class="cbody">'+emptyBox("i-cash","No payments recorded","")+'</div>')+'</div>'+
    '</div>';
  }
  if(CTAB==="equipment"){
    const props=c.properties||[];
    return '<div class="stack">'+
      '<div class="row"><h3 class="grow">Properties and service addresses</h3><button class="btn sm pri" data-act="add-property" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-plus"/></svg>Add property</button></div>'+
      (props.length? props.map((p,i)=>{
        const pjobs = listOf("jobs").filter(j=>j.customerId===id && (j.propertyId===p.id || (!j.propertyId && i===0)));
        const doors = pjobs.filter(j=>j.door && Object.values(j.door).some(v=>v!=null&&v!==""));
        return '<div class="card"><div class="chead"><h3>'+esc(p.label||("Property "+(i+1)))+'</h3>'+
          '<a class="btn sm" target="_blank" rel="noopener" href="'+attr(mapsUrl(p))+'"><svg aria-hidden="true"><use href="#i-pin"/></svg>Navigate</a>'+
          '<button class="btn sm ghost" data-act="edit-property" data-id="'+attr(id)+'" data-pid="'+attr(p.id)+'">Edit</button></div>'+
          '<div class="cbody"><div class="tiny muted" style="margin-bottom:8px">'+esc(addrOneLine(p))+(p.notes?' · '+esc(p.notes):'')+(p.gate?' · Gate/access: '+esc(p.gate):'')+'</div>'+
          '<div class="eyebrow" style="margin-bottom:6px">Equipment on site</div>'+
          (doors.length? doors.map(j=>doorCard(j)).join("") : '<div class="tiny muted">No door or opener details recorded yet. Add them on a job under “Door &amp; opener”.</div>')+
          '<div class="hr"></div><div class="eyebrow" style="margin-bottom:6px">Service history here</div>'+
          (pjobs.length? pjobs.sort((a,b)=>(jobDate(b)||"")>(jobDate(a)||"")?1:-1).map(j=>
             '<button class="mrow" data-go="job/'+attr(j.id)+'" style="border:0;padding:6px 4px"><div class="l1"><span class="t">'+esc(fmtDate(jobDate(j))||"unscheduled")+' — '+esc(j.title||j.type||"Job")+'</span>'+jobPill(j.status)+'</div>'+
             (j.workPerformed?'<div class="l2"><span>'+esc(j.workPerformed)+'</span></div>':'')+
             (j.partsReplaced&&j.partsReplaced.length?'<div class="l2"><span>Parts: '+esc(j.partsReplaced.join(", "))+'</span></div>':'')+'</button>').join("")
             : '<div class="tiny muted">No jobs at this address yet.</div>')+
          '</div></div>';
      }).join("") : emptyBox("i-home","No property on file","Add the service address so jobs and equipment history have somewhere to live.",'<button class="btn pri" data-act="add-property" data-id="'+attr(id)+'">Add property</button>'))+
    '</div>';
  }
  if(CTAB==="comms"){
    const list=(c.comms||[]).slice().sort((a,b)=>(a.at||"")<(b.at||"")?1:-1);
    return '<div class="card"><div class="chead"><h3>Every call, text and note</h3><button class="btn sm pri" data-act="log-contact" data-id="'+attr(id)+'">Log contact</button></div>'+
      (list.length? '<div class="cbody tight">'+list.map(m=>{
        const ico={call:"i-phone",text:"i-msg",email:"i-mail",note:"i-note",visit:"i-truck"}[m.kind]||"i-note";
        return '<div class="mrow" style="border:0;cursor:default;flex-direction:row;gap:10px;align-items:flex-start">'+
          '<span style="width:28px;height:28px;border-radius:8px;background:var(--surface-3);color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex:0 0 28px"><svg style="width:14px;height:14px" aria-hidden="true"><use href="#'+ico+'"/></svg></span>'+
          '<span class="grow"><span style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b style="font-size:13.5px">'+esc({call:"Phone call",text:"Text message",email:"Email",note:"Note",visit:"Site visit"}[m.kind]||"Note")+'</b>'+
          (m.direction?'<span class="tag">'+esc(m.direction)+'</span>':'')+'<span class="tiny muted">'+esc(fmtStamp(m.at))+'</span></span>'+
          '<span style="display:block;white-space:pre-wrap;margin-top:2px">'+esc(m.summary||"")+'</span></span>'+
          '<button class="btn icon sm ghost" data-act="del-comm" data-id="'+attr(id)+'" data-cid="'+attr(m.id)+'" aria-label="Delete entry"><svg aria-hidden="true"><use href="#i-trash"/></svg></button></div>';
      }).join("")+'</div>' : '<div class="cbody">'+emptyBox("i-msg","Nothing logged yet","After you hang up, log what was said. Future you will thank you.")+'</div>')+'</div>';
  }
  if(CTAB==="files"){
    const jobFiles=[]; listOf("jobs").filter(j=>j.customerId===id).forEach(j=>(j.files||[]).forEach(f=>jobFiles.push({f,j})));
    return '<div class="stack">'+
      '<div class="card"><div class="chead"><h3>Customer files</h3><button class="btn sm" data-act="upload" data-target="customer:'+attr(id)+'"><svg aria-hidden="true"><use href="#i-clip"/></svg>Add files</button></div>'+
      '<div class="cbody">'+fileGrid(c.files||[], "customer:"+id)+'</div></div>'+
      '<div class="card"><div class="chead"><h3>From jobs</h3><span class="tiny muted">'+jobFiles.length+' file'+(jobFiles.length===1?"":"s")+'</span></div>'+
      '<div class="cbody">'+(jobFiles.length? '<div class="filegrid">'+jobFiles.map(x=>fileCell(x.f, null, x.j.number)).join("")+'</div>'
        : '<div class="tiny muted">Before-and-after photos and receipts you attach to jobs show up here too.</div>')+'</div></div>'+
    '</div>';
  }
  return timelineFor(c);
}
function doorCard(j){
  const d=j.door||{}; const bits=[];
  const push=(k,v)=>{ if(v!=null&&v!=="") bits.push('<div class="kv"><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>'); };
  push("Size", [d.width,d.height].filter(Boolean).join(" × ")||d.size);
  push("Manufacturer", d.mfr); push("Model", d.model); push("Color", d.color); push("Material", d.material);
  push("Insulation", d.insulated?("Insulated"+(d.rValue?" · R-"+d.rValue:"")):(d.insulated===false?"Non-insulated":""));
  push("Panel design", d.panelDesign); push("Windows", d.windowDesign);
  push("Track", d.trackType); push("Springs", [d.springType,d.springSize].filter(Boolean).join(" · "));
  push("Opener", [d.openerMfr,d.openerModel].filter(Boolean).join(" "));
  push("Opener serial", d.openerSerial); push("Opener installed", d.openerInstalled?fmtDate(d.openerInstalled):"");
  if(!bits.length) return "";
  return '<div class="card flat" style="background:var(--surface-2);padding:10px 12px;margin-bottom:8px">'+
    '<div class="row" style="margin-bottom:4px"><svg style="width:15px;height:15px;color:var(--brand)" aria-hidden="true"><use href="#i-door"/></svg>'+
    '<b class="tiny">'+esc(j.title||j.type||"Door")+'</b><span class="tiny muted">installed '+esc(fmtDate(jobDate(j))||"—")+'</span>'+
    '<a class="tiny" style="margin-left:auto" href="#/job/'+attr(j.id)+'">job →</a></div>'+
    '<dl style="margin:0;columns:2;column-gap:20px">'+bits.join("")+'</dl>'+
    (j.warranty&&(j.warranty.notes||j.warranty.expires)?'<div class="tiny" style="margin-top:6px;color:var(--good)"><b>Warranty:</b> '+esc(j.warranty.notes||"")+(j.warranty.expires?" · through "+esc(fmtDate(j.warranty.expires)):"")+'</div>':'')+
    '</div>';
}

/* ------------------------------- timeline ------------------------------- */
function timelineFor(c){
  const ev=[];
  const add=(at,html,quiet)=>{ if(at) ev.push({at:dOnly(at)+(String(at).length>10?String(at).slice(10):"T00:00"),html,quiet}); };
  add(c.createdAt, '<b>'+esc(custName(c))+'</b> added as a customer — source: '+esc(sourceName(c.source)));
  listOf("leads").filter(l=>l.convertedCustomerId===c.id||l.customerId===c.id).forEach(l=>{
    add(l.receivedAt, 'Lead received from <b>'+esc(sourceName(l.source))+'</b>'+(l.service?' — '+esc(l.service):''));
    (l.history||[]).forEach(h=> add(h.at, 'Lead moved to <b>'+esc((LEAD_STAGES[h.stage]||{}).l||h.stage)+'</b>', true));
  });
  (c.comms||[]).forEach(m=> add(m.at, esc({call:"Phone call",text:"Text",email:"Email",note:"Note",visit:"Site visit"}[m.kind]||"Note")+(m.summary?' — '+esc(m.summary):""), true));
  listOf("estimates").filter(e=>e.customerId===c.id).forEach(e=>{
    const f=estFinance(e);
    add(e.date, 'Estimate <span class="mono">'+esc(e.number||"")+'</span> created for <b>'+money(f.total)+'</b>');
    add(e.sentAt, 'Estimate <span class="mono">'+esc(e.number||"")+'</span> sent');
    if(e.decidedAt) add(e.decidedAt, 'Estimate <span class="mono">'+esc(e.number||"")+'</span> '+esc(e.status==="approved"?"approved":e.status));
  });
  listOf("jobs").filter(j=>j.customerId===c.id).forEach(j=>{
    const f=jobFinance(j);
    add(j.createdAt, 'Job <span class="mono">'+esc(j.number||"")+'</span> created — '+esc(j.title||j.type||""), true);
    if(j.scheduledDate) add(j.scheduledDate, 'Job <span class="mono">'+esc(j.number||"")+'</span> scheduled'+(j.scheduledTime?" for "+esc(fmtTime(j.scheduledTime)):""));
    if(j.completedAt) add(j.completedAt, 'Job <span class="mono">'+esc(j.number||"")+'</span> completed — <b>'+money(f.subtotal)+'</b>, '+money(f.profit)+' profit');
    if(j.invoice&&j.invoice.sentAt) add(j.invoice.sentAt, 'Invoice <span class="mono">'+esc(j.invoice.number)+'</span> sent for <b>'+money2(f.total)+'</b>');
    (j.payments||[]).forEach(p=> add(p.at, '<b>'+money2(p.amount)+'</b> payment received'+(p.method?" ("+esc(PAY_METHODS[p.method]||p.method)+")":"")));
  });
  listOf("reminders").filter(r=>r.customerId===c.id&&r.done).forEach(r=> add(r.doneAt||r.dueAt, 'Reminder done — '+esc(r.title), true));
  ev.sort((a,b)=> a.at<b.at?1:-1);
  if(!ev.length) return emptyBox("i-clock","Nothing on the timeline yet","");
  return '<div class="card pad"><div class="tline">'+ev.map(e=>
    '<div class="titem'+(e.quiet?" q":"")+'"><div class="td">'+esc(fmtDateFull(e.at))+'</div><div class="tb">'+e.html+'</div></div>').join("")+'</div></div>';
}

/* ------------------------------ file display ---------------------------- */
function fileGrid(files, target){
  if(!files || !files.length) return '<div class="dropzone" data-act="upload" data-target="'+attr(target)+'">Tap to add photos, receipts or documents</div>';
  return '<div class="filegrid">'+files.map(f=>fileCell(f,target)).join("")+'</div>'+
    '<div class="dropzone" style="margin-top:9px" data-act="upload" data-target="'+attr(target)+'">Add more</div>';
}
function fileCell(f, target, badge){
  const isImg = /^image\//.test(f.mime||"") || /\.(png|jpe?g|gif|webp|heic)$/i.test(f.name||"");
  const url = f.url || (f.assetId ? "/_blob/"+f.assetId : "");
  const tagl = f.tag&&f.tag!=="doc" ? '<span class="pill p-neutral" style="position:absolute;top:4px;left:4px;font-size:10px;padding:1px 6px">'+esc(f.tag)+'</span>':'';
  return '<div class="filecell">'+
    (url? '<a class="th" href="'+attr(url)+'" target="_blank" rel="noopener">'+(isImg?'<img src="'+attr(url)+'" alt="'+attr(f.name||"attachment")+'" loading="lazy">':'<svg aria-hidden="true"><use href="#i-doc"/></svg>')+'</a>'
        : '<div class="th"><svg aria-hidden="true"><use href="#i-doc"/></svg></div>')+
    tagl+
    (target?'<button class="rm" data-act="del-file" data-target="'+attr(target)+'" data-fid="'+attr(f.id)+'" aria-label="Remove file"><svg aria-hidden="true"><use href="#i-x"/></svg></button>':'')+
    '<div class="fn" title="'+attr(f.name||"")+'">'+esc(badge?badge+" · ":"")+esc(f.name||"file")+'</div></div>';
}
</script>
<script>
/* ==========================================================================
   Leads — pipeline board, list, conversion
   ========================================================================== */
let LF = {view:"board", q:"", source:"", stage:"", assigned:""};
const ACTIVE_STAGES = ["new","contacted","estimate_scheduled","estimate_sent","waiting","approved","job_scheduled"];

function leadRows(){
  const q=LF.q.trim().toLowerCase(), qd=digits(LF.q);
  let rows=listOf("leads");
  if(q) rows=rows.filter(l=>[l.name,l.email,l.street,l.city,l.zip,l.service,l.notes].join(" ").toLowerCase().indexOf(q)>=0 || (qd&&digits(l.phone).indexOf(qd)>=0));
  if(LF.source) rows=rows.filter(l=>l.source===LF.source);
  if(LF.stage) rows=rows.filter(l=>l.stage===LF.stage);
  if(LF.assigned) rows=rows.filter(l=>l.assignedTo===LF.assigned);
  return rows.sort((a,b)=>(a.receivedAt||"")<(b.receivedAt||"")?1:-1);
}

function viewLeads(){
  const rows = leadRows();
  const active = rows.filter(l=>ACTIVE_STAGES.indexOf(l.stage)>=0);
  const pipeVal = active.reduce((a,l)=>a+num(l.estValue),0);
  const won = rows.filter(l=>l.stage==="won").length, lost = rows.filter(l=>l.stage==="lost").length;
  const convRate = (won+lost)? won/(won+lost)*100 : 0;
  const emps = listOf("employees");

  return '<div class="phead"><div class="ptitle"><h1>Leads</h1>'+
      '<div class="sub">'+active.length+' working · '+money(pipeVal)+' in the pipeline · '+pct(convRate,0)+' of decided leads won</div></div>'+
    '<div class="pacts">'+
      '<div class="seg"><button data-lview="board" aria-pressed="'+(LF.view==="board")+'">Board</button><button data-lview="list" aria-pressed="'+(LF.view==="list")+'">List</button></div>'+
      '<button class="btn" data-act="export-leads"><svg aria-hidden="true"><use href="#i-dl"/></svg>Export</button>'+
      '<button class="btn pri" data-act="new-lead"><svg aria-hidden="true"><use href="#i-plus"/></svg>Add lead</button></div></div>'+

    '<div class="filters">'+
      '<input class="inp" id="lf-q" placeholder="Filter leads…" value="'+attr(LF.q)+'" style="min-width:180px" aria-label="Filter leads">'+
      selInline("lf-source","Any source",sourceList().reduce((o,s)=>(o[s.id]=s.name,o),{}),LF.source)+
      (LF.view==="list"?selInline("lf-stage","Any stage",Object.keys(LEAD_STAGES).reduce((o,k)=>(o[k]=LEAD_STAGES[k].l,o),{}),LF.stage):"")+
      (emps.length?selInline("lf-assigned","Anyone",emps.reduce((o,e)=>(o[e.id]=e.name,o),{}),LF.assigned):"")+
      '<span class="count">'+rows.length+' lead'+(rows.length===1?"":"s")+'</span></div>'+

    (LF.view==="board" ? leadBoard(rows) : leadList(rows));
}

function leadBoard(rows){
  const cols = ACTIVE_STAGES.concat(["won","lost"]);
  return '<div class="pipe">'+cols.map(st=>{
    const items = rows.filter(l=>l.stage===st);
    const val = items.reduce((a,l)=>a+num(l.estValue),0);
    const show = (st==="won"||st==="lost") ? items.slice(0,12) : items;
    return '<div class="pcol" data-stage="'+st+'" title="'+attr(LEAD_STAGES[st].l)+'"><header><span class="pn" style="color:'+LEAD_STAGES[st].c+'">'+esc(LEAD_STAGES[st].s||LEAD_STAGES[st].l)+'</span><span class="pc">'+items.length+'</span></header>'+
      '<div class="pbody">'+(show.length? show.map(leadCard).join("") : '<div class="tiny muted" style="padding:8px 4px;text-align:center">—</div>')+
      (items.length>show.length?'<div class="tiny muted" style="padding:4px;text-align:center">+'+(items.length-show.length)+' more</div>':'')+'</div>'+
      (val?'<div class="pstat">'+money(val)+'</div>':'')+'</div>';
  }).join("")+'</div>'+
  '<div class="tiny muted" style="margin-top:8px">Drag a card to move it along. Dropping into <b>Won</b> offers to turn it into a customer and a job.</div>';
}
function leadCard(l){
  const late = l.nextFollowUp && dOnly(l.nextFollowUp)<=todayISO();
  return '<div class="lcard" draggable="true" data-lead="'+attr(l.id)+'">'+
    '<div class="ln">'+esc(l.name||"Unnamed lead")+'</div>'+
    '<div class="lm">'+(l.city?'<span>'+esc(l.city)+'</span>':'')+'<span>'+esc(sourceName(l.source))+'</span></div>'+

    '<div class="lm" style="justify-content:space-between">'+(l.estValue?'<span class="lv">'+money(l.estValue)+'</span>':'<span></span>')+

        const cid=b.dataset.useExisting; closeModal();

      root.querySelector("#conv-ok").addEventListener("click", async ()=>{
        const d = readForm(root);

          id:uid("c"), firstName:d.firstName, lastName:d.lastName, phone:d.phone, email:d.email,
          type:d.type, status:"active", source:d.source, createdAt:nowISO(), preferredContact:"phone",
          properties:[{id:pid,label:"Service address",street:d.street,city:d.city,state:d.state,zip:d.zip}],

        }

function guessJobType(s){
  const t=String(s||"").toLowerCase();
  if(/spring/.test(t)) return "Spring Repair";
  if(/opener|motor|remote/.test(t)) return /install|new/.test(t)?"Opener Install":"Opener Repair";
  if(/cable|track|roller/.test(t)) return "Cable / Track Repair";
  if(/panel|dent/.test(t)) return "Panel Replacement";
  if(/tune|service|maint/.test(t)) return "Tune-Up / Maintenance";
  if(/replace/.test(t)) return "Door Replacement";
  if(/new door|install/.test(t)) return "New Door Install";
  if(/commercial|roll/.test(t)) return "Commercial Door";
  return "Other";
}

/* ------------------------ duplicate customer check ---------------------- */
function findDuplicates(x, excludeId){
  const ph=digits(x.phone), em=String(x.email||"").trim().toLowerCase();
  const st=String(x.street||"").trim().toLowerCase().replace(/\s+/g," ");
  const out=[];
  listOf("customers").forEach(c=>{
    if(excludeId && c.id===excludeId) return;
    const why=[];
    if(ph && ph.length>=7 && (digits(c.phone)===ph || digits(c.phone2)===ph)) why.push("same phone number");
    if(em && String(c.email||"").trim().toLowerCase()===em) why.push("same email");
    if(st){
      const addrs=(c.properties||[]).map(p=>String(p.street||"").trim().toLowerCase().replace(/\s+/g," "))
        .concat([String((c.billing||{}).street||"").trim().toLowerCase().replace(/\s+/g," ")]);
      if(addrs.indexOf(st)>=0) why.push("same street address");
    }
    if(why.length) out.push({c, why: why.join(" · ")});
  });
  return out;
}

function nextNum(prefix, coll, nested){
  let max = 1000;

    const v = nested ? (x[nested]&&x[nested].number) : x.number;
    const m = /(\d+)\s*$/.exec(String(v||"")); if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix+"-"+(max+1);
}
function newJobObject(o){
  const st = settings();
  return Object.assign({
    id: uid("j"), number: nextNum("J","jobs"), customerId:null, propertyId:null,
    title:"", type:"Other", description:"", status:"new",
    scheduledDate:"", scheduledTime:"", durationMin:120, assignedTo:"",
    price:0, discount:0, taxRate:num(st.taxRate), taxExempt:false,

let JF = {q:"",status:"",type:"",emp:"",city:"",source:"",pay:"",sort:"date",flag:""};
function jobRows(){
  const q=JF.q.trim().toLowerCase(), qd=digits(JF.q);
  let rows=listOf("jobs");
  if(q) rows=rows.filter(j=>{
    const c=cust(j.customerId), a=jobAddr(j);
    return [j.number,j.title,j.type,j.description,j.internalNotes,custLabel(j.customerId),a&&a.street,a&&a.city,a&&a.zip,(j.invoice||{}).number].join(" ").toLowerCase().indexOf(q)>=0
      || (qd && c && digits(c.phone).indexOf(qd)>=0);
  });
  if(JF.status) rows=rows.filter(j=>j.status===JF.status);
  if(JF.type) rows=rows.filter(j=>j.type===JF.type);
  if(JF.emp) rows=rows.filter(j=>j.assignedTo===JF.emp);
  if(JF.city) rows=rows.filter(j=>{const a=jobAddr(j); return a && String(a.city||"").toLowerCase()===JF.city.toLowerCase();});
  if(JF.source) rows=rows.filter(j=>jobSourceId(j)===JF.source);
  if(JF.pay==="unpaid") rows=rows.filter(j=>{const s=invStatus(j); return s==="sent"||s==="partial"||s==="overdue";});
  if(JF.pay==="overdue") rows=rows.filter(j=>invStatus(j)==="overdue");
  if(JF.pay==="paid") rows=rows.filter(j=>invStatus(j)==="paid");
  if(JF.flag==="unscheduled") rows=rows.filter(j=>OPEN_STATUSES.indexOf(j.status)>=0 && !j.scheduledDate);
  if(JF.flag==="late") rows=rows.filter(j=>OPEN_STATUSES.indexOf(j.status)>=0 && j.scheduledDate && j.scheduledDate<todayISO());
  if(JF.flag==="open") rows=rows.filter(j=>OPEN_STATUSES.indexOf(j.status)>=0);
  if(JF.flag==="done") rows=rows.filter(isRecognised);
  const cmp={
    date:(a,b)=>(jobDate(b)||"")>(jobDate(a)||"")?1:-1,
    upcoming:(a,b)=>((a.scheduledDate||"9999")+(a.scheduledTime||""))<((b.scheduledDate||"9999")+(b.scheduledTime||""))?-1:1,
    revenue:(a,b)=>jobFinance(b).subtotal-jobFinance(a).subtotal,
    profit:(a,b)=>jobFinance(b).profit-jobFinance(a).profit,
    margin:(a,b)=>jobFinance(b).margin-jobFinance(a).margin,
    customer:(a,b)=>custLabel(a.customerId).localeCompare(custLabel(b.customerId))
  };
  return rows.sort(cmp[JF.sort]||cmp.date);
}

        '<td>'+invPill(j)+(f.balance>0.005&&j.invoice&&j.invoice.number?'<div class="sec neg">'+money(f.balance)+' due</div>':'')+'</td></tr>'; }).join("")+
      '</tbody></table></div></div>'+
      '<div class="mlist">'+rows.map(j=>{ const f=jobFinance(j), a=jobAddr(j);
        return '<button class="mrow" data-go="job/'+attr(j.id)+'"><div class="l1"><span class="t">'+esc(custLabel(j.customerId))+'</span>'+jobPill(j.status)+'</div>'+
        '<div class="l2"><span class="mono">'+esc(j.number||"")+'</span><span>'+esc(j.title||j.type||"")+'</span>'+(a&&a.city?'<span>'+esc(a.city)+'</span>':'')+'</div>'+
        '<div class="l2"><span>'+esc(j.scheduledDate?relDay(j.scheduledDate)+(j.scheduledTime?" · "+fmtTime(j.scheduledTime):""):"no date")+'</span></div>'+
        '<div class="l3"><span>'+money(f.subtotal)+'</span><span class="muted">·</span><span class="'+(f.profit>=0?"pos":"neg")+'">'+money(f.profit)+'</span>'+(f.subtotal?'<span class="muted">·</span><span>'+pct(f.margin,0)+'</span>':'')+(f.balance>0.005&&j.invoice?'<span class="pill p-bad">'+money(f.balance)+' due</span>':'')+'</div></button>'; }).join("")+'</div>'
      : emptyBox("i-wrench","No jobs match","",'<button class="btn pri" data-act="new-job">Create a job</button>'));

/* ------------------------------- job page ------------------------------- */
function viewJob(id){
  const j = S.jobs[id];
  if(!j) return emptyBox("i-wrench","Job not found","",'<a class="btn" href="#/jobs">Back to jobs</a>');
  const f = jobFinance(j), c = cust(j.customerId), a = jobAddr(j);
  const emps = listOf("employees");
  const est = j.estimateId ? S.estimates[j.estimateId] : null;

  return '<div class="phead"><div class="ptitle">'+
      '<a class="tiny" href="#/jobs">← Jobs</a>'+
      '<h1>'+esc(j.title||j.type||"Job")+'</h1>'+
      '<div class="row" style="margin-top:5px;gap:6px"><span class="mono tiny">'+esc(j.number||"")+'</span>'+jobPill(j.status)+
      ((INV_STATUS[iv]||{}).l === (JOB_STATUS[j.status]||{}).l || iv==="none" ? "" : invPill(j))+
      (c?'<a href="#/customer/'+attr(c.id)+'" class="tag"><svg style="width:12px;height:12px" aria-hidden="true"><use href="#i-users"/></svg>'+esc(custName(c))+'</a>':'')+
      '</div></div>'+
    '<div class="pacts">'+
      (c&&c.phone?'<a class="btn" href="tel:'+attr(digits(c.phone))+'"><svg aria-hidden="true"><use href="#i-phone"/></svg>Call</a>':'')+
      (a&&a.street?'<a class="btn" target="_blank" rel="noopener" href="'+attr(mapsUrl(a))+'"><svg aria-hidden="true"><use href="#i-pin"/></svg>Navigate</a>':'')+
      '<button class="btn" data-act="edit-job" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-edit"/></svg>Edit</button>'+
      (DONE_STATUSES.indexOf(j.status)<0 ? '<button class="btn pri" data-act="complete-job" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-check"/></svg>Mark complete</button>' :
        (!j.invoice||!j.invoice.number ? '<button class="btn pri" data-act="make-invoice" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-inv"/></svg>Create invoice</button>' :
         (f.balance>0.005 ? '<button class="btn pri" data-act="record-payment" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-cash"/></svg>Record payment</button>' :
          '<button class="btn" data-act="print-invoice" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-print"/></svg>Invoice</button>')))+
    '</div></div>'+

    /* money strip — the whole point */
    '<div class="pstrip" style="margin-bottom:14px">'+
      '<div><span class="pl">Customer price</span><span class="pv">'+money(f.subtotal)+'</span><span class="tiny muted">'+(f.disc?money(f.price)+" less "+money(f.disc)+" discount":"before tax")+'</span></div>'+
      '<div><span class="pl">Job cost</span><span class="pv">'+money(f.costTotal)+'</span><span class="tiny muted">'+money(f.material)+' mat · '+money(f.labor)+' labor · '+money(f.other)+' other</span></div>'+
      '<div><span class="pl">Gross profit</span><span class="pv '+(f.profit>=0?"pos":"neg")+'">'+money(f.profit)+'</span><span class="tiny muted">'+(f.subtotal?"you keep "+pct(f.profit/f.subtotal*100,0)+" of it":"no revenue yet")+'</span></div>'+
      '<div><span class="pl">Margin</span><span class="pv">'+(f.subtotal?pct(f.margin,1):"—")+'</span>'+
        '<div class="marbar"><i style="width:'+Math.max(0,Math.min(100,f.margin)).toFixed(1)+'%;background:'+(f.margin>=40?"var(--good)":f.margin>=25?"var(--s1)":f.margin>=12?"var(--warn)":"var(--bad)")+'"></i></div></div>'+
      '<div><span class="pl">'+(f.balance>0.005?"Balance due":"Paid")+'</span><span class="pv '+(f.balance>0.005?"neg":"pos")+'">'+money2(f.balance>0.005?f.balance:f.paid)+'</span><span class="tiny muted">'+money2(f.paid)+' of '+money2(f.total)+' collected</span></div>'+
    '</div>'+

    (j.status==="waiting_parts"?'<div class="banner warn"><svg aria-hidden="true"><use href="#i-alert"/></svg><div><b>Waiting on parts.</b> '+esc(j.partsNote||"Set a reminder so this does not get forgotten.")+' <button class="btn sm" data-act="add-reminder" data-job="'+attr(id)+'">Add reminder</button></div></div>':'')+
    (iv==="overdue"?'<div class="banner bad"><svg aria-hidden="true"><use href="#i-alert"/></svg><div><b>Invoice '+esc(j.invoice.number)+' is overdue</b> — '+money2(f.balance)+' was due '+esc(fmtDate(j.invoice.dueDate))+'. <button class="btn sm" data-act="record-payment" data-id="'+attr(id)+'">Record payment</button></div></div>':'')+

    '<div class="grid2" style="margin-bottom:14px;grid-template-columns:minmax(0,1fr) minmax(0,.85fr)">'+
      '<div class="card pad"><div class="eyebrow" style="margin-bottom:8px">The job</div><dl style="margin:0">'+
        kvRow("Customer", c?'<a href="#/customer/'+attr(c.id)+'">'+esc(custName(c))+'</a> · <span class="mono">'+esc(phoneFmt(c.phone))+'</span>':"—")+
        kvRow("Service address", a?esc(addrOneLine(a))+' <a class="tiny" target="_blank" rel="noopener" href="'+attr(mapsUrl(a))+'">map ↗</a>':"—")+
        kvRow("Job type", esc(j.type||"—"))+
        kvRow("Scheduled", j.scheduledDate? '<b>'+esc(fmtDateFull(j.scheduledDate))+'</b>'+(j.scheduledTime?' at '+esc(fmtTime(j.scheduledTime)):'')+(j.durationMin?' <span class="muted tiny">· about '+esc(durLabel(j.durationMin))+'</span>':'') : '<span class="muted">not scheduled</span> <button class="btn sm" data-act="edit-job" data-id="'+attr(id)+'">set a date</button>')+
        (j.completedAt?kvRow("Completed", esc(fmtDateFull(j.completedAt))):"")+
        (emps.length?kvRow("Assigned to", esc((emps.find(e=>e.id===j.assignedTo)||{}).name||"—")):"")+
        kvRow("How acquired", esc(sourceName(jobSourceId(j))))+
        (est?kvRow("From estimate", '<a href="#/estimate/'+attr(est.id)+'" class="mono">'+esc(est.number)+'</a>'):"")+
        (j.description?kvRow("Description", '<span style="white-space:pre-wrap">'+esc(j.description)+'</span>'):"")+
      '</dl></div>'+
      '<div class="card pad"><div class="eyebrow" style="margin-bottom:8px">What the customer pays</div>'+
        '<div class="totbox" style="width:100%;margin:0">'+
          '<div class="tl"><span class="lab">Price</span><span>'+money2(f.price)+'</span></div>'+
          (f.disc?'<div class="tl"><span class="lab">Discount</span><span class="neg">−'+money2(f.disc)+'</span></div>':'')+
          '<div class="tl"><span class="lab">Subtotal '+(f.disc?"":"")+'</span><span>'+money2(f.subtotal)+'</span></div>'+
          '<div class="tl"><span class="lab">Sales tax '+(j.taxExempt?"(exempt)":"("+num(f.taxRate).toFixed(2)+"%)")+'</span><span>'+money2(f.tax)+'</span></div>'+
          '<div class="tl big"><span>Total</span><span>'+money2(f.total)+'</span></div>'+
          '<div class="tl"><span class="lab">Paid</span><span class="pos">'+money2(f.paid)+'</span></div>'+
          '<div class="tl"><span class="lab">Balance</span><span class="'+(f.balance>0.005?"neg":"")+'"><b>'+money2(f.balance)+'</b></span></div>'+
        '</div>'+
        '<div class="hr"></div>'+
        (j.invoice&&j.invoice.number?
          '<div class="row"><span class="mono tiny">'+esc(j.invoice.number)+'</span>'+invPill(j)+
          '<span class="tiny muted">'+esc(fmtDate(j.invoice.date))+(j.invoice.dueDate?' · due '+esc(fmtDate(j.invoice.dueDate)):'')+'</span></div>'+
          '<div class="row" style="margin-top:8px"><button class="btn sm" data-act="print-invoice" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-print"/></svg>View / print</button>'+
          (f.balance>0.005?'<button class="btn sm pri" data-act="record-payment" data-id="'+attr(id)+'">Record payment</button>':'')+
          '<button class="btn sm ghost" data-act="edit-invoice" data-id="'+attr(id)+'">Invoice settings</button></div>'
          :'<button class="btn sm block" data-act="make-invoice" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-inv"/></svg>Create an invoice for this job</button>')+
        ((j.payments||[]).length?'<div class="hr"></div><div class="eyebrow" style="margin-bottom:5px">Payments</div>'+
          (j.payments||[]).map(p=>'<div class="row" style="justify-content:space-between;font-size:13px;padding:2px 0"><span>'+esc(fmtDate(p.at))+' · '+esc(PAY_METHODS[p.method]||p.method||"")+(p.note?' · '+esc(p.note):'')+'</span>'+
            '<span class="row" style="gap:4px"><b class="num">'+money2(p.amount)+'</b><button class="btn icon sm ghost" data-act="del-payment" data-id="'+attr(id)+'" data-pid="'+attr(p.id)+'" aria-label="Remove payment"><svg aria-hidden="true"><use href="#i-x"/></svg></button></span></div>').join("")
          :'')+
      '</div>'+
    '</div>'+

    /* cost breakdown */
    '<div class="card" style="margin-bottom:14px"><div class="chead"><h3>What this job cost me</h3>'+
      '<span class="tiny muted">'+(j.costs||[]).length+' line'+((j.costs||[]).length===1?"":"s")+'</span>'+
      '<button class="btn sm" data-act="add-cost" data-id="'+attr(id)+'" data-preset="labor">+ Labor</button>'+
      '<button class="btn sm pri" data-act="add-cost" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-plus"/></svg>Add cost</button></div>'+
      '<div class="cbody">'+costTable(j,f)+'</div></div>'+

    /* door specs + work performed */
    '<div class="grid2" style="margin-bottom:14px">'+
      '<div class="card"><div class="chead"><h3>Door &amp; opener</h3><button class="btn sm" data-act="edit-door" data-id="'+attr(id)+'">'+(Object.keys(j.door||{}).some(k=>j.door[k])?"Edit":"Add details")+'</button></div>'+
        '<div class="cbody">'+(Object.keys(j.door||{}).some(k=>j.door[k]!=null&&j.door[k]!=="")? doorSpecList(j.door)
          : '<div class="tiny muted">Record the door, springs, track and opener here and it becomes part of this address’s permanent service history — so the next time you get a call you already know what is on the wall.</div>')+'</div></div>'+
      '<div class="card"><div class="chead"><h3>Work performed</h3><button class="btn sm" data-act="edit-work" data-id="'+attr(id)+'">Edit</button></div>'+
        '<div class="cbody">'+
          (j.workPerformed?'<div style="white-space:pre-wrap;margin-bottom:8px">'+esc(j.workPerformed)+'</div>':'<div class="tiny muted" style="margin-bottom:8px">Nothing recorded yet.</div>')+
          ((j.partsReplaced||[]).length?'<div class="eyebrow" style="margin-bottom:4px">Parts replaced</div><div class="row" style="margin-bottom:8px">'+(j.partsReplaced||[]).map(p=>'<span class="tag">'+esc(p)+'</span>').join("")+'</div>':'')+
          (j.warranty&&(j.warranty.notes||j.warranty.expires)?'<div class="card flat" style="background:var(--good-soft);border:1px solid var(--good-line);padding:8px 10px"><div class="row" style="gap:6px;align-items:flex-start"><svg style="width:15px;height:15px;color:var(--good);flex:0 0 15px;margin-top:2px" aria-hidden="true"><use href="#i-shield"/></svg><div class="tiny" style="color:var(--good)"><b>Warranty</b> — '+esc(j.warranty.notes||"")+(j.warranty.expires?'<br>Through '+esc(fmtDateFull(j.warranty.expires)):'')+'</div></div></div>':'')+
        '</div></div>'+
    '</div>'+

    /* photos + notes */
    '<div class="grid2">'+
      '<div class="card"><div class="chead"><h3>Photos &amp; documents</h3>'+
        '<button class="btn sm" data-act="upload" data-target="job:'+attr(id)+':before">Before</button>'+
        '<button class="btn sm" data-act="upload" data-target="job:'+attr(id)+':after">After</button>'+
        '<button class="btn sm ghost" data-act="upload" data-target="job:'+attr(id)+':doc">Other</button></div>'+
        '<div class="cbody">'+fileGrid(j.files||[], "job:"+id)+'</div></div>'+
      '<div class="card"><div class="chead"><h3>Notes</h3><button class="btn sm" data-act="edit-notes" data-id="'+attr(id)+'">Edit</button></div>'+
        '<div class="cbody"><div class="eyebrow" style="margin-bottom:3px">Internal — only you see this</div>'+
        '<div style="white-space:pre-wrap;margin-bottom:10px">'+(j.internalNotes?esc(j.internalNotes):'<span class="tiny muted">—</span>')+'</div>'+
        '<div class="eyebrow" style="margin-bottom:3px">Shows on the invoice</div>'+
        '<div style="white-space:pre-wrap">'+(j.customerNotes?esc(j.customerNotes):'<span class="tiny muted">—</span>')+'</div></div></div>'+
    '</div>'+
    '<div class="row" style="margin-top:14px;justify-content:flex-end">'+
      '<button class="btn sm ghost" data-act="dup-job" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-copy"/></svg>Duplicate</button>'+
      '<button class="btn sm danger" data-act="del-job" data-id="'+attr(id)+'"><svg aria-hidden="true"><use href="#i-trash"/></svg>Delete job</button></div>';
}
function durLabel(m){ m=num(m); if(!m) return ""; const h=Math.floor(m/60), r=m%60; return (h?h+"h":"")+(r?(h?" ":"")+r+"m":""); }

function costTable(j,f){
  const costs = j.costs||[];
  const vendors = Array.from(new Set(listOf("jobs").flatMap(x=>(x.costs||[]).map(c=>c.vendor)).filter(Boolean))).sort();
  const head = '<div class="li head" style="margin-bottom:5px"><span>Description</span><span>Qty</span><span>Unit cost</span><span style="text-align:right">Total</span><span></span></div>';
  const body = costs.map(c=>{
    const tot = c.total!=null?num(c.total):r2(num(c.qty)*num(c.unit));
    return '<div class="stack" style="gap:3px;padding:5px 0;border-bottom:1px solid var(--line-soft)" data-costrow="'+attr(c.id)+'">'+
      '<div class="li">'+
        '<input class="inp" value="'+attr(c.desc||"")+'" data-cid="'+attr(c.id)+'" data-cf="desc" placeholder="What was it?" aria-label="Description">'+
        '<input class="inp" value="'+attr(c.qty==null?1:c.qty)+'" data-cid="'+attr(c.id)+'" data-cf="qty" inputmode="decimal" aria-label="Quantity">'+
        '<input class="inp" value="'+attr(c.unit==null?"":c.unit)+'" data-cid="'+attr(c.id)+'" data-cf="unit" inputmode="decimal" aria-label="Unit cost">'+
        '<span class="tot">'+money2(tot)+'</span>'+
        '<button class="btn icon sm ghost" data-act="del-cost" data-id="'+attr(j.id)+'" data-cid="'+attr(c.id)+'" aria-label="Remove cost line"><svg aria-hidden="true"><use href="#i-x"/></svg></button>'+
      '</div>'+
      '<div class="row" style="gap:6px">'+
        '<select class="sel" data-cid="'+attr(c.id)+'" data-cf="cat" style="min-height:30px;padding:3px 24px 3px 8px;font-size:12.5px;width:auto" aria-label="Category">'+
          Object.keys(COST_CATS).map(k=>'<option value="'+k+'"'+(c.cat===k?" selected":"")+'>'+esc(COST_CATS[k])+'</option>').join("")+'</select>'+
        '<input class="inp" list="vendorlist" value="'+attr(c.vendor||"")+'" data-cid="'+attr(c.id)+'" data-cf="vendor" placeholder="Vendor / supplier" style="min-height:30px;padding:3px 8px;font-size:12.5px;width:auto;flex:1 1 130px" aria-label="Vendor">'+
        (c.receipt? '<a class="btn sm ghost" href="'+attr(c.receipt.url||("/_blob/"+c.receipt.assetId))+'" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-clip"/></svg>Receipt</a>'
                  : '<button class="btn sm ghost" data-act="upload" data-target="cost:'+attr(j.id)+':'+attr(c.id)+'"><svg aria-hidden="true"><use href="#i-cam"/></svg>Receipt</button>')+
      '</div></div>';
  }).join("");
  const summary = '<div class="row" style="margin-top:10px;gap:16px;justify-content:flex-end;flex-wrap:wrap">'+
    '<span class="tiny muted">Materials <b class="num" style="color:var(--ink)">'+money2(f.material)+'</b></span>'+
    '<span class="tiny muted">Labor <b class="num" style="color:var(--ink)">'+money2(f.labor)+'</b></span>'+
    '<span class="tiny muted">Other <b class="num" style="color:var(--ink)">'+money2(f.other)+'</b></span>'+
    '<span style="font-family:var(--cond);font-size:19px;font-weight:600" class="num">Total cost '+money2(f.costTotal)+'</span></div>'+
    '<div class="totbox" style="margin-top:8px">'+
      '<div class="tl"><span class="lab">Revenue (excl. tax)</span><span>'+money2(f.subtotal)+'</span></div>'+
      '<div class="tl"><span class="lab">Less job costs</span><span class="neg">−'+money2(f.costTotal)+'</span></div>'+
      '<div class="tl big"><span>Gross profit</span><span class="'+(f.profit>=0?"pos":"neg")+'">'+money2(f.profit)+'</span></div>'+
      '<div class="tl"><span class="lab">Margin</span><span>'+(f.subtotal?pct(f.margin,1):"—")+'</span></div>'+
    '</div>';
  return '<datalist id="vendorlist">'+vendors.map(v=>'<option value="'+attr(v)+'"></option>').join("")+'</datalist>'+
    (costs.length? head+body+summary
      : '<div class="tiny muted" style="margin-bottom:10px">No costs entered yet, so this job looks like pure profit — it is not. Add the door, springs, your labor, fuel and anything else you paid for.</div>'+
        '<div class="row">'+["door","springs","opener","labor","fuel"].map(k=>'<button class="btn sm" data-act="add-cost" data-id="'+attr(j.id)+'" data-preset="'+k+'">+ '+esc(COST_CATS[k])+'</button>').join("")+'</div>');
}
function doorSpecList(d){
  const rows=[["Width",d.width],["Height",d.height],["Manufacturer",d.mfr],["Model",d.model],["Color",d.color],["Material",d.material],
    ["Insulated",d.insulated===true?"Yes":d.insulated===false?"No":""],["R-value",d.rValue],["Panel design",d.panelDesign],["Windows",d.windowDesign],
    ["Track type",d.trackType],["Spring type",d.springType],["Spring size",d.springSize],
    ["Opener make",d.openerMfr],["Opener model",d.openerModel],["Opener serial",d.openerSerial?'<span class="mono">'+esc(d.openerSerial)+'</span>':""],
    ["Opener installed",d.openerInstalled?fmtDate(d.openerInstalled):""]];
  const shown=rows.filter(r=>r[1]!=null&&r[1]!=="");
  if(!shown.length) return '<div class="tiny muted">Nothing recorded.</div>';
  return '<dl style="margin:0;columns:2;column-gap:22px">'+shown.map(r=>'<div class="kv" style="break-inside:avoid"><dt>'+esc(r[0])+'</dt><dd>'+(String(r[1]).indexOf("<")===0?r[1]:esc(r[1]))+'</dd></div>').join("")+'</dl>';
}

/* ------------------------------ job editor ------------------------------ */

    (lockCustomer&&props.length>1? fSel("propertyId","Which property", j.propertyId||"", props.map(p=>({v:p.id,l:(p.label?p.label+" · ":"")+addrOneLine(p)}))) : "")+

function editJob(id, preset){
  const j = id? S.jobs[id] : newJobObject(preset||{});
  if(!j){ toast("Job not found","err"); return; }
  const lock = !id && preset && preset.customerId;
  openModal({title: id?"Edit job "+(j.number||""):"New job", size:"wide", body: jobForm(j, lock),
    foot:'<button class="btn" data-mclose>Cancel</button><button class="btn pri" id="job-save">'+(id?"Save job":"Create job")+'</button>',
    onMount(root){
      const csel = root.querySelector('[name=customerId]');
      if(csel) csel.addEventListener("change",()=>{
        const c=cust(csel.value); const cur=readForm(root);
        closeModal(); const nj = Object.assign({}, j, cur, {customerId:csel.value, propertyId:(c&&c.properties&&c.properties[0])?c.properties[0].id:null});
        openModalJobAgain(id, nj, lock);
      });
      root.querySelector("#job-save").addEventListener("click", async ()=>{
        const d = readForm(root);
        if(!d.customerId){ toast("Pick a customer first","err"); return; }
        const n = Object.assign({}, j, d);
        n.price=num(d.price); n.discount=num(d.discount); n.taxRate=num(d.taxRate); n.durationMin=num(d.durationMin);
        if(!n.propertyId){ const c=cust(n.customerId); if(c&&c.properties&&c.properties[0]) n.propertyId=c.properties[0].id; }
        if(DONE_STATUSES.indexOf(n.status)>=0 && !n.completedAt) n.completedAt = todayISO();
        if(DONE_STATUSES.indexOf(n.status)<0) n.completedAt = "";
        closeModal(); await put("jobs", n);
        toast(id?"Job saved":"Job created");
        if(!id) go("job/"+n.id);
      });
    }});
}
function openModalJobAgain(id, j, lock){
  openModal({title: id?"Edit job "+(j.number||""):"New job", size:"wide", body: jobForm(j, lock),
    foot:'<button class="btn" data-mclose>Cancel</button><button class="btn pri" id="job-save">'+(id?"Save job":"Create job")+'</button>',
    onMount(root){
      const csel=root.querySelector('[name=customerId]');
      if(csel) csel.addEventListener("change",()=>{ const c=cust(csel.value); const cur=readForm(root); closeModal();
        openModalJobAgain(id, Object.assign({},j,cur,{customerId:csel.value,propertyId:(c&&c.properties&&c.properties[0])?c.properties[0].id:null}), lock); });
      root.querySelector("#job-save").addEventListener("click", async ()=>{
        const d=readForm(root); if(!d.customerId){ toast("Pick a customer first","err"); return; }
        const n=Object.assign({},j,d);
        n.price=num(d.price); n.discount=num(d.discount); n.taxRate=num(d.taxRate); n.durationMin=num(d.durationMin);
        if(!n.propertyId){ const c=cust(n.customerId); if(c&&c.properties&&c.properties[0]) n.propertyId=c.properties[0].id; }
        if(DONE_STATUSES.indexOf(n.status)>=0 && !n.completedAt) n.completedAt=todayISO();
        closeModal(); await put("jobs", n); toast(id?"Job saved":"Job created"); if(!id) go("job/"+n.id);
      });
    }});
}

<script>

function estFinance(e, optId){
  const opts = (e&&e.options)||[];
  const o = opts.find(x=>x.id===(optId||e.selectedOptionId)) || opts.find(x=>x.recommended) || opts[0];
  if(!o) return {opt:null,gross:0,disc:0,sub:0,rate:0,tax:0,total:0,items:[]};
  const items = o.items||[];
  const gross = items.reduce((a,i)=>a+num(i.qty)*num(i.price),0);
  const disc = num(o.discount);
  const sub = r2(Math.max(0,gross-disc));
  const rate = o.taxRate==null? num(settings().taxRate) : num(o.taxRate);
  const tax = r2(o.taxExempt?0:sub*rate/100);
  return {opt:o, gross:r2(gross), disc:r2(disc), sub, rate, tax, total:r2(sub+tax), items};
}
function newEstimate(o){
  const st=settings();
  return Object.assign({
    id:uid("e"), number:nextNum("EST","estimates"), customerId:null, propertyId:null,
    title:"", date:todayISO(), expiresAt:addDays(todayISO(), num(st.estimateValidDays)||30),
    status:"draft", selectedOptionId:null,
    options:[{id:uid("o"), name:"Standard", recommended:true, items:[{id:uid("i"),desc:"",qty:1,price:0}], discount:0, taxRate:num(st.taxRate), taxExempt:false, notes:""}],
    notes:"", terms:st.estimateNote||"", createdAt:nowISO()

}

    '</tbody></table></div>'+

    (j.customerNotes?'<div style="margin-top:16px"><b>Notes</b><div style="white-space:pre-wrap;color:#46565A">'+esc(j.customerNotes)+'</div></div>':'')+

    '<div style="margin-top:26px;display:flex;gap:30px;flex-wrap:wrap"><div style="flex:1 1 200px"><div style="border-bottom:1px solid #101A1C;height:30px"></div><div class="tiny" style="color:#78888C">Customer signature</div></div>'+
    '<div style="flex:0 0 130px"><div style="border-bottom:1px solid #101A1C;height:30px"></div><div class="tiny" style="color:#78888C">Date</div></div></div>',
    e.number);
