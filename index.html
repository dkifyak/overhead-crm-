<title>Overhead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================== TOKENS ============================== */
:root{
  color-scheme: light;
  --ground:#F1F4F4; --surface:#FFFFFF; --surface-2:#F7FAFA; --surface-3:#ECF1F2;
  --rail:#08333C; --rail-2:#0D4956; --rail-ink:#CBE1E5; --rail-ink-dim:#7FA5AD;
  --brand:#0F6E7E; --brand-strong:#0A5462; --brand-soft:#E0EFF1; --on-brand:#FFFFFF;
  --ink:#101A1C; --ink-2:#46565A; --ink-3:#78888C;
  --line:#DAE3E4; --line-soft:#EBF0F0;
  --good:#0F7A45; --good-soft:#E3F3EA; --good-line:#B6DFC7;
  --warn:#8F5B05; --warn-soft:#FAEFDA; --warn-line:#E8D0A0;
  --bad:#A6231C;  --bad-soft:#FAE6E4;  --bad-line:#EFC0BC;
  --info:#1B5A9E; --info-soft:#E4EEF8; --info-line:#BBD3EC;
  --shadow-sm:0 1px 2px rgba(8,51,60,.06), 0 1px 1px rgba(8,51,60,.04);
  --shadow-md:0 4px 14px rgba(8,51,60,.10), 0 1px 3px rgba(8,51,60,.06);
  --shadow-lg:0 18px 48px rgba(8,51,60,.22), 0 3px 10px rgba(8,51,60,.12);
  /* chart roles — validated set (light) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:#E4EAEA; --axis:#C6D2D3;
  --sans:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --cond:'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --rail-w:212px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0A1113; --surface:#151E21; --surface-2:#1B2529; --surface-3:#223035;
    --rail:#081114; --rail-2:#12303A; --rail-ink:#BCD2D6; --rail-ink-dim:#6D8C93;
    --brand:#48B4C4; --brand-strong:#68C9D7; --brand-soft:#10333A; --on-brand:#04222A;
    --ink:#E6EDEF; --ink-2:#A1B3B7; --ink-3:#788C90;
    --line:#26343A; --line-soft:#1D282C;
    --good:#3EC07A; --good-soft:#0E2B1D; --good-line:#1E4C34;
    --warn:#E2A63F; --warn-soft:#2C2412; --warn-line:#54401A;
    --bad:#F0716A;  --bad-soft:#2E1715;  --bad-line:#572723;
    --info:#63A8E8; --info-soft:#132434; --info-line:#254462;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 4px 14px rgba(0,0,0,.45);
    --shadow-lg:0 18px 48px rgba(0,0,0,.6);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --grid:#222F34; --axis:#314248;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0A1113; --surface:#151E21; --surface-2:#1B2529; --surface-3:#223035;
  --rail:#081114; --rail-2:#12303A; --rail-ink:#BCD2D6; --rail-ink-dim:#6D8C93;
  --brand:#48B4C4; --brand-strong:#68C9D7; --brand-soft:#10333A; --on-brand:#04222A;
  --ink:#E6EDEF; --ink-2:#A1B3B7; --ink-3:#788C90;
  --line:#26343A; --line-soft:#1D282C;
  --good:#3EC07A; --good-soft:#0E2B1D; --good-line:#1E4C34;
  --warn:#E2A63F; --warn-soft:#2C2412; --warn-line:#54401A;
  --bad:#F0716A;  --bad-soft:#2E1715;  --bad-line:#572723;
  --info:#63A8E8; --info-soft:#132434; --info-line:#254462;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 18px 48px rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#222F34; --axis:#314248;
}

/* ============================== BASE ============================== */
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--cond);font-weight:600;letter-spacing:.005em;text-wrap:balance;line-height:1.12}
h1{font-size:29px} h2{font-size:22px} h3{font-size:18px} h4{font-size:15px}
p{margin:0 0 10px}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
img{max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--ground)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.88em;letter-spacing:-.01em}
.eyebrow{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.tiny{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.nowrap{white-space:nowrap}
.grow{flex:1 1 auto;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================== LAYOUT ============================== */
#app{display:flex;min-height:100vh}
#rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brandmark{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
.brandmark .glyph{width:28px;height:28px;flex:0 0 28px}
.brandmark .bt{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.02em;color:#fff;line-height:1}
.brandmark .bs{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-ink-dim);margin-top:2px}
.navlist{flex:1 1 auto;overflow-y:auto;padding:4px 8px 12px;display:flex;flex-direction:column;gap:1px}
.navsec{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-ink-dim);padding:14px 8px 5px;font-weight:600}
.navitem{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;color:var(--rail-ink);background:none;border:0;width:100%;text-align:left;cursor:pointer;font-size:14px;font-weight:500;line-height:1.2}
.navitem:hover{background:rgba(255,255,255,.07)}
.navitem[aria-current="page"]{background:var(--rail-2);color:#fff;font-weight:600}
.navitem svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.navitem[aria-current="page"] svg{opacity:1}
.navitem .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;min-width:19px;text-align:center;font-variant-numeric:tabular-nums}
.navitem .badge.q{background:var(--rail-2);color:var(--rail-ink)}
.railfoot{padding:10px;border-top:1px solid rgba(255,255,255,.09);display:flex;gap:6px;align-items:center}
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

/* topbar */
#top{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 18px}
#burger{display:none}
.searchwrap{position:relative;flex:1 1 auto;max-width:520px}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
#gsearch{width:100%;padding:8px 10px 8px 31px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:14px}
#gsearch::placeholder{color:var(--ink-3)}
#gsearch:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
#sresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);max-height:min(64vh,460px);overflow-y:auto;z-index:60;padding:5px}
.sres{display:flex;gap:9px;align-items:center;padding:8px 9px;border-radius:7px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.sres:hover,.sres.sel{background:var(--surface-3)}
.sres .k{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);width:64px;flex:0 0 64px}
.sgroup{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 9px 4px}

#page{flex:1 1 auto;padding:20px 22px 90px;max-width:1480px;width:100%}
.phead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead .ptitle{flex:1 1 260px;min-width:0}
.phead h1{font-size:27px}
.phead .sub{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}

/* ============================== CONTROLS ============================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s;min-height:36px}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:5px 9px;font-size:12.5px;min-height:29px;border-radius:7px}
.btn.sm svg{width:13px;height:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.icon{padding:7px;min-height:34px;width:34px}
.btn.icon.sm{padding:5px;min-height:28px;width:28px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > label{font-size:11.5px;font-weight:600;letter-spacing:.045em;text-transform:uppercase;color:var(--ink-3)}
.inp,.sel,.ta{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14.5px;min-height:38px}
.ta{min-height:74px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sel{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2.5 4.5L6 8l3.5-3.5' fill='none' stroke='%2378888C' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 9px center;background-size:12px;padding-right:28px}
.inp[type=date],.inp[type=time]{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.money-in{position:relative}
.money-in .inp{padding-left:22px}
.money-in::before{content:"$";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px;pointer-events:none;z-index:1}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:5px 0}
.check input{width:17px;height:17px;accent-color:var(--brand);flex:0 0 17px;margin:0}

/* segmented */
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}

/* ============================== SURFACES ============================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card.pad{padding:16px}
.card.flat{border-radius:10px}
.chead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.chead h3{flex:1 1 auto;min-width:0;font-size:16.5px}
.cbody{padding:14px 16px}
.cbody.tight{padding:8px 10px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi .kl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kpi .kv{font-family:var(--cond);font-size:31px;font-weight:600;letter-spacing:.004em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .kd{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-top:1px}
.kpi.hero{background:linear-gradient(158deg, var(--rail) 0%, var(--rail-2) 100%);border-color:transparent;color:#fff}
.kpi.hero .kl{color:var(--rail-ink-dim)} .kpi.hero .kd{color:var(--rail-ink)}
.kpi.hero .kv{font-size:36px;color:#fff}
.kpi .spark{position:absolute;right:0;bottom:0;left:0;height:26px;opacity:.5;pointer-events:none}
.kpi.tap{cursor:pointer;text-align:left;width:100%;font:inherit}
.kpi.tap:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.015em;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.p-neutral{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.p-good{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.p-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.p-info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.p-brand{background:var(--brand-soft);color:var(--brand-strong);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);border:1px solid var(--line);color:var(--ink-2);font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:500}

/* tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:1}
.tbl th.srt{cursor:pointer;user-select:none}
.tbl th.srt:hover{color:var(--ink)}
.tbl th .car{opacity:.4;font-size:9px}
.tbl th[aria-sort] .car{opacity:1;color:var(--brand)}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nm{font-weight:600}
.tbl .sec{font-size:12.5px;color:var(--ink-3)}

/* mobile card list (replaces tables on phones) */
.mlist{display:none;flex-direction:column;gap:8px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.mrow:active{background:var(--surface-2)}
.mrow .l1{display:flex;align-items:center;gap:8px}
.mrow .l1 .t{font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .l2{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.mrow .l3{display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums;flex-wrap:wrap}

/* empty & misc */
.empty{text-align:center;padding:36px 18px;color:var(--ink-3)}
.empty svg{width:34px;height:34px;opacity:.35;margin-bottom:8px}
.empty h4{font-size:16px;color:var(--ink-2);margin-bottom:3px}
.hr{height:1px;background:var(--line-soft);margin:14px 0}
.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14px;align-items:baseline}
.kv:last-child{border-bottom:0}
.kv dt{flex:0 0 132px;color:var(--ink-3);font-size:12.5px}
.kv dd{margin:0;flex:1 1 auto;min-width:0;font-weight:500;overflow-wrap:anywhere}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .sel,.filters .inp{min-height:34px;padding:5px 9px;font-size:13.5px;width:auto;min-width:120px}
.filters .sel{padding-right:26px}
.count{font-size:12.5px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}

/* ============================== MODAL ============================== */
.scrim{position:fixed;inset:0;background:rgba(6,26,31,.5);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;margin:auto;border:1px solid var(--line);display:flex;flex-direction:column;max-height:calc(100vh - 52px)}
.modal.wide{max-width:900px}
.modal.slim{max-width:440px}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
.mhead h3{flex:1 1 auto;min-width:0}
.mbody{padding:18px;overflow-y:auto;flex:1 1 auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:0 0 auto;background:var(--surface-2);border-radius:0 0 13px 13px;flex-wrap:wrap}
.mfoot .spacer{flex:1 1 auto}

/* toast */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--rail);color:#fff;padding:10px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px;pointer-events:auto;animation:tin .2s ease}
.toast.err{background:var(--bad)}
.toast svg{width:16px;height:16px;flex:0 0 16px}
@keyframes tin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ============================== CHARTS ============================== */
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px 10px;display:flex;flex-direction:column;min-width:0}
.chartcard .ct{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.chartcard .ct h3{font-size:16px}
.chartcard .cs{font-size:12px;color:var(--ink-3);margin-bottom:9px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2.5px;display:inline-block}
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
svg.chart text{font-family:var(--sans);font-variant-numeric:tabular-nums}
.tipbox{position:fixed;z-index:150;background:var(--rail);color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;pointer-events:none;box-shadow:var(--shadow-lg);max-width:230px;line-height:1.42}
.tipbox .tt{font-weight:700;margin-bottom:3px;font-size:12px;letter-spacing:.02em}
.tipbox .tr{display:flex;gap:9px;align-items:center;font-variant-numeric:tabular-nums}
.tipbox .tr i{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.tipbox .tr .tv{margin-left:auto;font-weight:600}

/* bar list (used for source charts) */
.blist{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.brow{display:grid;grid-template-columns:minmax(78px,132px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.brow .bl{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{background:var(--surface-3);border-radius:4px;height:16px;overflow:hidden;position:relative}
.bfill{height:100%;border-radius:4px;min-width:2px}
.brow .bv{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;min-width:52px;text-align:right}

/* ============================== CALENDAR ============================== */
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:0 0 11px 11px;overflow:hidden}
.caldow{padding:7px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);text-align:center}
.calcell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;background:var(--surface);display:flex;flex-direction:column;gap:3px}
.calcell.out{background:var(--surface-2)}
.calcell.today{background:var(--brand-soft)}
.calcell.drop{outline:2px dashed var(--brand);outline-offset:-3px}
.caldate{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.calcell.today .caldate{color:var(--brand-strong);font-weight:700}
.calcell.out .caldate{color:var(--ink-3);font-weight:400}
.calev{border-radius:5px;padding:2px 5px;font-size:11.5px;font-weight:500;cursor:grab;border-left:3px solid;display:flex;gap:4px;align-items:baseline;background:var(--surface-3);line-height:1.3}
.calev .cet{font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--ink-3);flex:0 0 auto}
.calev .cen{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calev:active{cursor:grabbing}
.calev.dragging{opacity:.4}
.calmore{font-size:11px;color:var(--brand);cursor:pointer;padding:1px 5px;font-weight:600;background:none;border:0;text-align:left}
.daycol{display:flex;flex-direction:column;gap:7px}
.dayblk{display:grid;grid-template-columns:64px 1fr;gap:11px;align-items:start}
.dayblk .dt{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:9px;text-align:right;font-weight:600}
.dayblk .dl{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:11px;min-height:34px}
.evcard{border:1px solid var(--line);border-left:4px solid;border-radius:9px;padding:9px 11px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.evcard:hover{box-shadow:var(--shadow-sm)}
.evcard .e1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evcard .e1 .en{font-weight:600}
.evcard .e2{font-size:12.5px;color:var(--ink-3);display:flex;gap:11px;flex-wrap:wrap;align-items:center}

/* pipeline */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(182px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.pcol{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;min-height:104px}
.pcol > header{padding:9px 11px 7px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.pcol > header .pn{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcol > header .pc{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 6px;font-weight:600}
.pcol .pbody{padding:7px;display:flex;flex-direction:column;gap:6px;min-height:44px}
.pcol.drop{outline:2px dashed var(--brand);outline-offset:-2px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;font:inherit;color:inherit}
.lcard:hover{border-color:var(--brand)}
.lcard.dragging{opacity:.4}
.lcard .ln{font-weight:600;font-size:13.5px}
.lcard .lm{font-size:11.5px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.lcard .lv{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.pstat{font-size:11px;color:var(--ink-3);padding:0 11px 8px;font-variant-numeric:tabular-nums}

/* timeline */
.tline{position:relative;padding-left:22px}
.tline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.titem{position:relative;padding:0 0 15px}
.titem::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--brand);z-index:1}
.titem.q::before{border-color:var(--ink-3)}
.titem .td{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.titem .tb{font-size:14px;margin-top:1px}
.titem .tb b{font-weight:600}

/* files */
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.filecell{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2);position:relative;display:flex;flex-direction:column}
.filecell .th{aspect-ratio:4/3;background:var(--surface-3);display:flex;align-items:center;justify-content:center;overflow:hidden}
.filecell .th img{width:100%;height:100%;object-fit:cover}
.filecell .th svg{width:26px;height:26px;color:var(--ink-3)}
.filecell .fn{padding:5px 7px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.filecell .rm{position:absolute;top:4px;right:4px;background:rgba(8,51,60,.78);color:#fff;border:0;border-radius:6px;width:22px;height:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.filecell .rm svg{width:12px;height:12px}
.dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--ink-3);font-size:13px;cursor:pointer;background:var(--surface-2)}
.dropzone:hover,.dropzone.over{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* line items */
.li{display:grid;grid-template-columns:1fr 62px 96px 96px 30px;gap:7px;align-items:center}
.li.head{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 2px}
.li .inp{min-height:34px;padding:6px 8px;font-size:13.5px}
.li .tot{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;padding-right:3px}
.totbox{display:flex;flex-direction:column;gap:5px;margin-left:auto;width:min(288px,100%);font-size:14px}
.totbox .tl{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.totbox .tl.big{border-top:1px solid var(--line);padding-top:7px;margin-top:2px;font-size:17px;font-weight:700;font-family:var(--cond)}
.totbox .tl .lab{color:var(--ink-3)}

/* profit strip */
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pstrip > div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.pstrip .pl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pstrip .pv{font-family:var(--cond);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.marbar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.marbar i{display:block;height:100%;border-radius:3px}

/* print (estimates & invoices) */
.doc{background:#fff;color:#101A1C;padding:34px 38px;border-radius:10px;border:1px solid var(--line);font-size:13.5px}
.doc h1{font-family:var(--cond);font-size:31px;color:#08333C}
.doc .dhead{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;border-bottom:2px solid #08333C;padding-bottom:14px;margin-bottom:16px}
.doc table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
.doc th{text-align:left;border-bottom:1.5px solid #08333C;padding:6px 8px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#46565A}
.doc td{padding:7px 8px;border-bottom:1px solid #E3EAEA;vertical-align:top}
.doc .r{text-align:right;font-variant-numeric:tabular-nums}
@media print{
  #rail,#top,#tabbar,.pacts,.noprint{display:none !important}
  body,#page{background:#fff;padding:0}
  .doc{border:0;padding:0}
  .scrim{position:static;background:none;padding:0;display:block}
  .modal{max-width:none;box-shadow:none;border:0;max-height:none}
  .mhead,.mfoot{display:none}
  .mbody{padding:0;overflow:visible}
}

/* mobile tab bar */
#tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:45;padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(5,1fr)}
#tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;color:var(--ink-3);font-size:10px;font-weight:600;cursor:pointer;border-radius:8px;position:relative}
#tabbar button svg{width:20px;height:20px}
#tabbar button[aria-current="page"]{color:var(--brand)}
#tabbar button .bdg{position:absolute;top:2px;right:calc(50% - 17px);background:var(--bad);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
#fab{display:none;position:fixed;right:15px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:46;width:52px;height:52px;border-radius:26px;background:var(--brand);color:var(--on-brand);border:0;box-shadow:var(--shadow-lg);align-items:center;justify-content:center;cursor:pointer}
#fab svg{width:24px;height:24px}
.sheet{position:fixed;inset:0;z-index:110;background:rgba(6,26,31,.5);display:flex;align-items:flex-end}
.sheet .sc{background:var(--surface);width:100%;border-radius:16px 16px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow-y:auto}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:2px auto 10px}

/* banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;border:1px solid}
.banner svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px}
.banner.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.banner.info{background:var(--info-soft);border-color:var(--info-line);color:var(--info)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.banner b{font-weight:700}

/* dup warning */
.dupbox{border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--warn);display:flex;flex-direction:column;gap:7px}
.dupbox .dr{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dupbox .dr .grow{color:var(--ink)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 13px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button:hover{color:var(--ink)}

/* ============================== RESPONSIVE ============================== */
@media (max-width:1080px){ .grid4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1000px){
  :root{--rail-w:0px}
  #rail{position:fixed;left:0;top:0;bottom:0;width:230px;flex-basis:230px;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  #rail.open{transform:none}
  #burger{display:inline-flex}
  #tabbar{display:grid}
  #fab{display:flex}
  #page{padding:14px 14px 92px}
  #top{padding:8px 12px}
  .phead h1{font-size:23px}
  .grid3,.grid2{grid-template-columns:minmax(0,1fr)}
  .tblwrap{display:none}
  .mlist{display:flex}
  .calcell{min-height:74px}
  .li{grid-template-columns:1fr 52px 78px 78px 28px;gap:5px}
  .li .inp{font-size:13px;padding:5px 6px}
  .kpi .kv{font-size:27px}
  .doc{padding:18px}
  .scrim{padding:0}
  .modal{max-width:none;border-radius:14px 14px 0 0;margin:auto 0 0;max-height:94vh;border-bottom:0}
  .mfoot{border-radius:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .kv dt{flex-basis:104px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .kv{font-size:24px}
  .kpi.hero .kv{font-size:28px}
  .pstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .sel,.filters .inp{min-width:0;flex:1 1 128px}
  .brow{grid-template-columns:minmax(64px,96px) 1fr auto}
  .caldow{font-size:9px;padding:5px 2px}
  .calcell{min-height:58px;padding:2px 3px}
  .calev{font-size:10px;padding:1px 3px}
  .calev .cet{display:none}
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important;transition-duration:.01ms !important} }

const COST_CATS = {

const DEFAULT_SOURCES = ["Google","Google Ads","Facebook","Facebook Ads","Instagram","Nextdoor","Referral","Previous Customer","Yard Sign","Door Hanger","Truck / Vehicle Wrap","Website","HomeAdvisor","Angi","Thumbtack","Contractor","Property Manager","Builder","Repeat / Walk-in","Other"];
const SERIES = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];
const US_STATES = ["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY","DC"];

const DEFAULT_SETTINGS = {
  business:{name:"Overhead",legal:"",phone:"",email:"",website:"",street:"",city:"",state:"WA",zip:"",license:""},
  taxRate:8.9, laborRate:45, ccFeePct:2.9,
  invoiceTerms:"Net 15", estimateValidDays:30,
  invoiceNote:"Thank you for your business. Balance is due on the terms shown above.",
  estimateNote:"Price is valid until the expiration date shown. Final price may change if conditions differ from what was quoted.",
  warrantyDefault:"1 year labor, manufacturer warranty on parts.",
  followUpDays:14, currency:"USD"

/* Invoice term templates */
const INVOICE_TEMPLATES = {
  "NEW DOOR": "50% deposit required to schedule. Balance due upon completion. Payment accepted: cash, check, card, or ACH transfer. Invoices unpaid after 15 days will include 1% monthly interest.",
  "DOOR PARTS": "Payment due upon completion. Payment accepted: cash, check, card, or ACH transfer. Invoices unpaid after 15 days will include 1% monthly interest."
};
function expandTerms(t){ return INVOICE_TEMPLATES[t] || t; }

/* -------------------------------- utils --------------------------------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = (p)=> (p||"")+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function attr(s){ return esc(s).replace(/\n/g," "); }
const num = v => { const n = typeof v==="number"?v:parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isFinite(n)?n:0; };
const r2 = v => Math.round((num(v)+Number.EPSILON)*100)/100;

function money(v,opt){
  const n = num(v); const o = opt||{};
  const s = Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:o.cents?2:0,maximumFractionDigits:o.cents?2:0});
  return (n<0?"-$":"$")+s;
}
function money2(v){ return money(v,{cents:true}); }
function pct(v,d){ const n=num(v); return (d===undefined?1:d)?n.toFixed(1)+"%":Math.round(n)+"%"; }
function phoneFmt(p){
  const d = String(p||"").replace(/\D/g,"");
  if(d.length===10) return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
  if(d.length===11&&d[0]==="1") return "("+d.slice(1,4)+") "+d.slice(4,7)+"-"+d.slice(7);
  return p||"";
}
const digits = s => String(s||"").replace(/\D/g,"");

/* dates — everything stored as 'YYYY-MM-DD' (local calendar days) or ISO instants */
function pad(n){ return n<10?"0"+n:""+n; }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dOnly(iso){ return String(iso||"").slice(0,10); }
function toDate(iso){ if(!iso) return null; const p=dOnly(iso).split("-"); if(p.length!==3) return null; const d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?null:d; }
function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(iso,n){ const d=toDate(iso)||new Date(); d.setDate(d.getDate()+n); return isoOf(d); }
function addMonths(iso,n){ const d=toDate(iso)||new Date(); d.setMonth(d.getMonth()+n); return isoOf(d); }
function daysBetween(a,b){ const A=toDate(a),B=toDate(b); if(!A||!B) return 0; return Math.round((B-A)/86400000); }
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDate(iso){ const d=toDate(iso); if(!d) return "—"; return MON[d.getMonth()]+" "+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?", "+d.getFullYear():""); }
function fmtDateFull(iso){ const d=toDate(iso); if(!d) return "—"; return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); }
function fmtDow(iso){ const d=toDate(iso); if(!d) return ""; return DOW[d.getDay()]; }
function fmtTime(t){
  if(!t) return ""; const p=String(t).split(":"); if(p.length<2) return t;
  let h=+p[0]; const m=p[1]; const ap=h>=12?"pm":"am"; h=h%12||12; return h+(m==="00"?"":":"+m)+ap;
}
function relDay(iso){
  const t=todayISO(); const d=daysBetween(t,iso);
  if(d===0) return "Today"; if(d===1) return "Tomorrow"; if(d===-1) return "Yesterday";
  if(d>1&&d<7) return "In "+d+" days"; if(d<-1&&d>-7) return Math.abs(d)+" days ago";
  return fmtDate(iso);
}
function monthKey(iso){ return dOnly(iso).slice(0,7); }
function monthLabel(mk){ const p=mk.split("-"); return MON[+p[1]-1]+" "+String(p[0]).slice(2); }
function startOfWeek(iso){ const d=toDate(iso)||new Date(); d.setDate(d.getDate()-d.getDay()); return isoOf(d); }
function nowISO(){ return new Date().toISOString(); }
function fmtStamp(iso){
  if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return fmtDate(iso);
  return MON[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()+" · "+fmtTime(pad(d.getHours())+":"+pad(d.getMinutes()));
}

/* ==========================================================================
   STORAGE LAYER — Supabase + offline-first localStorage cache
   =========================================================================
   HOW IT WORKS:
   1. On first open, a setup screen collects your Supabase URL + anon key.
      These are saved to localStorage and never leave your device.
   2. Every write goes to localStorage first (instant, works offline),
      then syncs to Supabase in the background when online.
   3. On load, localStorage data is shown immediately so the app is
      never blank — Supabase data then merges in and wins on conflicts.
   4. When offline, everything keeps working locally. Supabase syncs
      when connectivity returns.
   5. All your data is in Supabase — completely separate from this app
      file. Update the app with Claude any time; your data is safe.

   SUPABASE SETUP (one time):
   • Go to supabase.com → New project (free tier)
   • Settings → API → copy "Project URL" and "anon/public" key
   • Paste them into the setup screen that appears on first launch
   • Run the SQL schema shown in the setup screen to create your tables
   ========================================================================== */

const COLLECTIONS = ["customers","leads","jobs","estimates","reminders","events","employees","expenses"];
const S = {customers:{},leads:{},jobs:{},estimates:{},reminders:{},events:{},employees:{},expenses:{},settings:null,sources:null};
let SUPA = null, SYNC = "connecting", READY = false;
const LSK = "overhead.crm.v2";
const CFG_KEY = "overhead.supabase.cfg";

function listOf(c){ return Object.values(S[c]||{}); }
const settings = ()=> S.settings || DEFAULT_SETTINGS;
function sourceList(){ return (S.sources && S.sources.list) ? S.sources.list : DEFAULT_SOURCES.map(n=>({id:slug(n),name:n,active:true,spend:{}})); }
function sourceName(id){ const s=sourceList().find(x=>x.id===id); return s?s.name:(id?String(id):"—"); }
function slug(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40)||uid("s"); }

/* ── local cache ── */
function saveLocal(){
  try{ localStorage.setItem(LSK, JSON.stringify(S)); }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LSK); if(!raw) return false;
    const d = JSON.parse(raw);
    COLLECTIONS.forEach(c=>{ if(d[c]) S[c]=d[c]; });
    if(d.settings) S.settings=d.settings;
    if(d.sources)  S.sources=d.sources;
    return true;
  }catch(e){ return false; }
}

/* ── Supabase config ── */
function loadCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch(e){ return null; } }
function saveCfg(url, key){ try{ localStorage.setItem(CFG_KEY, JSON.stringify({url,key})); }catch(e){} }
function clearCfg(){ try{ localStorage.removeItem(CFG_KEY); }catch(e){} }

/* ── Supabase REST helpers (no SDK needed) ── */
function supaFetch(cfg, path, opts){
  // Support both new publishable keys (sb_publishable_...) and legacy anon keys (eyJ...)
  const isNewKey = cfg.key && cfg.key.startsWith("sb_");
  const headers = isNewKey
    ? {"Authorization":"Bearer "+cfg.key,"Content-Type":"application/json","Prefer":"return=representation"}
    : {"apikey":cfg.key,"Authorization":"Bearer "+cfg.key,"Content-Type":"application/json","Prefer":"return=representation"};
  return fetch(cfg.url+"/rest/v1/"+path, Object.assign({headers}, opts));
}
async function supaSelect(cfg, table){
  const r = await supaFetch(cfg, table+"?select=*", {method:"GET"});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function supaUpsert(cfg, table, row){
  const r = await supaFetch(cfg, table+"?on_conflict=id", {method:"POST", headers:{"apikey":cfg.key,"Authorization":"Bearer "+cfg.key,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify(row)});
  if(!r.ok) throw new Error(await r.text());
}
async function supaDelete(cfg, table, id){
  const r = await supaFetch(cfg, table+"?id=eq."+encodeURIComponent(id), {method:"DELETE", headers:{"apikey":cfg.key,"Authorization":"Bearer "+cfg.key,"Prefer":"return=minimal"}});
  if(!r.ok) throw new Error(await r.text());
}
async function supaUpsertMeta(cfg, key, value){
  const r = await supaFetch(cfg, "overhead_meta?on_conflict=key", {method:"POST", headers:{"apikey":cfg.key,"Authorization":"Bearer "+cfg.key,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify({key, value:JSON.stringify(value)})});
  if(!r.ok) throw new Error(await r.text());
}
async function supaSelectMeta(cfg, key){
  const r = await supaFetch(cfg, "overhead_meta?key=eq."+encodeURIComponent(key)+"&select=value", {method:"GET"});
  if(!r.ok) throw new Error(await r.text());
  const rows = await r.json(); if(!rows.length) return null;
  try{ return JSON.parse(rows[0].value); }catch(e){ return null; }
}

/* ── offline queue — writes that happened while offline ── */
const OQ_KEY = "overhead.offlineq";
function oqLoad(){ try{ return JSON.parse(localStorage.getItem(OQ_KEY)||"[]"); }catch(e){ return []; } }
function oqSave(q){ try{ localStorage.setItem(OQ_KEY, JSON.stringify(q)); }catch(e){} }
function oqPush(op){ const q=oqLoad(); q.push(op); oqSave(q); }
async function oqFlush(cfg){
  const q=oqLoad(); if(!q.length) return;
  const remaining=[];
  for(const op of q){
    try{
      if(op.type==="upsert") await supaUpsert(cfg, op.table, op.row);
      else if(op.type==="delete") await supaDelete(cfg, op.table, op.id);
      else if(op.type==="meta") await supaUpsertMeta(cfg, op.key, op.value);
    }catch(e){ remaining.push(op); }
  }
  oqSave(remaining);
  if(remaining.length < q.length) toast("Synced "+( q.length-remaining.length)+" offline change"+(q.length-remaining.length===1?"":"s"));
}

async function tryConnect(){
  const btn = document.getElementById("setup-go");
  const err = document.getElementById("setup-err");
  const url = (document.getElementById("supa-url").value||"").trim().replace(/\/+$/,"");
  const key = (document.getElementById("supa-key").value||"").trim();
  err.style.display="none";
  if(!url || !key){ err.textContent="Please enter both your Project URL and anon key."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Testing connection…";
  try{
    // Support both new publishable keys (sb_publishable_...) and legacy anon keys (eyJ...)
    const isNewKey = key && key.startsWith("sb_");
    const testHeaders = isNewKey
      ? {"Authorization":"Bearer "+key}
      : {"apikey":key,"Authorization":"Bearer "+key};
    let r = await fetch(url+"/rest/v1/overhead_meta?limit=1", {headers:testHeaders});
    if(!r.ok){
      const t=await r.text();
      let msg;
      try{ const j=JSON.parse(t); msg=j.message||j.error||t; }catch(e){ msg=t; }
      if(r.status===401) throw new Error("Invalid key — make sure you copied the full Publishable key from API Keys.");
      if(r.status===404 || msg.includes("relation")||msg.includes("does not exist")) throw new Error("Tables not found — go back to Supabase, open SQL Editor, paste the SQL and click Run, then try again.");
      throw new Error("Error "+r.status+": "+msg.slice(0,200));
    }
    saveCfg(url, key);
    location.reload();
  }catch(e){
    btn.disabled=false; btn.textContent="Connect and open Overhead";
    err.textContent = e.message||"Could not connect. Check your URL and key."; err.style.display="block";
  }
}

/* ── main init ── */
async function initData(){
  const cfg = loadCfg();

  /* first run — show setup */
  if(!cfg){ showSetupScreen(); return; }

  /* offline-only mode (user skipped setup) */
  if(cfg.url==="__offline__"){
    SYNC="local"; loadLocal();
    if(!S.settings) S.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    if(!S.sources)  S.sources  = {list: DEFAULT_SOURCES.map(n=>({id:slug(n),name:n,active:true,spend:{}}))};
    READY=true; paintSync(); render(); return;
  }

  /* load local cache first so UI is instant */
  loadLocal();
  if(!S.settings) S.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  if(!S.sources)  S.sources  = {list: DEFAULT_SOURCES.map(n=>({id:slug(n),name:n,active:true,spend:{}}))};
  SUPA = cfg;
  SYNC="syncing"; READY=true; paintSync(); render();

  /* flush any offline queue */
  if(navigator.onLine){ oqFlush(cfg).catch(()=>{}); }

  /* pull from Supabase in background */
  try{
    const results = await Promise.all(COLLECTIONS.map(c=>supaSelect(cfg,c)));
    COLLECTIONS.forEach((c,i)=>{
      const next={};
      results[i].forEach(row=>{
        const data = typeof row.data==="string" ? JSON.parse(row.data) : (row.data||{});
        next[row.id] = Object.assign({id:row.id}, data);
      });
      /* merge: remote wins on id collision (it's newer) */
      S[c] = Object.assign({}, S[c], next);
    });
    /* meta */
    const sv = await supaSelectMeta(cfg,"settings");
    if(sv) S.settings = Object.assign({},DEFAULT_SETTINGS,sv);
    const src = await supaSelectMeta(cfg,"sources");
    if(src) S.sources = src;
    SYNC="live"; saveLocal(); paintSync(); render();
  }catch(e){
    console.warn("Supabase pull failed, working offline:", e.message);
    SYNC="error"; paintSync();
  }

  /* reconnect sync on focus */
  window.addEventListener("focus", async ()=>{
    if(!SUPA) return;
    try{ oqFlush(SUPA); }catch(e){}
    try{
      const results = await Promise.all(COLLECTIONS.map(c=>supaSelect(SUPA,c)));
      COLLECTIONS.forEach((c,i)=>{
        const next={};
        results[i].forEach(row=>{
          const data = typeof row.data==="string" ? JSON.parse(row.data) : (row.data||{});
          next[row.id] = Object.assign({id:row.id}, data);
        });
        S[c] = Object.assign({}, S[c], next);
      });
      const sv2 = await supaSelectMeta(SUPA,"settings"); if(sv2) S.settings=Object.assign({},DEFAULT_SETTINGS,sv2);
      const src2 = await supaSelectMeta(SUPA,"sources"); if(src2) S.sources=src2;
      SYNC="live"; saveLocal(); paintSync(); render();
    }catch(e){ SYNC="error"; paintSync(); }
  });
}

/* ── writes ── */
/* Optimistic: local first, Supabase in background, queue if offline */
async function put(coll, doc){
  if(!doc.id) doc.id = uid(coll[0]);
  doc.updatedAt = nowISO();
  S[coll][doc.id] = doc; saveLocal(); render();
  if(SUPA && SUPA.url!=="__offline__"){
    const row = {id:doc.id, data: (()=>{ const b=Object.assign({},doc); delete b.id; return b; })()};
    try{ await supaUpsert(SUPA, coll, row); SYNC="live"; paintSync(); }
    catch(e){
      if(!navigator.onLine){ oqPush({type:"upsert",table:coll,row}); SYNC="error"; paintSync(); }
      else toast("Cloud save failed — change saved locally.","err");
    }
  }
  return doc;
}
async function drop(coll, id){
  delete S[coll][id]; saveLocal(); render();
  if(SUPA && SUPA.url!=="__offline__"){
    try{ await supaDelete(SUPA, coll, id); }
    catch(e){
      if(!navigator.onLine){ oqPush({type:"delete",table:coll,id}); }
      else toast("Could not delete from cloud.","err");
    }
  }
}
async function putMeta(name, obj){
  S[name]=obj; saveLocal(); render();
  if(SUPA && SUPA.url!=="__offline__"){
    try{ await supaUpsertMeta(SUPA, name, obj); }
    catch(e){
      if(!navigator.onLine){ oqPush({type:"meta",key:name,value:obj}); }
      else toast("Could not save settings to cloud.","err");
    }
  }
}

/* ---------------------------- derived records --------------------------- */
function cust(id){ return S.customers[id]||null; }
function custName(c){ if(!c) return "—"; const n=((c.firstName||"")+" "+(c.lastName||"")).trim(); return n|| c.company || "Unnamed"; }
function custLabel(id){ const c=cust(id); return c?custName(c):"—"; }
function propOf(c, pid){
  if(!c) return null; const ps=c.properties||[];
  return ps.find(p=>p.id===pid) || ps[0] || null;
}
function addrLine(a){
  if(!a) return ""; const p=[a.street, [a.city,a.state].filter(Boolean).join(", "), a.zip].filter(Boolean);
  return p.join(" · ");
}
function addrOneLine(a){
  if(!a) return ""; return [a.street,a.city,a.state,a.zip].filter(Boolean).join(", ");
}
function jobAddr(j){
  const c=cust(j.customerId); const p=propOf(c,j.propertyId);
  return p ? {street:p.street,city:p.city,state:p.state,zip:p.zip,label:p.label} : (c&&c.billing?c.billing:null);
}

/* --- the money.  Tax is collected for the state, so it is never counted
       as revenue or profit; revenue is the price after any discount. ------ */
function jobFinance(j){
  const st = settings();
  const price = num(j.price), disc = num(j.discount);
  const subtotal = r2(Math.max(0, price - disc));
  const taxRate = j.taxRate==null ? num(st.taxRate) : num(j.taxRate);
  const taxable = j.taxExempt ? 0 : subtotal;
  const tax = r2(taxable * taxRate/100);
  const total = r2(subtotal + tax);
  const costs = (j.costs||[]);
  let material=0, labor=0, other=0;
  costs.forEach(c=>{
    const t = r2(c.total!=null ? num(c.total) : num(c.qty)*num(c.unit));
    if(MATERIAL_CATS.indexOf(c.cat)>=0) material+=t;
    else if(LABOR_CATS.indexOf(c.cat)>=0) labor+=t;
    else other+=t;
  });
  const costTotal = r2(material+labor+other);
  const profit = r2(subtotal - costTotal);
  const margin = subtotal>0 ? (profit/subtotal*100) : 0;
  const paid = r2((j.payments||[]).reduce((a,p)=>a+num(p.amount),0));
  const balance = r2(total - paid);
  return {price,disc,subtotal,taxRate,tax,total,material:r2(material),labor:r2(labor),other:r2(other),costTotal,profit,margin,paid,balance};
}
function invStatus(j){
  if(!j.invoice || !j.invoice.number) return j.status==="cancelled"?"cancelled":"none";
  if(j.invoice.status==="cancelled") return "cancelled";
  const f = jobFinance(j);
  if(f.total>0 && f.balance<=0.005) return "paid";
  if(j.invoice.status==="draft") return "draft";
  if(f.paid>0) return "partial";
  if(j.invoice.dueDate && daysBetween(j.invoice.dueDate, todayISO())>0) return "overdue";
  return "sent";
}
function isRecognised(j){ return DONE_STATUSES.indexOf(j.status)>=0; }
function jobDate(j){ return dOnly(j.completedAt||j.scheduledDate||j.createdAt||""); }
function jobSourceId(j){ if(j.sourceOverride) return j.sourceOverride; const c=cust(j.customerId); return c?c.source:null; }

function custRollup(cid){
  const jobs = listOf("jobs").filter(j=>j.customerId===cid && j.status!=="cancelled");
  const done = jobs.filter(isRecognised);
  let rev=0,cost=0,paid=0,bal=0;
  done.forEach(j=>{ const f=jobFinance(j); rev+=f.subtotal; cost+=f.costTotal; });
  jobs.forEach(j=>{ const f=jobFinance(j); paid+=f.paid; if(j.invoice&&j.invoice.number&&invStatus(j)!=="cancelled") bal+=Math.max(0,f.balance); });
  const dates = done.map(jobDate).filter(Boolean).sort();
  const upcoming = jobs.filter(j=>OPEN_STATUSES.indexOf(j.status)>=0 && j.scheduledDate && daysBetween(todayISO(),j.scheduledDate)>=0)
                       .sort((a,b)=>a.scheduledDate<b.scheduledDate?-1:1);
  return {
    jobs, done, count:done.length, revenue:r2(rev), cost:r2(cost), profit:r2(rev-cost),
    margin: rev>0?((rev-cost)/rev*100):0, paid:r2(paid), balance:r2(bal),
    first:dates[0]||null, last:dates[dates.length-1]||null,
    avg: done.length? r2(rev/done.length) : 0, upcoming
  };
}

/* --------------------------- date-range filter -------------------------- */
function rangeFor(key, custom){
  const t = todayISO(), d = toDate(t);
  const y = d.getFullYear(), m = d.getMonth();
  switch(key){
    case "today":     return {from:t,to:t,label:"Today"};
    case "week":      { const s=startOfWeek(t); return {from:s,to:addDays(s,6),label:"This week"}; }
    case "month":     return {from:isoOf(new Date(y,m,1)),to:isoOf(new Date(y,m+1,0)),label:"This month"};
    case "lastmonth": return {from:isoOf(new Date(y,m-1,1)),to:isoOf(new Date(y,m,0)),label:"Last month"};
    case "quarter":   { const q=Math.floor(m/3)*3; return {from:isoOf(new Date(y,q,1)),to:isoOf(new Date(y,q+3,0)),label:"This quarter"}; }
    case "year":      return {from:y+"-01-01",to:y+"-12-31",label:"This year"};
    case "lastyear":  return {from:(y-1)+"-01-01",to:(y-1)+"-12-31",label:"Last year"};
    case "all":       return {from:"1900-01-01",to:"2999-12-31",label:"All time"};
    case "custom":    return {from:(custom&&custom.from)||addDays(t,-30),to:(custom&&custom.to)||t,label:"Custom range"};
    default:          return {from:isoOf(new Date(y,m,1)),to:isoOf(new Date(y,m+1,0)),label:"This month"};
  }
}
function inRange(iso, r){ const d=dOnly(iso); return !!d && d>=r.from && d<=r.to; }

/* -------------------------------- router -------------------------------- */
let ROUTE = {view:"dashboard", id:null, q:{}};
const VIEWS = {};
function parseHash(){

  if(queryPart) queryPart.split("&").forEach(kv=>{ const [k,v]=kv.split("="); if(k) q[decodeURIComponent(k)]=decodeURIComponent(v||""); });
  return {view: seg[0]||"dashboard", id: seg[1]?decodeURIComponent(seg[1]):null, q};
}

let MODAL=null;

  closeModal();

  root.innerHTML =
    '<div class="scrim" role="dialog" aria-modal="true" aria-label="'+attr(opts.title||"Dialog")+'">'+
      '<div class="modal'+wide+'">'+
        '<div class="mhead"><h3>'+esc(opts.title||"")+'</h3>'+

        '<div class="mbody">'+(opts.body||"")+'</div>'+
        (opts.foot!==false?'<div class="mfoot">'+(opts.foot||'<button class="btn" data-mclose>Close</button>')+'</div>':'')+
      '</div></div>';
  MODAL = opts;
  const first = root.querySelector("input:not([type=hidden]),select,textarea");
  if(first && !opts.noFocus && window.innerWidth>1000) setTimeout(()=>first.focus(),40);
  if(opts.onMount) opts.onMount(root);
  root.querySelector(".scrim").addEventListener("mousedown",e=>{ if(e.target===e.currentTarget) closeModal(); });

function closeModal(){ const r=$("#modalroot"); if(r.innerHTML){ r.innerHTML=""; } MODAL=null; }
function closeAllTransient(){ closeModal(); const s=$(".sheet"); if(s) s.remove(); hideSearch(); hideTip(); }
function confirmDo(title, body, okLabel, fn, danger){
  openModal({title, size:"slim", body:'<p style="margin:0">'+esc(body)+'</p>',
    foot:'<button class="btn" data-mclose>Cancel</button><button class="btn '+(danger?"danger":"pri")+'" data-confirm>'+esc(okLabel||"Confirm")+'</button>',
    onMount(root){ root.querySelector("[data-confirm]").addEventListener("click",()=>{ closeModal(); fn(); }); }});
}
function sheet(title, html, onMount){
  const s=document.createElement("div"); s.className="sheet";
  s.innerHTML='<div class="sc"><div class="grab"></div>'+(title?'<div class="eyebrow" style="padding:0 4px 8px">'+esc(title)+'</div>':'')+html+'</div>';
  document.body.appendChild(s);
  s.addEventListener("click",e=>{ if(e.target===s) s.remove(); });
  if(onMount) onMount(s);
  return s;
}

/* ------------------------------ tooltip --------------------------------- */
let TIP=null;
function showTip(html,x,y){
  if(!TIP){ TIP=document.createElement("div"); TIP.className="tipbox"; document.body.appendChild(TIP); }
  TIP.innerHTML=html; TIP.style.display="block";
  const r=TIP.getBoundingClientRect();
  let left = x+14, top = y-r.height-12;
  if(left+r.width>window.innerWidth-10) left = x-r.width-14;
  if(left<8) left=8;
  if(top<8) top = y+18;
  TIP.style.left=left+"px"; TIP.style.top=top+"px";
}
function hideTip(){ if(TIP) TIP.style.display="none"; }

<script>
/* ==========================================================================
   Shared UI: form fields, pills, charts, export.

/* ------------------------------ form fields ----------------------------- */
function fText(n,l,v,o){ o=o||{};
  return '<div class="field"'+(o.style?' style="'+attr(o.style)+'"':'')+'><label for="f-'+attr(n)+'">'+esc(l)+'</label>'+
    '<input class="inp" id="f-'+attr(n)+'" name="'+attr(n)+'" type="'+(o.type||"text")+'" value="'+attr(v==null?"":v)+'"'+
    (o.ph?' placeholder="'+attr(o.ph)+'"':'')+(o.mode?' inputmode="'+attr(o.mode)+'"':'')+(o.ac?' autocomplete="'+attr(o.ac)+'"':'')+
    (o.req?' required':'')+(o.step?' step="'+attr(o.step)+'"':'')+'></div>'; }
function fMoney(n,l,v,o){ o=o||{};
  return '<div class="field"'+(o.style?' style="'+attr(o.style)+'"':'')+'><label for="f-'+attr(n)+'">'+esc(l)+'</label>'+
    '<div class="money-in"><input class="inp num" id="f-'+attr(n)+'" name="'+attr(n)+'" type="text" inputmode="decimal" value="'+attr(v==null||v===""?"":num(v))+'"'+(o.ph?' placeholder="'+attr(o.ph)+'"':'')+'></div></div>'; }
function fNum(n,l,v,o){ o=o||{}; return fText(n,l,v,Object.assign({mode:"decimal"},o)); }
function fDate(n,l,v,o){ return fText(n,l,dOnly(v),Object.assign({type:"date"},o||{})); }
function fTime(n,l,v,o){ return fText(n,l,v,Object.assign({type:"time"},o||{})); }
function fArea(n,l,v,o){ o=o||{};
  return '<div class="field"'+(o.style?' style="'+attr(o.style)+'"':'')+'><label for="f-'+attr(n)+'">'+esc(l)+'</label>'+
    '<textarea class="ta" id="f-'+attr(n)+'" name="'+attr(n)+'"'+(o.rows?' rows="'+o.rows+'"':'')+(o.ph?' placeholder="'+attr(o.ph)+'"':'')+'>'+esc(v==null?"":v)+'</textarea></div>'; }
function fSel(n,l,v,opts,o){ o=o||{};
  const items = Array.isArray(opts) ? opts.map(x=> typeof x==="string"?{v:x,l:x}:x)
                                    : Object.keys(opts).map(k=>({v:k,l:(typeof opts[k]==="object"?opts[k].l:opts[k])}));
  return '<div class="field"'+(o.style?' style="'+attr(o.style)+'"':'')+'><label for="f-'+attr(n)+'">'+esc(l)+'</label>'+
    '<select class="sel" id="f-'+attr(n)+'" name="'+attr(n)+'">'+

    items.map(i=>'<option value="'+attr(i.v)+'"'+(String(v)===String(i.v)?' selected':'')+'>'+esc(i.l)+'</option>').join("")+
    '</select></div>'; }
function fCheck(n,l,v){ return '<label class="check"><input type="checkbox" name="'+attr(n)+'"'+(v?" checked":"")+'><span>'+esc(l)+'</span></label>'; }

function readForm(root){
  const o={};
  $$("[name]",root).forEach(el=>{
    const k=el.getAttribute("name");
    if(el.type==="checkbox") o[k]=el.checked;
    else if(el.classList.contains("num")||el.dataset.num==="1") o[k]=el.value===""?null:num(el.value);

/* -------------------------------- pills --------------------------------- */
function pill(label, cls){ return '<span class="pill '+cls+'"><span class="dot"></span>'+esc(label)+'</span>'; }
function jobPill(st){ const s=JOB_STATUS[st]||JOB_STATUS.new; return pill(s.l,s.p); }
function estPill(st){ const s=EST_STATUS[st]||EST_STATUS.draft; return pill(s.l,s.p); }
function invPill(j){ const k=invStatus(j); const s=INV_STATUS[k]; return pill(s.l,s.p); }
function stagePill(st){ const s=LEAD_STAGES[st]||LEAD_STAGES.new;
  const cls = st==="won"?"p-good":st==="lost"?"p-neutral":st==="approved"||st==="job_scheduled"?"p-brand":"p-info";
  return pill(s.l,cls); }
function marginPill(m){

function emptyBox(icon,title,note,action){

}

/* ================================ CHARTS =================================
   Hand-drawn SVG on one scale per chart. Every label names a value the
   chart reaches; series colours come from the validated categorical set.
   ========================================================================= */
const CHARTS = {};
function niceMax(v){
  if(v<=0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/mag;
  const step = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return step*mag;
}
function axisTicks(max,count){
  const m = niceMax(max), c = count||4, out=[];
  for(let i=0;i<=c;i++) out.push(m*i/c);
  return out;
}
function shortMoney(v){
  const n=num(v);
  if(Math.abs(n)>=1000000) return "$"+(n/1000000).toFixed(n%1000000?1:0)+"m";
  if(Math.abs(n)>=1000) return "$"+(n/1000).toFixed(Math.abs(n)<10000&&n%1000?1:0)+"k";
  return "$"+Math.round(n);
}
function thinLabels(n){ return n<=7?1:n<=13?2:Math.ceil(n/6); }

/* line / area chart — one or two dollar series on a shared scale */
function lineChart(id, opts){
  const pts = opts.points||[];            // [{label, a, b}]
  const W=680, H=opts.height||208, PL=52, PR=14, PT=14, PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const maxV = Math.max(1, ...pts.map(p=>Math.max(num(p.a), num(p.b)||0)));
  const max = niceMax(maxV);
  const ticks = axisTicks(max,4);
  const n = Math.max(1,pts.length);
  const X = i => PL + (n===1? iw/2 : iw*i/(n-1));
  const Y = v => PT + ih - (num(v)/max)*ih;
  const path = k => pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[k]).toFixed(1)).join(" ");
  const area = "M"+X(0).toFixed(1)+" "+(PT+ih)+" "+pts.map((p,i)=>"L"+X(i).toFixed(1)+" "+Y(p.a).toFixed(1)).join(" ")+" L"+X(n-1).toFixed(1)+" "+(PT+ih)+" Z";
  const step = thinLabels(n);
  CHARTS[id] = {type:"line", pts, X, Y, W, H, PL, PR, PT, PB, opts};
  const lastA = pts.length?pts[pts.length-1].a:0, lastB = pts.length?pts[pts.length-1].b:0;
  return '<svg class="chart" id="'+id+'" data-chart="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+attr(opts.aria||"Chart")+'">'+
    ticks.map(t=>'<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>'+
      '<text x="'+(PL-8)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+esc(shortMoney(t))+'</text>').join("")+
    (opts.b!==false?'<defs><linearGradient id="g-'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="var(--s1)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#g-'+id+')" stroke="none"/>':'')+
    (opts.b!==false?'<path d="'+path("b")+'" fill="none" stroke="var(--s3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>':'')+
    '<path d="'+path("a")+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    pts.map((p,i)=> i%step===0||i===n-1 ? '<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" fill="var(--ink-3)">'+esc(p.label)+'</text>':'').join("")+
    (n?'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(lastA).toFixed(1)+'" r="3.6" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>':'')+
    (n&&opts.b!==false?'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(lastB).toFixed(1)+'" r="3.6" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/>':'')+
    '<line class="xh" x1="0" x2="0" y1="'+PT+'" y2="'+(PT+ih)+'" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>'+
    '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+(PT+ih)+'" y2="'+(PT+ih)+'" stroke="var(--axis)" stroke-width="1"/>'+
    '</svg>';
}

/* vertical bars — counts */
function barChart(id, opts){
  const pts = opts.points||[];            // [{label, a}]
  const W=680, H=opts.height||186, PL=44, PR=12, PT=14, PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  let max = niceMax(Math.max(1,...pts.map(p=>num(p.a))));
  let ticks;
  if(opts.integer!==false){
    /* counts: whole-number ticks only, so no axis ever reads "1, 1, 0" */
    const peak = Math.max(1, Math.ceil(Math.max(...pts.map(p=>num(p.a)), 1)));
    const step = peak<=4 ? 1 : peak<=8 ? 2 : Math.ceil(peak/4);
    max = Math.ceil(peak/step)*step;
    ticks=[]; for(let v=0; v<=max; v+=step) ticks.push(v);
  } else ticks = axisTicks(max, 4);
  const n=Math.max(1,pts.length);
  const slot = iw/n, bw = Math.max(4, Math.min(38, slot*0.62));
  const Y = v => PT+ih-(num(v)/max)*ih;
  const X = i => PL + slot*i + (slot-bw)/2;
  const step = thinLabels(n);
  CHARTS[id]={type:"bar",pts,X,Y,W,H,PL,PT,PB,slot,bw,opts,ih};
  const fmt = opts.fmt || (v=>String(Math.round(v)));
  return '<svg class="chart" id="'+id+'" data-chart="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+attr(opts.aria||"Chart")+'">'+
    ticks.map(t=>'<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>'+
      '<text x="'+(PL-8)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+esc(fmt(t))+'</text>').join("")+
    pts.map((p,i)=>{ const h=Math.max(num(p.a)>0?2:0, PT+ih-Y(p.a));
      return '<rect x="'+X(i).toFixed(1)+'" y="'+Y(p.a).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+(opts.color||"var(--s1)")+'"/>'; }).join("")+
    pts.map((p,i)=> i%step===0||i===n-1 ? '<text x="'+(X(i)+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" fill="var(--ink-3)">'+esc(p.label)+'</text>':'').join("")+
    '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+(PT+ih)+'" y2="'+(PT+ih)+'" stroke="var(--axis)" stroke-width="1"/>'+
    '</svg>';
}

/* horizontal bar list — always directly labelled with its value */
function barList(rows, opts){
  opts=opts||{};
  const max = Math.max(1,...rows.map(r=>num(r.v)));
  if(!rows.length) return '<div class="tiny muted" style="padding:14px 2px">Nothing in this period yet.</div>';
  return '<div class="blist">'+rows.map((r,i)=>
    '<div class="brow"'+(r.title?' title="'+attr(r.title)+'"':'')+'><div class="bl">'+esc(r.l)+'</div>'+
    '<div class="btrack"><div class="bfill" style="width:'+Math.max(1.5,num(r.v)/max*100).toFixed(1)+'%;background:'+(r.c||SERIES[i%8])+'"></div></div>'+
    '<div class="bv">'+esc(opts.fmt?opts.fmt(r.v):String(r.v))+'</div></div>').join("")+'</div>';
}
function legendRow(items){
  return '<div class="legend">'+items.map(i=>'<span><i style="background:'+i.c+'"></i>'+esc(i.l)+'</span>').join("")+'</div>';
}

/* chart hover — crosshair on lines, per-bar on bars */
function wireCharts(){
  $$("svg.chart[data-chart]").forEach(svg=>{
    const c = CHARTS[svg.dataset.chart]; if(!c) return;
    const move = ev=>{
      const t = ev.touches?ev.touches[0]:ev;
      const r = svg.getBoundingClientRect();
      const sx = (t.clientX-r.left)/r.width*c.W;
      let i;
      if(c.type==="line"){
        const n=c.pts.length; if(!n) return;
        const iw=c.W-c.PL-(c.PR||12);
        i = n===1?0:Math.round((sx-c.PL)/(iw/(n-1)));
      } else { i = Math.floor((sx-c.PL)/c.slot); }
      if(i<0||i>=c.pts.length){ hideTip(); const xh=svg.querySelector(".xh"); if(xh) xh.style.display="none"; return; }
      const p=c.pts[i];
      const xh=svg.querySelector(".xh");
      if(xh){ const x=c.X(i); xh.setAttribute("x1",x); xh.setAttribute("x2",x); xh.style.display=""; }
      const rows = c.opts.tip ? c.opts.tip(p,i)
        : '<div class="tr"><i style="background:var(--s1)"></i><span>'+esc(c.opts.aLabel||"Value")+'</span><span class="tv">'+esc((c.opts.fmt||money)(p.a))+'</span></div>'+
          (c.opts.b!==false&&p.b!=null?'<div class="tr"><i style="background:var(--s3)"></i><span>'+esc(c.opts.bLabel||"")+'</span><span class="tv">'+esc((c.opts.fmt||money)(p.b))+'</span></div>':'');
      showTip('<div class="tt">'+esc(p.full||p.label)+'</div>'+rows, t.clientX, t.clientY);
    };
    svg.addEventListener("mousemove",move);
    svg.addEventListener("touchstart",move,{passive:true});
    svg.addEventListener("touchmove",move,{passive:true});
    svg.addEventListener("mouseleave",()=>{ hideTip(); const xh=svg.querySelector(".xh"); if(xh) xh.style.display="none"; });
    svg.addEventListener("touchend",()=>setTimeout(hideTip,1800));
  });
}

/* ------------------------------- exporting ------------------------------ */
function csvCell(v){
  const s = v==null?"":String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(",")).join("\r\n"); }
async function saveFile(filename, text, mime){
  const data = text;
  try{
    const dl = await (window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null));
    if(dl){ await dl.save({filename, data}); toast("Saved "+filename); return true; }
  }catch(e){
    if(e && e.code==="cancelled") return false;
  }
  /* Running as a saved file on your own machine: a plain browser download works. */
  if(!window.claude){
    try{
      const blob = new Blob([data], {type: mime||"text/plain;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href=url; a.download=filename; a.style.display="none";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      toast("Saved "+filename+" to your Downloads folder");
      return true;
    }catch(e){}
  }
  // no download capability — hand the text over so nothing is lost
  openModal({title:"Copy your export", size:"wide",
    body:'<p class="tiny muted">Downloads are not available in this view. Select everything below and copy it into a file named <b>'+esc(filename)+'</b>.</p>'+
         '<textarea class="ta" id="exp-ta" style="min-height:320px;font-family:var(--mono);font-size:12px">'+esc(text)+'</textarea>',
    foot:'<button class="btn" data-mclose>Close</button><button class="btn pri" id="exp-copy">Copy to clipboard</button>',
    onMount(root){
      const ta=root.querySelector("#exp-ta");
      root.querySelector("#exp-copy").addEventListener("click",()=>{
        ta.select(); try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Press Ctrl/Cmd+C to copy","err"); }
      });
    }});
  return false;
}
function exportCSV(name, rows){ return saveFile(name.replace(/[^\w.\-]+/g,"_"), toCSV(rows), "text/csv"); }

/* mapping links — the viewer's own maps app does the routing */
function mapsUrl(addr){
  const q = encodeURIComponent(addrOneLine(addr));
  return "https://www.google.com/maps/search/?api=1&query="+q;
}
function routeUrl(stops){
  if(!stops.length) return "";
  const enc = s=>encodeURIComponent(addrOneLine(s));
  const dest = enc(stops[stops.length-1]);
  const way = stops.slice(0,-1).map(enc).join("|");
  return "https://www.google.com/maps/dir/?api=1&destination="+dest+(way?"&waypoints="+way:"")+"&travelmode=driving";
}

<script>
/* ==========================================================================
   Analytics engine + Dashboard
   ========================================================================== */

function buckets(r){
  const span = daysBetween(r.from,r.to);
  const out=[];
  if(span<=1){
    let d=r.from; while(d<=r.to){ out.push({key:d,from:d,to:d,label:fmtDow(d),full:fmtDateFull(d)}); d=addDays(d,1); }
    if(!out.length) out.push({key:r.from,from:r.from,to:r.from,label:fmtDow(r.from),full:fmtDateFull(r.from)});
  } else if(span<=45){
    let d=r.from; while(d<=r.to){ const dt=toDate(d); out.push({key:d,from:d,to:d,label:(dt.getMonth()+1)+"/"+dt.getDate(),full:fmtDateFull(d)}); d=addDays(d,1); }
  } else if(span<=200){
    let d=startOfWeek(r.from); while(d<=r.to){ const e=addDays(d,6); const dt=toDate(d);
      out.push({key:d,from:d,to:e,label:(dt.getMonth()+1)+"/"+dt.getDate(),full:"Week of "+fmtDateFull(d)}); d=addDays(d,7); }
  } else {
    let d=dOnly(r.from).slice(0,7)+"-01";
    while(d<=r.to){ const dt=toDate(d); const end=isoOf(new Date(dt.getFullYear(),dt.getMonth()+1,0));
      out.push({key:monthKey(d),from:d,to:end,label:MON[dt.getMonth()]+(dt.getMonth()===0?" "+String(dt.getFullYear()).slice(2):""),full:MONL[dt.getMonth()]+" "+dt.getFullYear()});
      d=addMonths(d,1); }
  }
  return out.length?out:[{key:r.from,from:r.from,to:r.to,label:"",full:r.label}];
}

/* Every headline number on the dashboard and in Reports comes from here. */
function analyze(r){
  const jobs = listOf("jobs");
  const done = jobs.filter(j=>isRecognised(j) && inRange(jobDate(j), r));
  let revenue=0, cost=0, material=0, labor=0, other=0, tax=0, collected=0;
  done.forEach(j=>{ const f=jobFinance(j); revenue+=f.subtotal; cost+=f.costTotal; material+=f.material; labor+=f.labor; other+=f.other; tax+=f.tax; collected+=f.paid; });
  revenue=r2(revenue); cost=r2(cost);
  const profit=r2(revenue-cost);
  const bk = buckets(r);
  const series = bk.map(b=>{
    let rv=0,pf=0,ct=0;
    done.forEach(j=>{ const d=jobDate(j); if(d>=b.from&&d<=b.to){ const f=jobFinance(j); rv+=f.subtotal; pf+=f.subtotal-f.costTotal; ct++; } });
    let nc=0;
    listOf("customers").forEach(c=>{ const d=dOnly(c.createdAt); if(d>=b.from&&d<=b.to) nc++; });
    let nl=0;
    listOf("leads").forEach(l=>{ const d=dOnly(l.receivedAt); if(d>=b.from&&d<=b.to) nl++; });
    return {label:b.label, full:b.full, a:r2(rv), b:r2(pf), jobs:ct, customers:nc, leads:nl};
  });
  return {
    range:r, jobs:done, count:done.length, revenue, cost, profit, material:r2(material), labor:r2(labor), other:r2(other),
    tax:r2(tax), collected:r2(collected),
    margin: revenue>0?(profit/revenue*100):0,
    avg: done.length?r2(revenue/done.length):0,
    series
  };
}

/* Per-source performance: leads in, customers won, money out, money back. */
function sourceStats(r){
  const srcs = sourceList();
  const jobs = listOf("jobs").filter(j=>isRecognised(j)&&inRange(jobDate(j),r));
  const leads = listOf("leads").filter(l=>inRange(l.receivedAt,r));
  const custs = listOf("customers").filter(c=>inRange(c.createdAt,r));
  const map={};
  srcs.forEach(s=> map[s.id]={id:s.id,name:s.name,leads:0,customers:0,jobs:0,revenue:0,profit:0,spend:0});
  const bucket = id => { if(!id) id="_none"; if(!map[id]) map[id]={id,name:id==="_none"?"Not recorded":sourceName(id),leads:0,customers:0,jobs:0,revenue:0,profit:0,spend:0}; return map[id]; };
  leads.forEach(l=> bucket(l.source).leads++);
  custs.forEach(c=> bucket(c.source).customers++);
  jobs.forEach(j=>{ const m=bucket(jobSourceId(j)); const f=jobFinance(j); m.jobs++; m.revenue+=f.subtotal; m.profit+=f.subtotal-f.costTotal; });
  // advertising spend recorded per source per month
  const months=[]; { let d=dOnly(r.from).slice(0,7)+"-01"; while(d<=r.to){ months.push(monthKey(d)); d=addMonths(d,1); } }
  srcs.forEach(s=>{ const sp=s.spend||{}; months.forEach(mk=>{ if(sp[mk]) map[s.id].spend+=num(sp[mk]); }); });
  return Object.values(map).map(m=>{
    m.revenue=r2(m.revenue); m.profit=r2(m.profit); m.spend=r2(m.spend);
    m.conv = m.leads? (m.customers/m.leads*100) : 0;
    m.avg  = m.jobs? r2(m.revenue/m.jobs) : 0;
    m.cac  = m.customers? r2(m.spend/m.customers) : (m.spend?null:0);
    m.roas = m.spend? (m.revenue/m.spend) : null;
    m.net  = r2(m.profit - m.spend);
    return m;
  }).filter(m=> m.leads||m.customers||m.jobs||m.spend)
    .sort((a,b)=> b.revenue-a.revenue || b.leads-a.leads);
}

/* Everything that wants attention right now, regardless of date filter. */
function attention(){
  const t=todayISO();
  const jobs=listOf("jobs");
  const upcoming = jobs.filter(j=>OPEN_STATUSES.indexOf(j.status)>=0 && j.scheduledDate && j.scheduledDate>=t)
                       .sort((a,b)=> (a.scheduledDate+(a.scheduledTime||"")) < (b.scheduledDate+(b.scheduledTime||"")) ? -1:1);
  const unscheduled = jobs.filter(j=>OPEN_STATUSES.indexOf(j.status)>=0 && !j.scheduledDate);
  const overdueJobs = jobs.filter(j=>OPEN_STATUSES.indexOf(j.status)>=0 && j.scheduledDate && j.scheduledDate<t);
  const openEst = listOf("estimates").filter(e=>["draft","sent","viewed"].indexOf(e.status)>=0);
  const unpaid = jobs.filter(j=>{const s=invStatus(j); return s==="sent"||s==="partial"||s==="overdue";})
                     .sort((a,b)=> (a.invoice.dueDate||"9999")<(b.invoice.dueDate||"9999")?-1:1);
  const overdueInv = unpaid.filter(j=>invStatus(j)==="overdue");
  const newLeads = listOf("leads").filter(l=>["new","contacted"].indexOf(l.stage)>=0)
                     .sort((a,b)=> (a.receivedAt||"")>(b.receivedAt||"")?-1:1);
  const dueRem = listOf("reminders").filter(r=>!r.done && dOnly(r.dueAt)<=t)
                     .sort((a,b)=>(a.dueAt||"")<(b.dueAt||"")?-1:1);
  const soonRem = listOf("reminders").filter(r=>!r.done && dOnly(r.dueAt)>t && daysBetween(t,dOnly(r.dueAt))<=7);
  const followUps = listOf("customers").filter(c=>c.nextFollowUp && dOnly(c.nextFollowUp)<=addDays(t,7))
                     .sort((a,b)=>(a.nextFollowUp||"")<(b.nextFollowUp||"")?-1:1);
  const recent = jobs.filter(j=>isRecognised(j)).sort((a,b)=> jobDate(a)<jobDate(b)?1:-1).slice(0,6);
  let unpaidTotal=0; unpaid.forEach(j=>unpaidTotal+=Math.max(0,jobFinance(j).balance));
  let estTotal=0; openEst.forEach(e=>estTotal+=estTotal0(e));
  return {upcoming,unscheduled,overdueJobs,openEst,unpaid,overdueInv,newLeads,dueRem,soonRem,followUps,recent,
          unpaidTotal:r2(unpaidTotal), estTotal:r2(estTotal)};
}
function estTotal0(e){ const f=estFinance(e); return f.total; }

        lineChart("ch-rev",{points:A.series,aLabel:"Revenue",bLabel:"Gross profit",aria:"Revenue and gross profit over "+r.label})+
        legendRow([{c:"var(--s1)",l:"Revenue · "+money0(A.revenue)},{c:"var(--s3)",l:"Gross profit · "+money0(A.profit)}])+

      '<div class="chartcard"><div class="ct"><h3>New customers</h3></div><div class="cs">First-time customers added per period</div>'+
        barChart("ch-acq",{points:A.series.map(s=>({label:s.label,full:s.full,a:s.customers})),color:"var(--s3)",

          tip:p=>'<div class="tr"><i style="background:var(--s3)"></i><span>New customers</span><span class="tv">'+p.a+'</span></div>'})+
      '</div>'+
      '<div class="chartcard"><div class="ct"><h3>Recently completed</h3></div><div class="cs">Last six jobs closed out</div>'+

function kpi(label,value,detail,cls){
